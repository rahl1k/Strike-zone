/* =========================

function moveStick(
    x,
    y
){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width/2;


    const centerY =
        rect.top +
        rect.height/2;


    let dx =
        x-centerX;


    let dy =
        y-centerY;


    const max=45;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if(distance>max){

        dx =
            dx/distance*max;

        dy =
            dy/distance*max;
    }


    joyX =
        dx/max;

    joyY =
        dy/max;


    stick.style.left =
        (42+dx)+"px";


    stick.style.top =
        (42+dy)+"px";


    status.textContent =
        "JOYSTICK: ON • POS: "+
        Math.round(playerX)+
        ","+
        Math.round(playerY);
}


/* =========================
   POINTER DOWN
========================= */

joystick.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        active=true;

        pointerId=
            e.pointerId;


        joystick.setPointerCapture(
            e.pointerId
        );


        moveStick(
            e.clientX,
            e.clientY
        );

    },
    {
        passive:false
    }
);


/* =========================
   POINTER MOVE
========================= */

joystick.addEventListener(
    "pointermove",
    function(e){

        if(
            !active ||
            e.pointerId !== pointerId
        )
            return;


        e.preventDefault();


        moveStick(
            e.clientX,
            e.clientY
        );

    },
    {
        passive:false
    }
);


/* =========================
   POINTER UP
========================= */

function releaseStick(){

    active=false;

    pointerId=null;

    joyX=0;

    joyY=0;

    stick.style.top="42px";


    status.textContent =
