/* =========================
   ELEMENTS
========================= */

const world =
    document.getElementById(
        "world"
    );

const player =
    document.getElementById(
        "player"
    );

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

const status =
    document.getElementById(
        "status"
    );


/* =========================
   PLAYER
========================= */

let playerX=500;

let playerY=500;


/* =========================
   JOYSTICK
========================= */

let joystickActive=false;

let joystickID=null;

let joyX=0;

let joyY=0;


function setJoystick(
    clientX,
    clientY
){

    const r =
        joystick.getBoundingClientRect();


    const centerX =
        r.left +
        r.width/2;

    const centerY =
        r.top +
        r.height/2;


    let dx =
        clientX-centerX;

    let dy =
        clientY-centerY;


    const max=45;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if(distance>max){

        dx =
            dx/distance*max;

        dy =
            dy/distance*max;
    }


    joyX =
        dx/max;

    joyY =
        dy/max;


    stick.style.left =
        (42+dx)+"px";

    stick.style.top =
        (42+dy)+"px";


    status.textContent =
        "TOUCH: YES • POS: "+
        Math.round(playerX)+
        ","+
        Math.round(playerY);
}


/* =========================
   POINTER DOWN
========================= */

joystick.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        joystickActive=true;

        joystickID=e.pointerId;


        if(
            joystick.setPointerCapture
        ){

            joystick.setPointerCapture(
                e.pointerId
            );
        }


        stick.style.background=
            "#00ff55";


        setJoystick(
            e.clientX,
            e.clientY
        );

    }
);


/* =========================
   POINTER MOVE
========================= */

joystick.addEventListener(
    "pointermove",
    function(e){

        if(
            !joystickActive ||
            e.pointerId !== joystickID
        )
            return;


        e.preventDefault();


        setJoystick(
            e.clientX,
            e.clientY
        );

    }
);


/* =========================
   RELEASE
========================= */

function releaseJoystick(){

    joystickActive=false;

    joystickID=null;

    joyX=0;

    joyY=0;


    stick.style.left="42px";

    stick.style.top="42px";

    stick.style.background=
        "rgba(255,255,255,.70)";


    status.textContent =
        "TOUCH: NO • POS: "+
        Math.round(playerX)+
        ","+
        Math.round(playerY);
}


joystick.addEventListener(
    "pointerup",
    releaseJoystick
);


joystick.addEventListener(
    "pointercancel",
    releaseJoystick
);


/* =========================
   CAMERA
========================= */

function updateCamera(){

    let cameraX =
        window.innerWidth/2 -
        playerX;


    let cameraY =
        window.innerHeight/2 -
        playerY;


    const minX =
        window.innerWidth -
        3000;


    const minY =
        window.innerHeight -
        2200;


    cameraX =
        Math.min(
            0,
            Math.max(
                minX,
                cameraX
            )
        );


    cameraY =
        Math.min(
            0,
            Math.max(
                minY,
                cameraY
            )
        );


    world.style.transform =
        "translate("+
        cameraX+
        "px,"+
        cameraY+
        "px)";
}

    if(
        reloading ||
        ammo>=30 ||
        reserve<=0
    )
        return;


    reloading=true;

    updateAmmo();


    setTimeout(
        function(){

            const need =
                30-ammo;


            const amount =
                Math.min(
                    need,
                    reserve
                );


            ammo+=amount;

            reserve-=amount;

            reloading=false;

            updateAmmo();

        },
        900
    );
}
