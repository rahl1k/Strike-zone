<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RAHL1K FPS</title>
<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
    touch-action:none;
}
/* НЕБО */
#sky{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:50%;
    background:#2980b9;
}
/* ЗЕМЛЯ */
#ground{
    position:absolute;
    left:0;
    top:50%;
    width:100%;
    height:50%;
    background:#3d3d3d;
}
/* КАРТА */
#road{
    position:absolute;
    left:25%;
    top:50%;
    width:50%;
    height:50%;
    background:#555;
}
/* КОРОБКИ */
.box{
    position:absolute;
    width:160px;
    height:130px;
    background:#8b5a2b;
    border:5px solid #4a2d15;
}
/* ВРАГ */
.enemy{
    position:absolute;
    left:70%;
    top:42%;
    width:45px;
    height:80px;
    background:#d62828;
}
.enemy:before{
    content:"";
    position:absolute;
    left:8px;
    top:-30px;
    width:29px;
    height:29px;
    border-radius:50%;
    background:#d9a17d;
}
/* ЗАГОЛОВОК */
#title{
    position:absolute;
    z-index:100;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font:bold 24px Arial;
    text-shadow:
        0 2px 5px black;
}
/* ПРИЦЕЛ */
#crosshair{
    position:absolute;
    z-index:100;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    transform:translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    width:30px;
    height:2px;
    background:white;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:14px;
    top:0;
    width:2px;
    height:30px;
    background:white;
}
/* ДЖОЙСТИК */
#joystick{
    position:absolute;
    z-index:200;
    left:25px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    border:3px solid rgba(255,255,255,.5);
}
#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
    border:2px solid white;
}
/* ОРУЖИЕ */
#gun{
    position:absolute;
    z-index:100;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:110px;
    height:100px;
    background:#111;
    border-radius:20px 20px 0 0;
}
/* ИНФОРМАЦИЯ */
#info{
    position:absolute;
    z-index:100;
    left:20px;
    top:50px;
    color:white;
    font:bold 18px Arial;
    text-shadow:0 2px 4px black;
}
</style>
</head>
<body>
<div id="sky"></div>
<div id="ground"></div>
<div id="road"></div>
<div class="box"
style="left:10%;top:35%;">
</div>
<div class="box"
style="right:10%;top:38%;">
</div>
<div class="box"
style="left:42%;top:30%;">
</div>
<div class="enemy"></div>
<div id="gun"></div>
<div id="title">
RAHL1K HTML FPS TEST 5
</div>
<div id="info">
HTML WORKS
</div>
<div id="crosshair"></div>
<div id="joystick">
<div id="stick"></div>
</div>
<script>
var joystick =
document.getElementById("joystick");
var stick =
document.getElementById("stick");
var info =
document.getElementById("info");
var active=false;
var startX=0;
var startY=0;
joystick.addEventListener(
"touchstart",
function(e){
    e.preventDefault();
    active=true;
    var t=e.touches[0];
    startX=t.clientX;
    startY=t.clientY;
},
{passive:false}
);
joystick.addEventListener(
"touchmove",
function(e){
    e.preventDefault();
    if(!active)
        return;
    var t=e.touches[0];
    var dx=t.clientX-startX;
    var dy=t.clientY-startY;
    if(dx>40) dx=40;
    if(dx<-40) dx=-40;
    if(dy>40) dy=40;
    if(dy<-40) dy=-40;
    stick.style.left=
        (40+dx)+"px";
    stick.style.top=
        (40+dy)+"px";
    info.innerHTML=
        "MOVE X: "+
        Math.round(dx)+
        " Y: "+
        Math.round(dy);
},
{passive:false}
);
joystick.addEventListener(
"touchend",
function(){
    active=false;
    stick.style.left="40px";
    stick.style.top="40px";
    info.innerHTML=
        "HTML WORKS";
}
);
</script>
</body>
</html>
