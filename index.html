<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>rahl1k • STRIKE ZONE 1.0</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#39474a;
    touch-action:none;
    font-family:Arial,sans-serif;
}
/* =========================
   МИР
========================= */
#map{
    position:absolute;
    width:3000px;
    height:2200px;
    background-color:#465356;
    background-image:
        linear-gradient(#ffffff12 2px,transparent 2px),
        linear-gradient(90deg,#ffffff12 2px,transparent 2px);
    background-size:100px 100px;
    will-change:transform;
}
/* =========================
   ДОРОГИ
========================= */
.road{
    position:absolute;
    background:#252b2e;
    border:4px solid #697477;
}
.r1{
    left:0;
    top:900px;
    width:3000px;
    height:300px;
}
.r2{
    left:1350px;
    top:0;
    width:300px;
    height:2200px;
}
/* =========================
   ЗДАНИЯ
========================= */
.building{
    position:absolute;
    background:#15191b;
    border:5px solid #899397;
    box-shadow:inset 0 0 0 8px #252b2d;
}
.b1{
    left:180px;
    top:180px;
    width:650px;
    height:150px;
}
.b2{
    left:180px;
    top:180px;
    width:150px;
    height:650px;
}
.b3{
    left:1900px;
    top:180px;
    width:650px;
    height:150px;
}
.b4{
    left:2400px;
    top:180px;
    width:150px;
    height:650px;
}
.b5{
    left:180px;
    top:1450px;
    width:700px;
    height:150px;
}
.b6{
    left:180px;
    top:1450px;
    width:150px;
    height:550px;
}
.b7{
    left:1900px;
    top:1450px;
    width:650px;
    height:150px;
}
.b8{
    left:2400px;
    top:1450px;
    width:150px;
    height:550px;
}
.b9{
    left:1100px;
    top:650px;
    width:750px;
    height:130px;
}
.b10{
    left:1100px;
    top:1420px;
    width:750px;
    height:130px;
}
.b11{
    left:1300px;
    top:950px;
    width:400px;
    height:130px;
}
/* =========================
   КОНТЕЙНЕРЫ
========================= */
.container{
    position:absolute;
    width:180px;
    height:80px;
    background:#596c70;
    border:4px solid #a2abad;
}
.c1{
    left:700px;
    top:500px;
}
.c2{
    left:2150px;
    top:500px;
}
.c3{
    left:700px;
    top:1150px;
}
.c4{
    left:2150px;
    top:1150px;
}
/* =========================
   ИГРОК
========================= */
#player{
    position:absolute;
    width:54px;
    height:54px;
    border-radius:50%;
    background:#1688ff;
    border:4px solid white;
    box-shadow:0 0 15px #000;
    transform:translate(-50%,-50%);
    z-index:50;
}
/* направление взгляда */
#player::after{
    content:"";
    position:absolute;
    right:-32px;
    top:19px;
    width:32px;
    height:7px;
    border-radius:5px;
    background:white;
}
/* =========================
   БОТЫ
========================= */
.bot{
    position:absolute;
    width:54px;
    height:54px;
    border-radius:50%;
    background:#d93640;
    border:4px solid white;
    box-shadow:0 0 12px #000;
    transform:translate(-50%,-50%);
    z-index:40;
    transition:background .1s;
}
.bot.dead{
    display:none;
}
/* =========================
   HP БОТА
========================= */
.botHP{
    position:absolute;
    width:70px;
    height:6px;
    left:50%;
    top:-14px;
    transform:translateX(-50%);
    background:#111;
    border:1px solid #000;
}
.botHPbar{
    height:100%;
    width:100%;
    background:#32d06b;
}
/* =========================
   HUD
========================= */
#hud{
    position:fixed;
    inset:0;
    z-index:200;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 5px #000;
}
#title{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:27px;
    font-weight:bold;
    white-space:nowrap;
}
#status{
    position:absolute;
    top:48px;
    left:50%;
    transform:translateX(-50%);
    font-size:14px;
    color:#00ff55;
    white-space:nowrap;
}
#hp{
    position:absolute;
    left:20px;
    bottom:20px;
    font-size:22px;
    font-weight:bold;
}
#ammo{
    position:absolute;
    right:20px;
    bottom:20px;
    font-size:22px;
    font-weight:bold;
}
/* =========================
   ПРИЦЕЛ
========================= */
#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    transform:translate(-50%,-50%);
    z-index:150;
}
#crosshair::before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    width:30px;
    height:2px;
    background:white;
}
#crosshair::after{
    content:"";
    position:absolute;
    left:14px;
    top:0;
    width:2px;
    height:30px;
    background:white;
}
/* =========================
   ДЖОЙСТИК
========================= */
#joystick{
    position:fixed;
    left:30px;
    bottom:30px;
    width:150px;
    height:150px;
    border-radius:50%;
    background:#ffffff22;
    border:4px solid #ffffff88;
    z-index:500;
    touch-action:none;
}
#stick{
    position:absolute;
    left:42px;
    top:42px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#ffffff88;
    border:3px solid white;
    pointer-events:none;
}
/* =========================
   FIRE
========================= */
#fire{
    position:fixed;
    right:25px;
    bottom:90px;
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid white;
    background:#a52129;
    color:white;
    font-weight:bold;
    font-size:16px;
    z-index:500;
    touch-action:none;
}
/* =========================
   RELOAD
========================= */
#reload{
    position:fixed;
    right:130px;
    bottom:30px;
    width:105px;
    height:45px;
    border-radius:12px;
    border:2px solid white;
    background:#222;
    color:white;
    font-weight:bold;
    z-index:500;
    touch-action:none;
}
/* =========================
   СООБЩЕНИЕ
========================= */
#message{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:600;
    text-align:center;
    font-size:36px;
    font-weight:bold;
    color:white;
    text-shadow:0 3px 8px #000;
    pointer-events:none;
}
#restart{
    display:none;
    position:fixed;
    left:50%;
    top:65%;
    transform:translate(-50%,-50%);
    z-index:600;
    width:180px;
    height:55px;
    border-radius:14px;
    border:2px solid white;
    background:#222;
    color:white;
    font-weight:bold;
    font-size:16px;
    touch-action:none;
}
/* =========================
   ПОВОРОТ
========================= */
#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:22px;
}
</style>
</head>
<body>
<div id="map">
<div class="road r1"></div>
<div class="road r2"></div>
<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>
<div class="building b7"></div>
<div class="building b8"></div>
<div class="building b9"></div>
<div class="building b10"></div>
<div class="building b11"></div>
<div class="container c1"></div>
<div class="container c2"></div>
<div class="container c3"></div>
<div class="container c4"></div>
<div id="player"></div>
<div class="bot"
     data-hp="100"
     style="left:2450px;top:500px">
    <div class="botHP">
        <div class="botHPbar"></div>
    </div>
</div>
<div class="bot"
     data-hp="100"
     style="left:2300px;top:1050px">
    <div class="botHP">
        <div class="botHPbar"></div>
    </div>
</div>
<div class="bot"
     data-hp="100"
     style="left:2450px;top:1900px">
    <div class="botHP">
        <div class="botHPbar"></div>
    </div>
</div>
<div class="bot"
     data-hp="100"
     style="left:700px;top:1900px">
    <div class="botHP">
        <div class="botHPbar"></div>
    </div>
</div>
<div class="bot"
     data-hp="100"
     style="left:1500px;top:1850px">
    <div class="botHP">
        <div class="botHPbar"></div>
    </div>
</div>
</div>
<div id="rotate">
↔️<br><br>
Поверни iPhone<br>
горизонтально
</div>
<div id="hud">
<div id="title">
    rahl1k • STRIKE ZONE 1.0
</div>
<div id="status">
    JOYSTICK OFF • 5 ENEMIES
</div>
<div id="crosshair"></div>
<div id="hp">
    HP 100
</div>
<div id="ammo">
    30 / 90
</div>
</div>
<div id="joystick">
<div id="stick"></div>
</div>
<button id="fire">
    FIRE
</button>
<button id="reload">
    RELOAD
</button>
<div id="message"></div>
<button id="restart">
    PLAY AGAIN
</button>
<script>
/* =========================
   ЭЛЕМЕНТЫ
========================= */
const map =
    document.getElementById("map");
const player =
    document.getElementById("player");
const joystick =
    document.getElementById("joystick");
const stick =
    document.getElementById("stick");
const status =
    document.getElementById("status");
const fireButton =
    document.getElementById("fire");
const reloadButton =
    document.getElementById("reload");
const message =
    document.getElementById("message");
const restart =
    document.getElementById("restart");
const hpText =
    document.getElementById("hp");
const ammoText =
    document.getElementById("ammo");
/* =========================
   ИГРОК
========================= */
let playerX=500;
let playerY=500;
let angle=0;
let hp=100;
/* =========================
   ОРУЖИЕ
========================= */
let ammo=30;
let reserve=90;
let reloading=false;
let muzzleFlash=0;
/* =========================
   ДЖОЙСТИК
========================= */
let joyX=0;
let joyY=0;
let joystickActive=false;
let joystickPointer=null;
function moveJoystick(
    clientX,
    clientY
){
    const rect =
        joystick.getBoundingClientRect();
    const centerX =
        rect.left+
        rect.width/2;
    const centerY =
        rect.top+
        rect.height/2;
    let dx =
        clientX-centerX;
    let dy =
        clientY-centerY;
    const max=45;
    const distance =
        Math.hypot(dx,dy);
    if(distance>max){
        dx=dx/distance*max;
        dy=dy/distance*max;
    }
    joyX=dx/max;
    joyY=dy/max;
    stick.style.left =
        (42+dx)+"px";
    stick.style.top =
        (42+dy)+"px";
    status.textContent =
        "JOYSTICK ON • "+
        Math.round(playerX)+
        ","+
        Math.round(playerY);
}
joystick.addEventListener(
    "pointerdown",
    function(e){
        e.preventDefault();
        joystickActive=true;
        joystickPointer=
            e.pointerId;
        joystick.setPointerCapture(
            e.pointerId
        );
        moveJoystick(
            e.clientX,
            e.clientY
        );
    },
    {passive:false}
);
joystick.addEventListener(
    "pointermove",
    function(e){
        if(
            !joystickActive ||
            e.pointerId!==joystickPointer
        )
            return;
        e.preventDefault();
        moveJoystick(
            e.clientX,
            e.clientY
        );
    },
    {passive:false}
);
function releaseJoystick(){
    joystickActive=false;
    joystickPointer=null;
    joyX=0;
    joyY=0;
    stick.style.left="42px";
    stick.style.top="42px";
    status.textContent =
        "JOYSTICK OFF • "+
        Math.round(playerX)+
        ","+
        Math.round(playerY);
}
joystick.addEventListener(
    "pointerup",
    releaseJoystick
);
joystick.addEventListener(
    "pointercancel",
    releaseJoystick
);
/* =========================
   СВАЙП КАМЕРЫ
========================= */
let lookActive=false;
let lookPointer=null;
let lastLookX=0;
document.addEventListener(
    "pointerdown",
    function(e){
        if(
            e.target===joystick ||
            joystick.contains(e.target) ||
            e.target===fireButton ||
            e.target===reloadButton ||
            e.target===restart
        )
            return;
        if(
            e.clientX >
            window.innerWidth*0.45
        ){
            lookActive=true;
            lookPointer=
                e.pointerId;
            lastLookX=
                e.clientX;
        }
    }
);
document.addEventListener(
    "pointermove",
    function(e){
        if(
            !lookActive ||
            e.pointerId!==lookPointer
        )
            return;
        const dx =
            e.clientX-lastLookX;
        angle +=
            dx*0.008;
        lastLookX=
            e.clientX;
        player.style.transform =
            "translate(-50%,-50%) rotate("+
            angle+
            "rad)";
        const deg =
            angle*180/Math.PI;
        status.textContent =
            "LOOK "+
            Math.round(deg)+
            "° • "+
            Math.round(playerX)+
            ","+
            Math.round(playerY);
    }
);
document.addEventListener(
    "pointerup",
    function(e){
        if(
            e.pointerId===lookPointer
        ){
            lookActive=false;
            lookPointer=null;
        }
    }
);
/* =========================
   КАМЕРА
========================= */
function updateCamera(){

    let cx =
        window.innerWidth / 2 - playerX;

    let cy =
        window.innerHeight / 2 - playerY;

    const minX =
        window.innerWidth - 3000;

    const minY =
        window.innerHeight - 2200;

    cx =
        Math.min(
            0,
            Math.max(minX, cx)
        );

    cy =
        Math.min(
            0,
            Math.max(minY, cy)
        );

    map.style.transform =
        "translate(" + cx + "px," + cy + "px)";
}
/* =========================
   БОТЫ
========================= */
const bots =
    Array.from(
        document.querySelectorAll(".bot")
    );
let gameEnded=false;
function updateBots(dt){
    if(gameEnded)
        return;
    for(
        const bot of bots
    ){
        if(
            bot.classList.contains("dead")
        )
            continue;
        const bx =
            parseFloat(bot.style.left);
        const by =
            parseFloat(bot.style.top);
        const dx =
            playerX-bx;
        const dy =
            playerY-by;
        const distance =
            Math.hypot(dx,dy);
        if(distance>90){
            const speed=45;
            const nx =
                bx+
                dx/distance*
                speed*
                dt;
            const ny =
                by+
                dy/distance*
                speed*
                dt;
            bot.style.left=
                nx+"px";
            bot.style.top=
                ny+"px";
        }else{
            bot.enemyCooldown =
                (bot.enemyCooldown||0)-
                dt;
            if(
                bot.enemyCooldown<=0
            ){
                hp-=7;
                bot.enemyCooldown=1;
            }
        }
    }
}
/* =========================
   СТРЕЛЬБА
========================= */
function shoot(){
    if(
        gameEnded ||
        reloading
    )
        return;
    if(ammo<=0){
        reload();
        return;
    }
    ammo--;
    muzzleFlash=.08;
    let target=null;
    let closest=Infinity;
    for(
        const bot of bots
    ){
        if(
            bot.classList.contains("dead")
        )
            continue;
        const bx =
            parseFloat(bot.style.left);
        const by =
            parseFloat(bot.style.top);
        const dx =
            bx-playerX;
        const dy =
            by-playerY;
        const distance =
            Math.hypot(dx,dy);
        if(distance>900)
            continue;
        let a =
            Math.atan2(dy,dx)-
            angle;
        a =
            Math.atan2(
                Math.sin(a),
                Math.cos(a)
            );
        if(
            Math.abs(a)<0.15 &&
            distance<closest
        ){
            closest=distance;
            target=bot;
        }
    }
    if(target){
        let botHP =
            Number(
                target.dataset.hp
            );
        botHP-=50;
        target.dataset.hp=
            botHP;
        const bar =
            target.querySelector(
                ".botHPbar"
            );
        bar.style.width =
            Math.max(
                0,
                botHP
            )+"%";
        if(botHP<=0){
            target.classList.add(
                "dead"
            );
        }
    }
}
fireButton.addEventListener(
    "pointerdown",
    function(e){
        e.preventDefault();
        shoot();
    },
    {passive:false}
);
/* =========================
   ПЕРЕЗАРЯДКА
========================= */
function reload(){
    if(
        reloading ||
        ammo>=30 ||
        reserve<=0
    )
        return;
    reloading=true;
    updateHUD();
    setTimeout(
        function(){
            const need=
                30-ammo;
            const amount=
                Math.min(
                    need,
                    reserve
                );
            ammo+=amount;
            reserve-=amount;
            reloading=false;
            updateHUD();
        },
        900
    );
}
reloadButton.addEventListener(
    "pointerdown",
    function(e){
        e.preventDefault();
        reload();
    },
    {passive:false}
);
/* =========================
   HUD
========================= */
function updateHUD(){
    hpText.textContent=
        "HP "+
        Math.max(
            0,
            Math.floor(hp)
        );
    ammoText.textContent=
        reloading
        ? "RELOADING..."
        :
        ammo+
        " / "+
        reserve;
}
/* =========================
   ПРОВЕРКА ПОБЕДЫ
========================= */
function checkGame(){
    if(
        hp<=0 &&
        !gameEnded
    ){
        hp=0;
        gameEnded=true;
        message.textContent=
            "YOU DIED";
        message.style.display=
            "block";
        restart.style.display=
            "block";
        return;
    }
    const alive =
        bots.filter(
            b=>
                !b.classList.contains("dead")
        ).length;
    if(
        alive===0 &&
        !gameEnded
    ){
        gameEnded=true;
        message.textContent=
            "ROUND WON!";
        message.style.display=
            "block";
        restart.style.display=
            "block";
    }
}
/* =========================
   RESET
========================= */
function resetGame(){
    playerX=500;
    playerY=500;
    angle=0;
    hp=100;
    ammo=30;
    reserve=90;
    reloading=false;
    gameEnded=false;
    player.style.left=
        playerX+"px";
    player.style.top=
        playerY+"px";
    player.style.transform=
        "translate(-50%,-50%) rotate(0rad)";
    const positions=[
        [2450,500],
        [2300,1050],
        [2450,1900],
        [700,1900],
        [1500,1850]
    ];
    bots.forEach(
        (bot,i)=>{
            bot.classList.remove(
                "dead"
            );
            bot.dataset.hp=100;
            bot.style.left=
                positions[i][0]+"px";
            bot.style.top=
                positions[i][1]+"px";
            bot.querySelector(
                ".botHPbar"
            ).style.width=
                "100%";
            bot.enemyCooldown=0;
        }
    );
    message.style.display=
        "none";
    restart.style.display=
        "none";
    updateHUD();
    updateCamera();
}
restart.addEventListener(
    "pointerdown",
    function(e){
        e.preventDefault();
        resetGame();
    },
    {passive:false}
);
/* =========================
   ORIENTATION
========================= */
function orientation(){
    document.getElementById(
        "rotate"
    ).style.display=
        window.innerHeight>
        window.innerWidth
        ? "flex"
        : "none";
}
window.addEventListener(
    "resize",
    orientation
);
/* =========================
   GAME LOOP
========================= */
let last=
    performance.now();
function loop(now){
    const dt=
        Math.min(
            .05,
            (now-last)/1000
        );
    last=now;
    if(
        !gameEnded
    ){
        if(joystickActive){
            const speed=300;
            playerX +=
                joyX*
                speed*
                dt;
            playerY +=
                joyY*
                speed*
                dt;
            playerX=
                Math.max(
                    30,
                    Math.min(
                        2970,
                        playerX
                    )
                );
            playerY=
                Math.max(
                    30,
                    Math.min(
                        2170,
                        playerY
                    )
                );
        }
        updateBots(dt);
        checkGame();
    }
    player.style.left=
        playerX+"px";
    player.style.top=
        playerY+"px";
    updateCamera();
    updateHUD();
    requestAnimationFrame(
        loop
    );
}
/* =========================
   START
========================= */
resetGame();
orientation();
requestAnimationFrame(
    loop
);
</script>
</body>
</html>
