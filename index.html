<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Strike Zone</title>
<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    touch-action:none;
}
#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}
#title{
    position:fixed;
    z-index:20;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font:bold 21px Arial;
    text-shadow:0 2px 5px #000;
}
#hp{
    position:fixed;
    z-index:20;
    left:22px;
    top:15px;
    color:white;
    font:bold 18px Arial;
    text-shadow:0 2px 5px #000;
}
#ammo{
    position:fixed;
    z-index:20;
    right:22px;
    bottom:22px;
    color:white;
    font:bold 20px Arial;
    text-shadow:0 2px 5px #000;
}
#crosshair{
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;
    width:24px;
    height:24px;
    transform:translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    left:0;
    top:11px;
    width:24px;
    height:2px;
    background:white;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:11px;
    top:0;
    width:2px;
    height:24px;
    background:white;
}
#joystick{
    position:fixed;
    z-index:100;
    left:25px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:#ffffff22;
    border:3px solid #ffffff66;
    touch-action:none;
}
#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ffffff77;
    border:2px solid #ffffffaa;
    pointer-events:none;
}
#fire{
    position:fixed;
    z-index:100;
    right:28px;
    bottom:85px;
    width:82px;
    height:82px;
    border-radius:50%;
    border:2px solid #ffffff77;
    background:#a52222cc;
    color:white;
    font:bold 15px Arial;
    touch-action:none;
}
#reload{
    position:fixed;
    z-index:100;
    right:125px;
    bottom:25px;
    width:105px;
    height:45px;
    border-radius:12px;
    border:1px solid #ffffff66;
    background:#222c;
    color:white;
    font:bold 14px Arial;
    touch-action:none;
}
#message{
    display:none;
    position:fixed;
    z-index:200;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    color:white;
    font:bold 30px Arial;
    text-shadow:0 3px 6px #000;
}
#restart{
    display:none;
    position:fixed;
    z-index:200;
    left:50%;
    top:68%;
    transform:translate(-50%,-50%);
    width:180px;
    height:55px;
    border-radius:14px;
    border:1px solid white;
    background:#222d;
    color:white;
    font:bold 16px Arial;
}
</style>
</head>
<body>
<div id="title">rahl1k FPS</div>
<div id="hp">HP 100</div>
<div id="ammo">30 / 90</div>
<div id="crosshair"></div>
<div id="joystick">
    <div id="stick"></div>
</div>

FIRE

RELOAD

<div id="message"></div>

PLAY AGAIN

<script>
/* =====================================================
   CANVAS
===================================================== */
const canvas =
    document.getElementById("game");
const ctx =
    canvas.getContext("2d");
let W=window.innerWidth;
let H=window.innerHeight;
function resize(){
    W=window.innerWidth;
    H=window.innerHeight;
    canvas.width=W;
    canvas.height=H;
}
window.addEventListener(
    "resize",
    resize
);
resize();
/* =====================================================
   ИГРОК
===================================================== */
const player={
    x:650,
    y:600,
    angle:0,
    hp:100
};
/* =====================================================
   ОРУЖИЕ
===================================================== */
let ammo=30;
let reserve=90;
let reloading=false;
let muzzleFlash=0;
/* =====================================================
   КАРТА
===================================================== */
const walls=[
    /* внешняя граница */
    {x:100,y:100,w:2800,h:100},
    {x:100,y:2000,w:2800,h:100},
    {x:100,y:100,w:100,h:2000},
    {x:2800,y:100,w:100,h:2000},
    /* левое здание */
    {x:350,y:350,w:600,h:100},
    {x:350,y:350,w:100,h:650},
    {x:850,y:350,w:100,h:650},
    /* центр */
    {x:1150,y:250,w:700,h:100},
    {x:1150,y:250,w:100,h:600},
    {x:1750,y:250,w:100,h:600},
    {x:1150,y:750,w:300,h:100},
    {x:1550,y:750,w:300,h:100},
    /* правое здание */
    {x:2050,y:400,w:550,h:100},
    {x:2050,y:400,w:100,h:700},
    {x:2500,y:400,w:100,h:700},
    /* нижнее левое */
    {x:350,y:1250,w:650,h:100},
    {x:350,y:1250,w:100,h:550},
    {x:900,y:1250,w:100,h:550},
    {x:350,y:1700,w:650,h:100},
    /* нижний центр */
    {x:1200,y:1150,w:700,h:100},
    {x:1200,y:1150,w:100,h:650},
    {x:1800,y:1150,w:100,h:650},
    {x:1200,y:1700,w:700,h:100},
    /* укрытия */
    {x:1050,y:450,w:100,h:100},
    {x:1900,y:700,w:120,h:120},
    {x:1000,y:1500,w:120,h:120},
    {x:2000,y:1400,w:120,h:120},
    {x:2200,y:1550,w:150,h:100}
];
/* =====================================================
   ВРАГИ
===================================================== */
const enemies=[
    {
        x:2400,
        y:300,
        hp:100,
        dead:false,
        cooldown:1
    },
    {
        x:2200,
        y:1200,
        hp:100,
        dead:false,
        cooldown:2
    },
    {
        x:1450,
        y:500,
        hp:100,
        dead:false,
        cooldown:1.5
    },
    {
        x:650,
        y:1150,
        hp:100,
        dead:false,
        cooldown:2
    },
    {
        x:1500,
        y:1850,
        hp:100,
        dead:false,
        cooldown:1
    }
];
/* =====================================================
   СТОЛКНОВЕНИЕ
===================================================== */
function collides(x,y){
    const radius=22;
    for(const wall of walls){
        if(
            x+radius > wall.x &&
            x-radius <
            wall.x+wall.w &&
            y+radius > wall.y &&
            y-radius <
            wall.y+wall.h
        ){
            return true;
        }
    }
    return false;
}
/* =====================================================
   ДЖОЙСТИК
===================================================== */
const joystick =
    document.getElementById("joystick");
const stick =
    document.getElementById("stick");
let joyX=0;
let joyY=0;
let joyActive=false;
let joyId=null;
function setJoystick(x,y){
    const rect =
        joystick.getBoundingClientRect();
    let dx =
        x -
        (rect.left + rect.width/2);
    let dy =
        y -
        (rect.top + rect.height/2);
    const max=42;
    const distance =
        Math.hypot(dx,dy);
    if(distance>max){
        dx =
            dx/distance*max;
        dy =
            dy/distance*max;
    }
    joyX=dx/max;
    joyY=dy/max;
    stick.style.left =
        (40+dx)+"px";
    stick.style.top =
        (40+dy)+"px";
}
function resetJoystick(){
    joyX=0;
    joyY=0;
    joyActive=false;
    joyId=null;
    stick.style.left="40px";
    stick.style.top="40px";
}
joystick.addEventListener(
    "touchstart",
    function(e){
        e.preventDefault();
        const t =
            e.changedTouches[0];
        joyActive=true;
        joyId=t.identifier;
        setJoystick(
            t.clientX,
            t.clientY
        );
    },
    {passive:false}
);
joystick.addEventListener(
    "touchmove",
    function(e){
        e.preventDefault();
        if(!joyActive)
            return;
        for(const t of e.changedTouches){
            if(t.identifier === joyId){
                setJoystick(
                    t.clientX,
                    t.clientY
                );
            }
        }
    },
    {passive:false}
);
joystick.addEventListener(
    "touchend",
    function(e){
        e.preventDefault();
        resetJoystick();
    },
    {passive:false}
);
joystick.addEventListener(
    "touchcancel",
    function(){
        resetJoystick();
    }
);
/* =====================================================
   СВАЙП
===================================================== */
let lookId=null;
let lastLookX=0;
canvas.addEventListener(
    "touchstart",
    function(e){
        for(const t of e.changedTouches){
            if(
                t.clientX >
                W*0.45
            ){
                lookId=t.identifier;
                lastLookX=
                    t.clientX;
            }
        }
    },
    {passive:false}
);
canvas.addEventListener(
    "touchmove",
    function(e){
        if(lookId === null)
            return;
        e.preventDefault();
        for(const t of e.changedTouches){
            if(t.identifier === lookId){
                const dx =
                    t.clientX -
                    lastLookX;
                player.angle +=
                    dx*0.008;
                lastLookX =
                    t.clientX;
            }
        }
    },
    {passive:false}
);
canvas.addEventListener(
    "touchend",
    function(e){
        for(const t of e.changedTouches){
            if(t.identifier === lookId){
                lookId=null;
            }
        }
    }
);
/* =====================================================
   ДВИЖЕНИЕ
===================================================== */
function updatePlayer(dt){
    const speed=220;
    const forward =
        -joyY;
    const side =
        joyX;
    const dx =
        (
            Math.cos(player.angle)*
            forward
            -
            Math.sin(player.angle)*
            side
        )*
        speed*
        dt;
    const dy =
        (
            Math.sin(player.angle)*
            forward
            +
            Math.cos(player.angle)*
            side
        )*
        speed*
        dt;
    const nx =
        player.x+dx;
    const ny =
        player.y+dy;
    if(
        !collides(
            nx,
            player.y
        )
    ){
        player.x=nx;
    }
    if(
        !collides(
            player.x,
            ny
        )
    ){
        player.y=ny;
    }
}
/* =====================================================
   ВИДИМОСТЬ СТЕН
===================================================== */
function raycast(angle){
    const maxDistance=1800;
    const step=7;
    for(
        let d=1;
        d<maxDistance;
        d+=step
    ){
        const x =
            player.x +
            Math.cos(angle)*d;
        const y =
            player.y +
            Math.sin(angle)*d;
        for(const wall of walls){
            if(
                x>=wall.x &&
                x<=wall.x+wall.w &&
                y>=wall.y &&
                y<=wall.y+wall.h
            ){
                return d;
            }
        }
    }
    return maxDistance;
}
/* =====================================================
   ПРОВЕРКА ЛИНИИ ДО ВРАГА
===================================================== */
function hasLineOfSight(enemy){
    const dx =
        enemy.x-player.x;
    const dy =
        enemy.y-player.y;
    const distance =
        Math.hypot(dx,dy);
    const steps =
        Math.ceil(distance/15);
    for(let i=1;i<steps;i++){
        const x =
            player.x+
            dx*(i/steps);
        const y =
            player.y+
            dy*(i/steps);
        for(const wall of walls){
            if(
                x>=wall.x &&
                x<=wall.x+wall.w &&
                y>=wall.y &&
                y<=wall.y+wall.h
            ){
                return false;
            }
        }
    }
    return true;
}
/* =====================================================
   СТРЕЛЬБА
===================================================== */
const fire =
    document.getElementById("fire");
fire.addEventListener(
    "touchstart",
    function(e){
        e.preventDefault();
        shoot();
    },
    {passive:false}
);
function shoot(){
    if(
        reloading ||
        ammo<=0
    ){
        if(ammo<=0)
            reload();
        return;
    }
    ammo--;
    muzzleFlash=0.08;
    let best=null;
    let bestDistance=Infinity;
    for(const enemy of enemies){
        if(enemy.dead)
            continue;
        const dx =
            enemy.x-player.x;
        const dy =
            enemy.y-player.y;
        const distance =
            Math.hypot(dx,dy);
        if(distance>1000)
            continue;
        let angle =
            Math.atan2(dy,dx) -
            player.angle;
        angle =
            Math.atan2(
                Math.sin(angle),
                Math.cos(angle)
            );
        if(
            Math.abs(angle)<0.10 &&
            distance<bestDistance &&
            hasLineOfSight(enemy)
        ){
            best=enemy;
            bestDistance=distance;
        }
    }
    if(best){
        best.hp-=50;
        if(best.hp<=0){
            best.hp=0;
            best.dead=true;
        }
    }
}
/* =====================================================
   ПЕРЕЗАРЯДКА
===================================================== */
const reloadButton =
    document.getElementById("reload");
reloadButton.addEventListener(
    "touchstart",
    function(e){
        e.preventDefault();
        reload();
    },
    {passive:false}
);
function reload(){
    if(
        reloading ||
        ammo>=30 ||
        reserve<=0
    )
        return;
    reloading=true;
    setTimeout(
        function(){
            const need =
                30-ammo;
            const amount =
                Math.min(
                    need,
                    reserve
                );
            ammo+=amount;
            reserve-=amount;
            reloading=false;
        },
        900
    );
}
/* =====================================================
   ИИ ВРАГОВ
===================================================== */
function updateEnemies(dt){
    for(const enemy of enemies){
        if(enemy.dead)
            continue;
        const dx =
            player.x-enemy.x;
        const dy =
            player.y-enemy.y;
        const distance =
            Math.hypot(dx,dy);
        /* движение к игроку */
        if(
            distance>180 &&
            distance<1000
        ){
            const speed=35;
            const nx =
                enemy.x+
                dx/distance*
                speed*
                dt;
            const ny =
                enemy.y+
                dy/distance*
                speed*
                dt;
            if(
                !collides(
                    nx,
                    enemy.y
                )
            ){
                enemy.x=nx;
            }
            if(
                !collides(
                    enemy.x,
                    ny
                )
            ){
                enemy.y=ny;
            }
        }
        /* атака */
        enemy.cooldown-=dt;
        if(
            distance<650 &&
            enemy.cooldown<=0 &&
            hasLineOfSight(enemy)
        ){
            player.hp-=7;
            enemy.cooldown=1.2;
        }
    }
}
/* =====================================================
   HUD
===================================================== */
function updateHUD(){
    document.getElementById(
        "hp"
    ).textContent =
        "HP "+
        Math.max(
            0,
            Math.floor(player.hp)
        );
    document.getElementById(
        "ammo"
    ).textContent =
        reloading
        ? "RELOADING..."
        : ammo+
          " / "+
          reserve;
}
/* =====================================================
   ОТРИСОВКА
===================================================== */
function draw(){
    /* небо */
    ctx.fillStyle="#718991";
    ctx.fillRect(
        0,
        0,
        W,
        H/2
    );
    /* земля */
    ctx.fillStyle="#30383c";
    ctx.fillRect(
        0,
        H/2,
        W,
        H/2
    );
    /* линии пола */
    ctx.strokeStyle="#4c5659";
    ctx.lineWidth=1;
    for(
        let i=1;
        i<14;
        i++
    ){
        const y =
            H/2+
            i*(H/2)/14;
        ctx.beginPath();
        ctx.moveTo(
            0,
            y
        );
        ctx.lineTo(
            W,
            y
        );
        ctx.stroke();
    }
    /* =================================================
       FPS СТЕНЫ
    ================================================= */
    const fov =
        Math.PI/3;
    const rays =
        Math.min(
            300,
            Math.max(
                120,
                Math.floor(W/4)
            )
        );
    const projection =
        (W/2)/
        Math.tan(fov/2);
    for(
        let i=0;
        i<rays;
        i++
    ){
        const screenX =
            i*W/rays;
        const rayAngle =
            player.angle-
            fov/2+
            (i/rays)*fov;
        let distance =
            raycast(
                rayAngle
            );
        distance *=
            Math.cos(
                rayAngle-
                player.angle
            );
        distance =
            Math.max(
                1,
                distance
            );
        const wallHeight =
            projection/
            distance*
            100;
        const top =
            H/2-
            wallHeight/2;
        const brightness =
            Math.max(
                35,
                185-distance/9
            );
        ctx.fillStyle =
            "rgb("+
            brightness+","+
            brightness+","+
            brightness+
            ")";
        ctx.fillRect(
            screenX,
            top,
            W/rays+1,
            wallHeight
        );
    }
    /* =================================================
       ВРАГИ
    ================================================= */
    for(const enemy of enemies){
        if(enemy.dead)
            continue;
        const dx =
            enemy.x-player.x;
        const dy =
            enemy.y-player.y;
        const distance =
            Math.hypot(dx,dy);
        let relative =
            Math.atan2(
                dy,
                dx
            )-
            player.angle;
        relative =
            Math.atan2(
                Math.sin(relative),
                Math.cos(relative)
            );
        if(
            Math.abs(relative)<
            fov/2
        ){
            /*
               Проверяем стену
            */
            const visible =
                hasLineOfSight(enemy);
            if(!visible)
                continue;
            const screenX =
                W/2+
                relative/
                (fov/2)*
                (W/2);
            const size =
                Math.max(
                    28,
                    52000/
                    (distance+120)
                );
            /* тело */
            ctx.fillStyle="#bd3038";
            ctx.fillRect(
                screenX-
                size*.30,
                H/2-
                size*.42,
                size*.60,
                size*.85
            );
            /* голова */
            ctx.fillStyle="#d9a27f";
            ctx.beginPath();
            ctx.arc(
                screenX,
                H/2-
                size*.55,
                size*.20,
                0,
                Math.PI*2
            );
            ctx.fill();
            /* HP фон */
            ctx.fillStyle="#111";
            ctx.fillRect(
                screenX-
                size*.45,
                H/2-
                size*.82,
                size*.90,
                6
            );
            /* HP */
            ctx.fillStyle="#35d36b";
            ctx.fillRect(
                screenX-
                size*.45,
                H/2-
                size*.82,
                size*.90*
                (enemy.hp/100),
                6
            );
        }
    }
    /* =================================================
       ОРУЖИЕ
    ================================================= */
    ctx.fillStyle="#111";
    ctx.fillRect(
        W/2-58,
        H-92,
        116,
        72
    );
    ctx.fillStyle="#555";
    ctx.fillRect(
        W/2-11,
        H-135,
        22,
        58
    );
    /* вспышка */
    if(muzzleFlash>0){
        ctx.fillStyle=
            "rgba(255,220,70,.9)";
        ctx.beginPath();
        ctx.arc(
            W/2,
            H-140,
            25,
            0,
            Math.PI*2
        );
        ctx.fill();
        muzzleFlash-=0.016;
    }
}
/* =====================================================
   СОСТОЯНИЕ ИГРЫ
===================================================== */
let gameEnded=false;
function checkGame(){
    if(
        player.hp<=0 &&
        !gameEnded
    ){
        player.hp=0;
        gameEnded=true;
        document.getElementById(
            "message"
        ).textContent=
            "YOU DIED";
        document.getElementById(
            "message"
        ).style.display="block";
        document.getElementById(
            "restart"
        ).style.display="block";
        return;
    }
    const alive =
        enemies.filter(
            enemy=>!enemy.dead
        ).length;
    if(
        alive===0 &&
        !gameEnded
    ){
        gameEnded=true;
        document.getElementById(
            "message"
        ).textContent=
            "ROUND WON!";
        document.getElementById(
            "message"
        ).style.display="block";
        document.getElementById(
            "restart"
        ).style.display="block";
    }
}
/* =====================================================
   ПЕРЕЗАПУСК
===================================================== */
document
.getElementById("restart")
.addEventListener(
    "touchstart",
    function(e){
        e.preventDefault();
        location.reload();
    },
    {passive:false}
);
/* =====================================================
   GAME LOOP
===================================================== */
let last =
    performance.now();
function loop(now){
    const dt =
        Math.min(
            0.05,
            (now-last)/1000
        );
    last=now;
    if(!gameEnded){
        updatePlayer(dt);
        updateEnemies(dt);
    }
    checkGame();
    updateHUD();
    draw();
    requestAnimationFrame(
        loop
    );
}
requestAnimationFrame(
    loop
);
</script>
</body>
</html>
