function collision(x,y){

    const r=28;

    if(
        x<r ||
        y<r ||
        x>map.width-r ||
        y>map.height-r
    ){
        return true;
    }

    for(const w of walls){

        if(
            x+r>w.x &&
            x-r<w.x+w.w &&
            y+r>w.y &&
            y-r<w.y+w.h
        ){
            return true;
        }
    }

    return false;
}

function joystickMove(x,y){

    const rect=
        joystick.getBoundingClientRect();

    const centerX=
        rect.left+
        rect.width/2;

    const centerY=
        rect.top+
        rect.height/2;

    let dx=x-centerX;
    let dy=y-centerY;

    const max=40;

    const distance=
        Math.sqrt(dx*dx+dy*dy);

    if(distance>max){

        dx=
            dx/distance*max;

        dy=
            dy/distance*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.left=
        (41+dx)+"px";

    stick.style.top=
        (41+dy)+"px";

    touchCounter++;

    updateDebug();
}

   GAME LOOP
===================================================== */

let last=
    performance.now();

function loop(now){

    const dt=
        Math.min(
            0.05,
            (now-last)/1000
        );

    last=now;

    updatePlayer(dt);

    updateBots(dt);

    checkGame();

    updateHUD();

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawMap();

    drawBots();

    drawPlayer();

    drawWeapon();

    drawFlash();
