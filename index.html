<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAHL1K FPS v4</title>
<style>
*{
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#222;
touch-action:none;
font-family:Arial,sans-serif;
}
#game{
position:fixed;
inset:0;
overflow:hidden;
background:
linear-gradient(
to bottom,
#4c8198 0%,
#aac7ce 47%,
#343a3d 47%,
#343a3d 100%
);
}
#sky{
position:absolute;
inset:0 0 47% 0;
background:linear-gradient(#42758f,#aac8d0);
}
#ground{
position:absolute;
left:0;
right:0;
top:47%;
bottom:0;
background:
repeating-linear-gradient(
0deg,
#3b4144 0px,
#3b4144 44px,
#454b4e 45px,
#454b4e 46px
);
}
.roadV{
position:absolute;
top:47%;
bottom:0;
left:30%;
width:40%;
background:#50575a;
border-left:3px solid #666d70;
border-right:3px solid #666d70;
}
.roadH{
position:absolute;
left:0;
right:0;
top:63%;
height:28%;
background:#50575a;
border-top:3px solid #666d70;
border-bottom:3px solid #666d70;
}
.mark{
position:absolute;
background:#ddd;
z-index:3;
}
.mark.v{
width:7px;
height:45px;
left:calc(50% - 3px);
}
/* =====================
   ЗДАНИЯ
===================== */
.building{
position:absolute;
background:
linear-gradient(
135deg,
#292e30,
#151718
);
border:3px solid #73797b;
box-shadow:inset 0 0 20px #0008;
z-index:10;
}
/* =====================
   HUD
===================== */
#title{
position:fixed;
z-index:100;
top:10px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:23px;
font-weight:bold;
text-shadow:0 2px 5px #000;
}
#info{
position:fixed;
z-index:100;
top:44px;
left:15px;
color:white;
font-size:14px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}
#score{
position:fixed;
z-index:100;
top:68px;
left:15px;
color:#ffd84d;
font-size:16px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}
#hp{
position:fixed;
z-index:100;
left:20px;
bottom:20px;
color:white;
font-size:22px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}
#ammo{
position:fixed;
z-index:100;
right:20px;
bottom:20px;
color:white;
font-size:22px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}
/* =====================
   ПРИЦЕЛ
===================== */
#crosshair{
position:fixed;
z-index:100;
left:50%;
top:50%;
width:32px;
height:32px;
transform:translate(-50%,-50%);
}
#crosshair:before{
content:"";
position:absolute;
left:0;
top:15px;
width:32px;
height:2px;
background:white;
}
#crosshair:after{
content:"";
position:absolute;
left:15px;
top:0;
width:2px;
height:32px;
background:white;
}
/* =====================
   ДЖОЙСТИК
===================== */
#joystick{
position:fixed;
z-index:200;
left:25px;
bottom:25px;
width:140px;
height:140px;
border-radius:50%;
border:3px solid #ffffff66;
background:#ffffff18;
touch-action:none;
}
#stick{
position:absolute;
left:40px;
top:40px;
width:60px;
height:60px;
border-radius:50%;
background:#ffffff70;
border:2px solid white;
pointer-events:none;
}
/* =====================
   КНОПКИ
===================== */
#fire{
position:fixed;
z-index:200;
right:30px;
bottom:95px;
width:85px;
height:85px;
border-radius:50%;
border:2px solid white;
background:#a52c2ccc;
color:white;
font-weight:bold;
}
#reload{
position:fixed;
z-index:200;
right:135px;
bottom:35px;
width:100px;
height:45px;
border-radius:12px;
border:1px solid white;
background:#222c;
color:white;
font-weight:bold;
}
/* =====================
   ОРУЖИЕ
===================== */
#weapon{
position:fixed;
z-index:80;
left:50%;
bottom:-15px;
width:170px;
height:130px;
transform:translateX(-50%);
transition:transform .07s;
}
#gun{
position:absolute;
left:30px;
bottom:0;
width:110px;
height:75px;
background:#151718;
border-radius:15px 15px 5px 5px;
box-shadow:0 0 10px #000;
}
#barrel{
position:absolute;
left:72px;
bottom:65px;
width:25px;
height:70px;
background:#303537;
border-radius:5px;
}
/* =====================
   ВРАГ
===================== */
.enemy{
position:absolute;
z-index:30;
width:60px;
height:120px;
transform:translate(-50%,-50%);
transform-origin:center center;
}
.enemyBody{
position:absolute;
left:20%;
bottom:0;
width:60%;
height:63%;
background:#a92f38;
border-radius:8px 8px 2px 2px;
}
.enemyHead{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:46%;
aspect-ratio:1/1;
border-radius:50%;
background:#d49a78;
}
.enemyGun{
position:absolute;
left:65%;
top:47%;
width:75%;
height:8%;
background:#161818;
transform:rotate(-8deg);
}
.enemyHP{
position:absolute;
left:0;
top:-10px;
width:100%;
height:5px;
background:#111;
}
.enemyHPInner{
height:100%;
width:100%;
background:#39d36b;
}
/* =====================
   АПТЕЧКИ
===================== */
.medkit{
position:absolute;
z-index:25;
width:35px;
height:35px;
background:#eee;
border:3px solid #222;
border-radius:7px;
transform:translate(-50%,-50%);
}
.medkit:before{
content:"+";
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:27px;
font-weight:bold;
color:#d33;
}
/* =====================
   МИНИ-КАРТА
===================== */
#minimap{
position:fixed;
z-index:150;
right:15px;
top:15px;
width:150px;
height:110px;
background:#111c;
border:2px solid #ffffff99;
border-radius:8px;
overflow:hidden;
}
.mapBuilding{
position:absolute;
background:#555;
}
#playerDot{
position:absolute;
width:9px;
height:9px;
background:#21a5ff;
border-radius:50%;
transform:translate(-50%,-50%);
box-shadow:0 0 5px #21a5ff;
}
.enemyDot{
position:absolute;
width:7px;
height:7px;
background:#e33;
border-radius:50%;
transform:translate(-50%,-50%);
}
/* =====================
   УРОН
===================== */
#damage{
position:fixed;
z-index:120;
inset:0;
pointer-events:none;
background:#d00;
opacity:0;
}
/* =====================
   GAME OVER
===================== */
#gameover{
display:none;
position:fixed;
z-index:500;
inset:0;
background:#000c;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
font-size:32px;
font-weight:bold;
text-align:center;
}
#restart{
margin-top:20px;
padding:15px 30px;
font-size:20px;
border-radius:10px;
border:2px solid white;
background:#333;
color:white;
}
/* =====================
   ПОВЕРНИ ТЕЛЕФОН
===================== */
#rotate{
display:none;
position:fixed;
z-index:9999;
inset:0;
background:#111;
color:white;
align-items:center;
justify-content:center;
text-align:center;
font-size:24px;
}
@media(max-width:700px) and (orientation:portrait){
#rotate{
display:flex;
}
}
</style>
</head>
<body>
<div id="game">
<div id="sky"></div>
<div id="ground"></div>
<div class="roadV"></div>
<div class="roadH"></div>
<div class="mark v" style="top:55%"></div>
<div class="mark v" style="top:67%"></div>
<div class="mark v" style="top:80%"></div>
<div class="mark v" style="top:91%"></div>
<div class="building" id="b1"></div>
<div class="building" id="b2"></div>
<div class="building" id="b3"></div>
<div class="building" id="b4"></div>
<div class="building" id="b5"></div>
<div class="building" id="b6"></div>
</div>
<div id="title">
RAHL1K FPS v4
</div>
<div id="info">
POS: 1500 / 1100 &nbsp;&nbsp; ANGLE: 0°
</div>
<div id="score">
KILLS: 0
</div>
<div id="hp">
HP 100
</div>
<div id="ammo">
30 / 90
</div>
<div id="crosshair"></div>
<div id="minimap">
<div class="mapBuilding"
style="left:10px;top:10px;width:35px;height:25px"></div>
<div class="mapBuilding"
style="right:10px;top:10px;width:35px;height:25px"></div>
<div class="mapBuilding"
style="left:10px;bottom:10px;width:35px;height:30px"></div>
<div class="mapBuilding"
style="right:10px;bottom:10px;width:35px;height:30px"></div>
<div id="playerDot"></div>
</div>
<div id="joystick">
<div id="stick"></div>
</div>
<button id="fire">
FIRE
</button>
<button id="reload">
RELOAD
</button>
<div id="weapon">
<div id="barrel"></div>
<div id="gun"></div>
</div>
<div id="damage"></div>
<div id="gameover">

GAME OVER

<div id="finalScore"></div>
<button id="restart">
ИГРАТЬ СНОВА
</button>
</div>
<div id="rotate">

↔️

Поверни телефон горизонтально

</div>
<script>
/* ==========================
ИГРОК
========================== */
const player={
x:1500,
y:1100,
angle:0,
hp:100
};
const MAP_W=4000;
const MAP_H=3000;
/* ==========================
ЗДАНИЯ
========================== */
const buildings=[
{x:300,y:300,w:800,h:350},
{x:2750,y:300,w:800,h:350},
{x:300,y:1900,w:800,h:400},
{x:2750,y:1900,w:800,h:400},
{x:1250,y:500,w:400,h:300},
{x:2000,y:500,w:400,h:300}
];
function updateBuildings(){
const cx=window.innerWidth/2;
const cy=window.innerHeight*.60;
for(let i=0;i<buildings.length;i++){
const b=buildings[i];
const el=
document.getElementById("b"+(i+1));
const dx=b.x-player.x;
const dy=b.y-player.y;
const cos=Math.cos(player.angle);
const sin=Math.sin(player.angle);
const forward=
dx*cos+dy*sin;
const side=
-dx*sin+dy*cos;
if(forward<-50){
el.style.display="none";
continue;
}
const f=Math.max(100,forward);
const sx=
cx+side*.55;
const sy=
cy-12000/f;
const scale=
Math.min(
2.5,
Math.max(
.15,
900/f
)
);
el.style.display="block";
el.style.left=sx+"px";
el.style.top=sy+"px";
el.style.width=
(b.w*.55*scale)+"px";
el.style.height=
(b.h*.55*scale)+"px";
}
}
/* ==========================
СТОЛКНОВЕНИЯ
========================== */
function blocked(x,y){
const r=28;
if(
x<r||
y<r||
x>MAP_W-r||
y>MAP_H-r
)
return true;
for(const b of buildings){
if(
x+r>b.x&&
x-r<b.x+b.w&&
y+r>b.y&&
y-r<b.y+b.h
)
return true;
}
return false;
}
/* ==========================
ДЖОЙСТИК
========================== */
const joystick=
document.getElementById("joystick");
const stick=
document.getElementById("stick");
let joyX=0;
let joyY=0;
let joyID=null;
function setJoy(x,y){
const r=
joystick.getBoundingClientRect();
const cx=
r.left+r.width/2;
const cy=
r.top+r.height/2;
let dx=x-cx;
let dy=y-cy;
const max=40;
const dist=
Math.hypot(dx,dy);
if(dist>max){
dx=dx/dist*max;
dy=dy/dist*max;
}
joyX=dx/max;
joyY=dy/max;
stick.style.left=
(40+dx)+"px";
stick.style.top=
(40+dy)+"px";
}
function resetJoy(){
joyX=0;
joyY=0;
joyID=null;
stick.style.left="40px";
stick.style.top="40px";
}
joystick.addEventListener(
"touchstart",
e=>{
e.preventDefault();
if(joyID!==null)return;
const t=e.changedTouches[0];
joyID=t.identifier;
setJoy(
t.clientX,
t.clientY
);
},
{passive:false}
);
joystick.addEventListener(
"touchmove",
e=>{
e.preventDefault();
for(const t of e.changedTouches){
if(t.identifier===joyID){
setJoy(
t.clientX,
t.clientY
);
}
}
},
{passive:false}
);
joystick.addEventListener(
"touchend",
e=>{
for(const t of e.changedTouches){
if(t.identifier===joyID){
resetJoy();
}
}
}
);
joystick.addEventListener(
"touchcancel",
resetJoy
);
/* ==========================
КАМЕРА 360°
========================== */
let lookID=null;
let lastLookX=0;
document.addEventListener(
"touchstart",
e=>{
for(const t of e.changedTouches){
if(
t.clientX>
window.innerWidth*.42&&
!t.target.closest(
"#fire,#reload,#joystick"
)
){
lookID=t.identifier;
lastLookX=t.clientX;
}
}
},
{passive:false}
);
document.addEventListener(
"touchmove",
e=>{
if(lookID===null)return;
for(const t of e.changedTouches){
if(t.identifier===lookID){
e.preventDefault();
const dx=
t.clientX-lastLookX;
player.angle+=dx*.008;
lastLookX=t.clientX;
}
}
},
{passive:false}
);
document.addEventListener(
"touchend",
e=>{
for(const t of e.changedTouches){
if(t.identifier===lookID){
lookID=null;
}
}
}
);
/* ==========================
ДВИЖЕНИЕ
========================== */
function updatePlayer(dt){
if(player.hp<=0)return;
const speed=270;
const forward=-joyY;
const strafe=joyX;
const dx=
(
Math.cos(player.angle)*forward-
Math.sin(player.angle)*strafe
)*
speed*
dt;
const dy=
(
Math.sin(player.angle)*forward+
Math.cos(player.angle)*strafe
)*
speed*
dt;
const nx=player.x+dx;
const ny=player.y+dy;
if(!blocked(nx,player.y))
player.x=nx;
if(!blocked(player.x,ny))
player.y=ny;
}
/* ==========================
ВРАГИ
========================== */
const enemies=[
{x:700,y:900,hp:100,el:null,attack:0},
{x:3300,y:900,hp:100,el:null,attack:0},
{x:700,y:2500,hp:100,el:null,attack:0},
{x:3300,y:2500,hp:100,el:null,attack:0},
{x:1800,y:2200,hp:100,el:null,attack:0}
];
function createEnemies(){
for(const enemy of enemies){
const el=
document.createElement("div");
el.className="enemy";
el.innerHTML=`
<div class="enemyHP">
<div class="enemyHPInner"></div>
</div>
<div class="enemyHead"></div>
<div class="enemyBody"></div>
<div class="enemyGun"></div>
`;
document
.getElementById("game")
.appendChild(el);
enemy.el=el;
}
}
createEnemies();
function updateEnemies(dt){
for(const enemy of enemies){
if(enemy.hp<=0){
enemy.el.style.display="none";
continue;
}
const dx=
player.x-enemy.x;
const dy=
player.y-enemy.y;
const distance=
Math.hypot(dx,dy);
if(
distance>100&&
distance<2200
){
const speed=65;
const ex=
dx/distance*speed*dt;
const ey=
dy/distance*speed*dt;
const nx=enemy.x+ex;
const ny=enemy.y+ey;
if(!blocked(nx,enemy.y))
enemy.x=nx;
if(!blocked(enemy.x,ny))
enemy.y=ny;
}
if(distance<170){
enemy.attack-=dt;
if(enemy.attack<=0){
player.hp-=8;
enemy.attack=1;
damageEffect();
}
}
showEnemy(enemy);
}
}
/* ==========================
ОТОБРАЖЕНИЕ ВРАГА
========================== */
function showEnemy(enemy){
const dx=
enemy.x-player.x;
const dy=
enemy.y-player.y;
const distance=
Math.hypot(dx,dy);
let relative=
Math.atan2(dy,dx)-player.angle;
relative=
Math.atan2(
Math.sin(relative),
Math.cos(relative)
);
if(
Math.abs(relative)>
Math.PI/2
){
enemy.el.style.display="none";
return;
}
const sx=
window.innerWidth/2+
Math.tan(relative)*
window.innerWidth*.55;
const size=
Math.max(
25,
Math.min(
190,
70000/distance
)
);
enemy.el.style.display="block";
enemy.el.style.left=sx+"px";
enemy.el.style.top=
window.innerHeight*.57+"px";
/*
ВАЖНО:
один размер задаётся всему врагу.
Голова и тело находятся внутри
одного контейнера и поэтому
больше не разъезжаются.
*/
enemy.el.style.width=
size+"px";
enemy.el.style.height=
(size*2)+"px";
enemy.el.style.transform=
"translate(-50%,-50%)";
enemy.el
.querySelector(".enemyHPInner")
.style.width=
Math.max(
0,
enemy.hp
)+"%";
}
/* ==========================
СТРЕЛЬБА
========================== */
let ammo=30;
let reserve=90;
let kills=0;
document
.getElementById("fire")
.addEventListener(
"touchstart",
e=>{
e.preventDefault();
shoot();
},
{passive:false}
);
function shoot(){
if(player.hp<=0)return;
if(ammo<=0){
reload();
return;
}
ammo--;
let target=null;
let closest=Infinity;
for(const enemy of enemies){
if(enemy.hp<=0)continue;
const dx=
enemy.x-player.x;
const dy=
enemy.y-player.y;
const distance=
Math.hypot(dx,dy);
let a=
Math.atan2(dy,dx)-player.angle;
a=
Math.atan2(
Math.sin(a),
Math.cos(a)
);
if(
Math.abs(a)<.12&&
distance<1500&&
distance<closest
){
target=enemy;
closest=distance;
}
}
if(target){
target.hp-=50;
if(target.hp<=0){
kills++;
}
}
const weapon=
document.getElementById("weapon");
weapon.style.transform=
"translateX(-50%) translateY(15px)";
setTimeout(
()=>{
weapon.style.transform=
"translateX(-50%)";
},
70
);
}
/* ==========================
ПЕРЕЗАРЯДКА
========================== */
function reload(){
if(
ammo>=30||
reserve<=0
)
return;
const amount=
Math.min(
30-ammo,
reserve
);
ammo+=amount;
reserve-=amount;
}
document
.getElementById("reload")
.addEventListener(
"touchstart",
e=>{
e.preventDefault();
reload();
},
{passive:false}
);
/* ==========================
УРОН
========================== */
function damageEffect(){
const damage=
document.getElementById("damage");
damage.style.opacity=.35;
setTimeout(
()=>{
damage.style.opacity=0;
},
100
);
}
/* ==========================
МИНИ-КАРТА
========================== */
function updateMinimap(){
const map=
document.getElementById("minimap");
const w=map.clientWidth;
const h=map.clientHeight;
const dot=
document.getElementById("playerDot");
dot.style.left=
(player.x/MAP_W*w)+"px";
dot.style.top=
(player.y/MAP_H*h)+"px";
document
.querySelectorAll(".enemyDot")
.forEach(
e=>e.remove()
);
for(const enemy of enemies){
if(enemy.hp<=0)continue;
const dot=
document.createElement("div");
dot.className="enemyDot";
dot.style.left=
(enemy.x/MAP_W*w)+"px";
dot.style.top=
(enemy.y/MAP_H*h)+"px";
map.appendChild(dot);
}
}
/* ==========================
АПТЕЧКИ
========================== */
const medkits=[
{x:1500,y:600,used:false,el:null},
{x:1500,y:2500,used:false,el:null},
{x:2500,y:1500,used:false,el:null}
];
function createMedkits(){
for(const m of medkits){
const el=
document.createElement("div");
el.className="medkit";
document
.getElementById("game")
.appendChild(el);
m.el=el;
}
}
createMedkits();
function updateMedkits(){
for(const m of medkits){
if(m.used){
m.el.style.display="none";
continue;
}
const dx=m.x-player.x;
const dy=m.y-player.y;
const distance=
Math.hypot(dx,dy);
let relative=
Math.atan2(dy,dx)-player.angle;
relative=
Math.atan2(
Math.sin(relative),
Math.cos(relative)
);
if(
Math.abs(relative)>
Math.PI/2
){
m.el.style.display="none";
continue;
}
const sx=
window.innerWidth/2+
Math.tan(relative)*
window.innerWidth*.55;
const size=
Math.max(
15,
Math.min(
70,
35000/distance
)
);
m.el.style.display="block";
m.el.style.left=sx+"px";
m.el.style.top=
window.innerHeight*.60+"px";
m.el.style.width=size+"px";
m.el.style.height=size+"px";
if(
distance<80&&
player.hp<100
){
player.hp=
Math.min(
100,
player.hp+30
);
m.used=true;
}
}
}
/* ==========================
HUD
========================== */
function updateHUD(){
let angle=
player.angle*
180/
Math.PI;
angle=
(
angle%360+
360
)%360;
document
.getElementById("info")
.innerHTML=
"POS: "+
Math.round(player.x)+
" / "+
Math.round(player.y)+
"&nbsp;&nbsp; ANGLE: "+
Math.round(angle)+
"°";
document
.getElementById("score")
.textContent=
"KILLS: "+
kills;
document
.getElementById("hp")
.textContent=
"HP "+
Math.max(
0,
Math.round(player.hp)
);
document
.getElementById("ammo")
.textContent=
ammo+
" / "+
reserve;
}
/* ==========================
GAME OVER
========================== */
function gameOver(){
const screen=
document.getElementById(
"gameover"
);
if(
screen.style.display==="flex"
)
return;
screen.style.display="flex";
document
.getElementById("finalScore")
.textContent=
"KILLS: "+
kills;
}
document
.getElementById("restart")
.addEventListener(
"touchstart",
()=>{
location.reload();
}
);
/* ==========================
GAME LOOP
========================== */
let last=
performance.now();
function loop(now){
const dt=
Math.min(
.05,
(now-last)/1000
);
last=now;
if(player.hp>0){
updatePlayer(dt);
updateEnemies(dt);
updateBuildings();
updateMedkits();
updateMinimap();
updateHUD();
}else{
gameOver();
}
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
