<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CANVAS TEST</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;


/* Синий фон */

ctx.fillStyle = "blue";

ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);


/* Надпись */

ctx.fillStyle = "white";

ctx.font = "40px Arial";

ctx.textAlign = "center";

ctx.fillText(
    "CANVAS WORKS!",
    canvas.width / 2,
    canvas.height / 2
);

</script>

</body>
</html>
