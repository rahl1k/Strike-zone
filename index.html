<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>rahl1k TOUCH TEST</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#20252a;
    color:white;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#screen{
    width:100%;
    height:100%;
    position:fixed;
    inset:0;
    touch-action:none;
}

#title{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    font-size:28px;
}

#info{
    position:absolute;
    top:70px;
    width:100%;
    text-align:center;
    font-size:20px;
}

#button{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:220px;
    height:100px;
    border-radius:25px;
    border:4px solid white;
    background:#333;
    color:white;
    font-size:24px;
    touch-action:none;
}

#dot{
    position:absolute;
    left:50%;
    top:70%;
    width:50px;
    height:50px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#1688ff;
}
</style>
</head>
<body>
<div id="screen">
<div id="title">
    rahl1k TOUCH TEST
</div>

<div id="info">
    TOUCH: NO
</div>

<button id="button">
    НАЖМИ
</button>

<div id="dot"></div>
</div>
<script>

const screen =
document.getElementById("screen");

const info =
document.getElementById("info");

const button =
document.getElementById("button");

const dot =
document.getElementById("dot");


let touches=0;


function showTouch(x,y){

    touches++;

    info.textContent =
        "TOUCH: YES | "+
        Math.round(x)+
        ","+
        Math.round(y)+
        " | "+touches;

    dot.style.left =
        x+"px";

    dot.style.top =
        y+"px";
}


/*
   Проверяем POINTER
*/

screen.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        showTouch(
            e.clientX,
            e.clientY
        );

    },
    {passive:false}
);


/*
   Проверяем движение пальца
*/

screen.addEventListener(
    "pointermove",
    function(e){

        if(
            e.buttons ||
            e.pointerType==="touch"
        ){

            e.preventDefault();

            showTouch(
                e.clientX,
                e.clientY
            );
        }

    },
    {passive:false}
);


/*
   Обычный TOUCH API
*/

screen.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        const t =
            e.changedTouches[0];

        showTouch(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);


screen.addEventListener(
    "touchmove",
    function(e){

        e.preventDefault();

        const t =
            e.changedTouches[0];

        showTouch(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);


/*
   Отдельно проверяем кнопку
*/

button.addEventListener(
    "click",
    function(){

        button.textContent =
            "РАБОТАЕТ!";

        button.style.background =
            "#1688ff";

    }
);

</script>
</body>
</html>
