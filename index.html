<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rahl1k JS TEST</title>
<style>
body{
    margin:0;
    background:#222;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:100px;
}

button{
    font-size:25px;
    padding:20px 40px;
}
</style>
</head>
<body>
<h1>rahl1k</h1>
<p id="status">JavaScript: проверка...</p>
<button id="test">
    НАЖМИ МЕНЯ
</button>
<script>

document.getElementById("status").textContent =
    "JavaScript: РАБОТАЕТ!";

document.getElementById("test").addEventListener(
    "click",
    function(){
        document.getElementById("status").textContent =
            "КНОПКА РАБОТАЕТ!";
    }
);

</script>
</body>
</html>
