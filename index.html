<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RAHL1K FPS</title>
<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
    touch-action:none;
    font-family:Arial,sans-serif;
}
#game{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
}
#title{
    position:fixed;
    z-index:20;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}
#info{
    position:fixed;
    z-index:20;
    top:45px;
    left:15px;
    color:white;
    font-size:15px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#hp{
    position:fixed;
    z-index:20;
    left:20px;
    bottom:20px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#ammo{
    position:fixed;
    z-index:20;
    right:20px;
    bottom:20px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
/* ПРИЦЕЛ */
#crosshair{
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    transform:translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    width:30px;
    height:2px;
    background:white;
    box-shadow:0 0 3px #000;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:14px;
    top:0;
    width:2px;
    height:30px;
    background:white;
    box-shadow:0 0 3px #000;
}
/* ДЖОЙСТИК */
#joystick{
    position:fixed;
    z-index:100;
    left:25px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:#ffffff18;
    border:3px solid #ffffff66;
    touch-action:none;
}
#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ffffff66;
    border:2px solid #fff;
    pointer-events:none;
}
/* КНОПКИ */
button{
    position:fixed;
    z-index:100;
    color:white;
    font-weight:bold;
    border:1px solid #ffffff66;
    background:#222c;
    touch-action:none;
}
#fire{
    right:30px;
    bottom:95px;
    width:85px;
    height:85px;
    border-radius:50%;
    background:#a52222cc;
}
#reload{
    right:135px;
    bottom:35px;
    width:100px;
    height:45px;
    border-radius:12px;
}
/* ПОВОРОТ ТЕЛЕФОНА */
#rotate{
    display:none;
    position:fixed;
    z-index:1000;
    inset:0;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:24px;
}
</style>
</head>
<body>
<div id="title">
RAHL1K FPS
</div>
<div id="info">
POS: 1500 / 1100 &nbsp;&nbsp; ANGLE: 0°
</div>
<div id="hp">
HP 100
</div>
<div id="ammo">
30 / 90
</div>
<div id="crosshair"></div>
<div id="joystick">
    <div id="stick"></div>
</div>
<button id="fire">
FIRE
</button>
<button id="reload">
RELOAD
</button>
<div id="rotate">
↔️
<br><br>
Поверни телефон горизонтально
</div>
<script>
/* =========================
   CANVAS
========================= */
const canvas =
document.getElementById("game");
const ctx =
canvas.getContext("2d");
let W=0;
let H=0;
let DPR=1;
function resize(){
    W=window.innerWidth;
    H=window.innerHeight;
    DPR=Math.min(
        window.devicePixelRatio || 1,
        2
    );
    canvas.width=W*DPR;
    canvas.height=H*DPR;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
    document.getElementById(
        "rotate"
    ).style.display =
        H>W ? "flex" : "none";
}
window.addEventListener(
    "resize",
    resize
);
resize();
/* =========================
   КАРТА
========================= */
const MAP_WIDTH=3000;
const MAP_HEIGHT=2200;
/* =========================
   ИГРОК
========================= */
const player={
    x:1500,
    y:1100,
    angle:0,
    hp:100
};
/* =========================
   СТЕНЫ
========================= */
const obstacles=[
    {
        x:300,
        y:250,
        w:600,
        h:150
    },
    {
        x:300,
        y:250,
        w:150,
        h:650
    },
    {
        x:1150,
        y:200,
        w:700,
        h:150
    },
    {
        x:1700,
        y:200,
        w:150,
        h:600
    },
    {
        x:400,
        y:1300,
        w:700,
        h:150
    },
    {
        x:400,
        y:1300,
        w:150,
        h:600
    },
    {
        x:1800,
        y:1250,
        w:700,
        h:150
    },
    {
        x:2350,
        y:1250,
        w:150,
        h:650
    },
    {
        x:1200,
        y:750,
        w:550,
        h:120
    },
    {
        x:1200,
        y:1500,
        w:550,
        h:120
    },
    {
        x:850,
        y:600,
        w:180,
        h:90
    },
    {
        x:1950,
        y:650,
        w:180,
        h:90
    }
];
/* =========================
   ВРАГИ
========================= */
let bots=[
    {
        x:2400,
        y:400,
        hp:100
    },
    {
        x:2250,
        y:900,
        hp:100
    },
    {
        x:2400,
        y:1900,
        hp:100
    },
    {
        x:700,
        y:1850,
        hp:100
    },
    {
        x:1500,
        y:1850,
        hp:100
    }
];
/* =========================
   СТОЛКНОВЕНИЯ
========================= */
function blocked(x,y){
    const radius=28;
    /*
       ГРАНИЦЫ КАРТЫ
    */
    if(
        x-radius<0 ||
        y-radius<0 ||
        x+radius>MAP_WIDTH ||
        y+radius>MAP_HEIGHT
    ){
        return true;
    }
    /*
       СТЕНЫ
    */
    for(
        const o of obstacles
    ){
        if(
            x+radius>o.x &&
            x-radius<
                o.x+o.w &&
            y+radius>o.y &&
            y-radius<
                o.y+o.h
        ){
            return true;
        }
    }
    return false;
}
/* =========================
   ДЖОЙСТИК
========================= */
const joystick=
document.getElementById(
    "joystick"
);
const stick=
document.getElementById(
    "stick"
);
let joyX=0;
let joyY=0;
let joystickID=null;
function updateJoystick(
    x,
    y
){
    const r=
        joystick.getBoundingClientRect();
    const centerX=
        r.left+r.width/2;
    const centerY=
        r.top+r.height/2;
    let dx=
        x-centerX;
    let dy=
        y-centerY;
    const max=40;
    const distance=
        Math.hypot(
            dx,
            dy
        );
    if(
        distance>max
    ){
        dx=
            dx/distance*max;
        dy=
            dy/distance*max;
    }
    joyX=
        dx/max;
    joyY=
        dy/max;
    stick.style.left=
        (40+dx)+"px";
    stick.style.top=
        (40+dy)+"px";
}
function resetJoystick(){
    joyX=0;
    joyY=0;
    joystickID=null;
    stick.style.left=
        "40px";
    stick.style.top=
        "40px";
}
joystick.addEventListener(
    "touchstart",
    function(e){
        e.preventDefault();
        if(
            joystickID!==null
        )
            return;
        const t=
            e.changedTouches[0];
        joystickID=
            t.identifier;
        updateJoystick(
            t.clientX,
            t.clientY
        );
    },
    {passive:false}
);
joystick.addEventListener(
    "touchmove",
    function(e){
        e.preventDefault();
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.identifier===
                joystickID
            ){
                updateJoystick(
                    t.clientX,
                    t.clientY
                );
            }
        }
    },
    {passive:false}
);
joystick.addEventListener(
    "touchend",
    function(e){
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.identifier===
                joystickID
            ){
                resetJoystick();
            }
        }
    },
    {passive:false}
);
joystick.addEventListener(
    "touchcancel",
    resetJoystick
);
/* =========================
   КАМЕРА
========================= */
let lookID=null;
let lastLookX=0;
/*
   Правую половину экрана
   используем для камеры.
*/
document.addEventListener(
    "touchstart",
    function(e){
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.clientX>
                W*0.45 &&
                t.target!==joystick &&
                t.target!==
                document.getElementById(
                    "fire"
                ) &&
                t.target!==
                document.getElementById(
                    "reload"
                )
            ){
                lookID=
                    t.identifier;
                lastLookX=
                    t.clientX;
            }
        }
    },
    {passive:false}
);
document.addEventListener(
    "touchmove",
    function(e){
        if(
            lookID===null
        )
            return;
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.identifier===
                lookID
            ){
                e.preventDefault();
                const dx=
                    t.clientX-
                    lastLookX;
                /*
                   ПОВОРОТ
                */
                player.angle+=
                    dx*0.008;
                /*
                   ВАЖНО:
                   Здесь НЕТ ограничения
                   0...360.
                   Можно вращаться:
                   360°
                   720°
                   1080°
                   и дальше.
                */
                lastLookX=
                    t.clientX;
            }
        }
    },
    {passive:false}
);
document.addEventListener(
    "touchend",
    function(e){
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.identifier===
                lookID
            ){
                lookID=null;
            }
        }
    }
);
/* =========================
   ДВИЖЕНИЕ
========================= */
function updatePlayer(dt){
    const speed=240;
    /*
       Джойстик:
       вверх = вперёд
       вниз = назад
       влево = влево
       вправо = вправо
    */
    const forward=
        -joyY;
    const strafe=
        joyX;
    /*
       Движение относительно
       направления камеры.
    */
    const dx=
        (
            Math.cos(
                player.angle
            )*
            forward
            -
            Math.sin(
                player.angle
            )*
            strafe
        )*
        speed*
        dt;
    const dy=
        (
            Math.sin(
                player.angle
            )*
            forward
            +
            Math.cos(
                player.angle
            )*
            strafe
        )*
        speed*
        dt;
    const nx=
        player.x+dx;
    const ny=
        player.y+dy;
    /*
       Отдельно проверяем X
       и Y, чтобы можно было
       скользить вдоль стены.
    */
    if(
        !blocked(
            nx,
            player.y
        )
    ){
        player.x=nx;
    }
    if(
        !blocked(
            player.x,
            ny
        )
    ){
        player.y=ny;
    }
}
/* =========================
   РИСОВАНИЕ
========================= */
function draw(){
    ctx.clearRect(
        0,
        0,
        W,
        H
    );
    /*
       НЕБО
    */
    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H/2
        );
    sky.addColorStop(
        0,
        "#4b829e"
    );
    sky.addColorStop(
        1,
        "#9dbbc6"
    );
    ctx.fillStyle=sky;
    ctx.fillRect(
        0,
        0,
        W,
        H/2
    );
    /*
       ЗЕМЛЯ
    */
    ctx.fillStyle=
        "#3d4346";
    ctx.fillRect(
        0,
        H/2,
        W,
        H/2
    );
    /*
       ДОРОГА
    */
    ctx.fillStyle=
        "#555b5e";
    ctx.fillRect(
        W/2-180,
        H/2,
        360,
        H/2
    );
    /*
       ЛИНИИ ДОРОГИ
    */
    ctx.strokeStyle=
        "#d5d5d5";
    ctx.lineWidth=5;
    for(
        let i=0;
        i<7;
        i++
    ){
        const y=
            H/2+
            i*100;
        ctx.beginPath();
        ctx.moveTo(
            W/2,
            y
        );
        ctx.lineTo(
            W/2,
            y+55
        );
        ctx.stroke();
    }
    /*
       СЕТКА
    */
    ctx.strokeStyle=
        "#4b5154";
    ctx.lineWidth=1;
    for(
        let x=0;
        x<=MAP_WIDTH;
        x+=100
    ){
        const sx=
            W/2+
            (
                x-
                player.x
            )*
            0.55;
        if(
            sx>-100 &&
            sx<W+100
        ){
            ctx.beginPath();
            ctx.moveTo(
                sx,
                H/2
            );
            ctx.lineTo(
                sx,
                H
            );
            ctx.stroke();
        }
    }
    for(
        let y=0;
        y<=MAP_HEIGHT;
        y+=100
    ){
        const sy=
            H/2+
            (
                y-
                player.y
            )*
            0.45;
        if(
            sy>H/2 &&
            sy<H+100
        ){
            ctx.beginPath();
            ctx.moveTo(
                0,
                sy
            );
            ctx.lineTo(
                W,
                sy
            );
            ctx.stroke();
        }
    }
    /*
       СТЕНЫ
    */
    for(
        const o of obstacles
    ){
        const sx=
            W/2+
            (
                o.x-
                player.x
            )*
            0.55;
        const sy=
            H/2+
            (
                o.y-
                player.y
            )*
            0.45;
        const sw=
            o.w*
            0.55;
        const sh=
            o.h*
            0.45;
        ctx.fillStyle=
            "#191d20";
        ctx.fillRect(
            sx,
            sy,
            sw,
            sh
        );
        ctx.strokeStyle=
            "#737b80";
        ctx.strokeRect(
            sx,
            sy,
            sw,
            sh
        );
    }
    /*
       ВРАГИ
    */
    for(
        const bot of bots
    ){
        if(
            bot.hp<=0
        )
            continue;
        const dx=
            bot.x-
            player.x;
        const dy=
            bot.y-
            player.y;
        const sx=
            W/2+
            dx*
            0.55;
        const sy=
            H/2+
            dy*
            0.45;
        const distance=
            Math.max(
                100,
                Math.hypot(
                    dx,
                    dy
                )
            );
        const size=
            Math.max(
                20,
                900/
                distance
            );
        if(
            sx<-100 ||
            sx>W+100 ||
            sy<H/2-100 ||
            sy>H+100
        )
            continue;
        /*
           тело
        */
        ctx.fillStyle=
            "#c72e37";
        ctx.fillRect(
            sx-size/2,
            sy-size*2,
            size,
            size*2
        );
        /*
           голова
        */
        ctx.fillStyle=
            "#d6a17d";
        ctx.beginPath();
        ctx.arc(
            sx,
            sy-size*2.3,
            size*.4,
            0,
            Math.PI*2
        );
        ctx.fill();
        /*
           HP
        */
        ctx.fillStyle=
            "#111";
        ctx.fillRect(
            sx-size*.7,
            sy-size*3,
            size*1.4,
            5
        );
        ctx.fillStyle=
            "#31d06b";
        ctx.fillRect(
            sx-size*.7,
            sy-size*3,
            size*1.4*
            (bot.hp/100),
            5
        );
    }
    /*
       ОРУЖИЕ
    */
    ctx.fillStyle=
        "#111";
    ctx.fillRect(
        W/2-60,
        H-80,
        120,
        80
    );
    ctx.fillStyle=
        "#555";
    ctx.fillRect(
        W/2-11,
        H-135,
        22,
        65
    );
}
/* =========================
   HUD
========================= */
function updateHUD(){
    let degrees=
        player.angle*
        180/
        Math.PI;
    degrees=
        ((degrees%360)+360)%360;
    document.getElementById(
        "info"
    ).innerHTML=
        "POS: "+
        Math.round(
            player.x
        )+
        " / "+
        Math.round(
            player.y
        )+
        "&nbsp;&nbsp; ANGLE: "+
        Math.round(
            degrees
        )+
        "°";
    document.getElementById(
        "hp"
    ).textContent=
        "HP "+
        Math.max(
            0,
            Math.round(
                player.hp
            )
        );
    document.getElementById(
        "ammo"
    ).textContent=
        ammo+
        " / "+
        reserve;
}
/* =========================
   СТРЕЛЬБА
========================= */
let ammo=30;
let reserve=90;
document
.getElementById("fire")
.addEventListener(
    "touchstart",
    function(e){
        e.preventDefault();
        shoot();
    },
    {passive:false}
);
function shoot(){
    if(
        ammo<=0
    ){
        reload();
        return;
    }
    ammo--;
    let target=null;
    let closest=Infinity;
    for(
        const bot of bots
    ){
        if(
            bot.hp<=0
        )
            continue;
        const dx=
            bot.x-
            player.x;
        const dy=
            bot.y-
            player.y;
        const distance=
            Math.hypot(
                dx,
                dy
            );
        let relative=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;
        relative=
            Math.atan2(
                Math.sin(relative),
                Math.cos(relative)
            );
        if(
            Math.abs(relative)<0.12 &&
            distance<1000 &&
            distance<closest
        ){
            target=bot;
            closest=distance;
        }
    }
    if(
        target
    ){
        target.hp-=50;
    }
}
/* =========================
   ПЕРЕЗАРЯДКА
========================= */
document
.getElementById("reload")
.addEventListener(
    "touchstart",
    function(e){
        e.preventDefault();
        reload();
    },
    {passive:false}
);
function reload(){
    if(
        ammo>=30 ||
        reserve<=0
    )
        return;
    const need=
        30-ammo;
    const amount=
        Math.min(
            need,
            reserve
        );
    ammo+=amount;
    reserve-=amount;
}
/* =========================
   GAME LOOP
========================= */
let last=
    performance.now();
function loop(now){
    const dt=
        Math.min(
            0.05,
            (now-last)/1000
        );
    last=now;
    updatePlayer(dt);
    updateHUD();
    draw();
    requestAnimationFrame(
        loop
    );
}
requestAnimationFrame(
    loop
);
</script>
</body>
</html>
