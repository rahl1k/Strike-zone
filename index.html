<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>rahl1k • TEST 0.9</title>
<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#39474a;
    touch-action:none;
    font-family:Arial;
}

#map{
    position:absolute;
    width:2000px;
    height:1400px;

    background-color:#465356;

    background-image:
        linear-gradient(#ffffff18 2px,transparent 2px),
        linear-gradient(90deg,#ffffff18 2px,transparent 2px);

    background-size:100px 100px;
}

#player{
    position:absolute;

    width:50px;
    height:50px;

    border-radius:50%;

    background:#1688ff;

    border:4px solid white;

    transform:translate(-50%,-50%);
}

#status{
    position:fixed;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    color:#00ff55;

    font-size:18px;

    z-index:10;

    pointer-events:none;
}

#joystick{
    position:fixed;

    left:30px;
    bottom:30px;

    width:150px;
    height:150px;

    border-radius:50%;

    background:#ffffff22;

    border:4px solid #ffffff88;

    z-index:100;

    touch-action:none;
}

#stick{
    position:absolute;

    left:42px;
    top:42px;

    width:58px;
    height:58px;

    border-radius:50%;

    background:#ffffff88;

    border:3px solid white;

    pointer-events:none;
}

</style>
</head>
<body>
<div id="map">
<div id="player"></div>
</div>
<div id="status">
    rahl1k • TOUCH OFF • 500,500
</div>
<div id="joystick">
<div id="stick"></div>
</div>
<script>

const map =
    document.getElementById("map");

const player =
    document.getElementById("player");

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

const status =
    document.getElementById("status");


let x=500;
let y=500;

let joyX=0;
let joyY=0;

let active=false;


function joystickMove(e){

    const r =
        joystick.getBoundingClientRect();

    const cx =
        r.left+r.width/2;

    const cy =
        r.top+r.height/2;

    let dx =
        e.clientX-cx;

    let dy =
        e.clientY-cy;

    const max=45;

    const d =
        Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;

    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.left =
        (42+dx)+"px";

    stick.style.top =
        (42+dy)+"px";

    status.textContent =
        "rahl1k • TOUCH ON • "+
        Math.round(x)+
        ","+
        Math.round(y);
}


joystick.onpointerdown =
function(e){

    e.preventDefault();

    active=true;

    joystick.setPointerCapture(
        e.pointerId
    );

    joystickMove(e);

};


joystick.onpointermove =
function(e){

    if(!active)
        return;

    e.preventDefault();

    joystickMove(e);

};


joystick.onpointerup =
function(){

    active=false;

    joyX=0;
    joyY=0;

    stick.style.left="42px";
    stick.style.top="42px";

};


joystick.onpointercancel =
function(){

    active=false;

    joyX=0;
    joyY=0;

    stick.style.left="42px";
    stick.style.top="42px";

};


function camera(){

    const cx =
        window.innerWidth/2-x;

    const cy =
        window.innerHeight/2-y;

    map.style.transform =
        "translate("+cx+"px,"+cy+"px)";

}


let last =
    performance.now();


function loop(now){

    const dt =
        Math.min(
            .05,
            (now-last)/1000
        );

    last=now;

    if(active){

        x+=joyX*300*dt;
        y+=joyY*300*dt;

        x=Math.max(25,
            Math.min(1975,x));

        y=Math.max(25,
            Math.min(1375,y));

    }

    player.style.left=x+"px";
    player.style.top=y+"px";

    camera();

    requestAnimationFrame(loop);

}


camera();

requestAnimationFrame(loop);

</script>
</body>
</html>
