<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAHL1K FPS v5</title>

<style>

*{
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#8b5a3c;
touch-action:none;
font-family:Arial,sans-serif;
}

#game{
position:fixed;
inset:0;
overflow:hidden;
background:#65b9ed;
perspective:900px;
}

/* =====================
НЕБО
===================== */

#sky{
display:block;
position:absolute;
left:0;
right:0;
top:0;
height:55%;
z-index:0;
background:#65b9ed;
overflow:hidden;
}

#sky:before,
#sky:after{
content:"";
position:absolute;
background:#fff;
border-radius:50%;
opacity:.85;
}

#sky:before{
width:180px;
height:55px;
left:12%;
top:18%;
box-shadow:
35px -15px 0 5px #fff,
75px 0 0 0 #fff,
300px 40px 0 10px #fff,
340px 25px 0 0 #fff,
650px -10px 0 8px #fff,
700px 10px 0 0 #fff;
}

#sky:after{
width:150px;
height:45px;
right:10%;
top:38%;
box-shadow:
-35px -15px 0 5px #fff,
-75px 0 0 0 #fff,
-300px 30px 0 8px #fff,
-340px 15px 0 0 #fff;
}

/* =====================
ПОЛ
===================== */

#ground{
position:absolute;
left:-100%;
right:-100%;
top:50%;
bottom:-100%;
z-index:1;
background-color:#8b5a3c;

background-image:
linear-gradient(
to right,
#70452f 2px,
transparent 2px
),
linear-gradient(
to bottom,
#70452f 2px,
transparent 2px
);

background-size:80px 40px;

transform-origin:center top;
transform:perspective(500px) rotateX(12deg) scaleY(2);
}

.roadV,
.roadH,
.mark{
display:none;
}

/* =====================
ЗДАНИЯ
===================== */

.building{
display:none !important;
}

/* =====================
МЕНЮ
===================== */

#menu{
position:fixed;
z-index:1000;
inset:0;
background:
linear-gradient(
to bottom,
#182635,
#263746 55%,
#111820
);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

#menuTitle{
position:absolute;
top:55px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:42px;
font-weight:900;
letter-spacing:3px;
text-shadow:0 4px 12px #000;
}

#menuSubtitle{
position:absolute;
top:110px;
left:50%;
transform:translateX(-50%);
color:#ffffffaa;
font-size:15px;
letter-spacing:2px;
}

#lobby{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:260px;
height:400px;
}

#character{
position:absolute;
left:50%;
bottom:10px;
width:150px;
height:340px;
transform:translateX(-50%);
}

/* голова */

#characterHead{
position:absolute;
left:50%;
top:5px;
transform:translateX(-50%);
width:82px;
height:82px;
border-radius:50%;
background:#c98f6c;
border:3px solid #222;
z-index:3;
}

/* шлем */

#helmet{
position:absolute;
left:50%;
top:-8px;
transform:translateX(-50%);
width:105px;
height:62px;
background:#26352d;
border-radius:55px 55px 20px 20px;
border:4px solid #151b18;
z-index:4;
box-shadow:0 5px 8px #0008;
}

#helmetFront{
position:absolute;
left:50%;
top:39px;
transform:translateX(-50%);
width:96px;
height:13px;
background:#17201b;
border-radius:5px;
z-index:5;
}

/* шея */

#characterNeck{
position:absolute;
left:50%;
top:76px;
transform:translateX(-50%);
width:30px;
height:35px;
background:#b97e60;
z-index:1;
}

/* тело */

#characterBody{
position:absolute;
left:50%;
top:92px;
transform:translateX(-50%);
width:115px;
height:145px;
background:#27352f;
border-radius:18px 18px 10px 10px;
border:4px solid #151b18;
z-index:2;
}

/* бронежилет */

#vest{
position:absolute;
left:50%;
top:101px;
transform:translateX(-50%);
width:105px;
height:105px;
background:#343d38;
border:5px solid #171c19;
border-radius:12px;
z-index:4;
box-shadow:
inset 0 0 0 4px #4b554f,
0 4px 8px #0008;
}

#vestPlate{
position:absolute;
left:50%;
top:12px;
transform:translateX(-50%);
width:70px;
height:65px;
background:#252c29;
border:3px solid #151917;
border-radius:7px;
}

#vestStrap1{
position:absolute;
left:7px;
top:0;
width:15px;
height:95px;
background:#202722;
}

#vestStrap2{
position:absolute;
right:7px;
top:0;
width:15px;
height:95px;
background:#202722;
}

/* руки */

#armLeft,
#armRight{
position:absolute;
top:105px;
width:38px;
height:120px;
background:#27352f;
border:4px solid #151b18;
border-radius:18px;
z-index:1;
}

#armLeft{
left:5px;
transform:rotate(8deg);
}

#armRight{
right:5px;
transform:rotate(-8deg);
}

/* ноги */

#legLeft,
#legRight{
position:absolute;
top:225px;
width:45px;
height:105px;
background:#202723;
border:4px solid #151b18;
border-radius:8px 8px 5px 5px;
z-index:1;
}

#legLeft{
left:28px;
}

#legRight{
right:28px;
}

#menuName{
position:absolute;
bottom:-25px;
left:50%;
transform:translateX(-50%);
color:white;
font-weight:bold;
font-size:18px;
text-shadow:0 2px 5px #000;
white-space:nowrap;
}

#playButton{
position:absolute;
right:45px;
bottom:45px;
width:190px;
height:70px;
border:3px solid #baffc7;
border-radius:15px;
background:#22b94b;
color:white;
font-size:28px;
font-weight:bold;
box-shadow:
0 5px 0 #13732e,
0 8px 18px #0008;
}

#playButton:active{
transform:translateY(4px);
box-shadow:
0 1px 0 #13732e,
0 4px 10px #0008;
}

#countdown{
display:none;
position:absolute;
z-index:1100;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:#e52222;
font-size:120px;
font-weight:900;
text-shadow:
0 4px 10px #000,
0 0 20px #ff000066;
}

#countdownText{
display:none;
position:absolute;
z-index:1100;
left:50%;
top:36%;
transform:translateX(-50%);
color:white;
font-size:24px;
font-weight:bold;
text-shadow:0 2px 6px #000;
}

/* =====================
ВКЛАДКИ МЕНЮ
===================== */

#menuTabs{
position:absolute;
left:0;
top:0;
bottom:0;
width:105px;
z-index:1050;
background:#111a22dd;
border-right:2px solid #ffffff18;
display:flex;
flex-direction:column;
align-items:center;
padding-top:150px;
gap:15px;
}

.menuTab{
width:78px;
height:78px;
border:2px solid #ffffff22;
border-radius:16px;
background:#202d38;
display:flex;
align-items:center;
justify-content:center;
color:#d7dde1;
font-size:34px;
box-shadow:0 4px 10px #0008;
transition:.15s;
padding:0;
}

.menuTab.active{
background:#30414d;
border-color:#ffffff66;
box-shadow:
0 0 0 2px #ffffff18,
0 5px 12px #0008;
}

.menuTab:active{
transform:scale(.94);
}

/* =====================
ИКОНКА ДРУЗЕЙ
===================== */

.friendsIcon{
position:relative;
width:50px;
height:42px;
}

.person{
position:absolute;
width:16px;
height:16px;
border-radius:50%;
background:#c7cdd1;
top:0;
}

.person:after{
content:"";
position:absolute;
left:-5px;
top:15px;
width:26px;
height:18px;
border-radius:14px 14px 5px 5px;
background:#c7cdd1;
}

.person.p1{
left:0;
top:5px;
}

.person.p2{
left:17px;
top:0;
z-index:2;
}

.person.p3{
right:0;
top:5px;
}

/* =====================
СТРАНИЦА ДРУЗЕЙ
===================== */

#friendsPage{
display:none;
position:absolute;
z-index:900;
inset:0;
}

#friendsPage.active{
display:block;
}

#friendsTitle{
position:absolute;
top:55px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:36px;
font-weight:900;
letter-spacing:2px;
text-shadow:0 4px 12px #000;
}

#friendsEmpty{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:#ffffff99;
font-size:20px;
font-weight:bold;
text-align:center;
}

/* =====================
HUD
===================== */

#title{
position:fixed;
z-index:100;
top:10px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:23px;
font-weight:bold;
text-shadow:0 2px 5px #000;
}

#info{
position:fixed;
z-index:100;
top:44px;
left:15px;
color:white;
font-size:14px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}

#score{
position:fixed;
z-index:100;
top:68px;
left:15px;
color:#ffd84d;
font-size:16px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}

/* =====================
HP
===================== */

#healthBox{
position:fixed;
z-index:100;
left:20px;
bottom:20px;
width:190px;
height:28px;
background:#111c;
border:2px solid white;
border-radius:6px;
overflow:hidden;
}

#healthBar{
height:100%;
width:100%;
background:#36c968;
transition:width .15s;
}

#healthText{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
font-size:16px;
text-shadow:0 1px 3px #000;
}

/* =====================
AMMO
===================== */

#ammo{
position:fixed;
z-index:100;
right:20px;
bottom:20px;
color:white;
font-size:22px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}

/* =====================
ПРИЦЕЛ
===================== */

#crosshair{
position:fixed;
z-index:100;
left:50%;
top:50%;
width:32px;
height:32px;
transform:translate(-50%,-50%);
}

#crosshair:before{
content:"";
position:absolute;
left:0;
top:15px;
width:32px;
height:2px;
background:white;
}

#crosshair:after{
content:"";
position:absolute;
left:15px;
top:0;
width:2px;
height:32px;
background:white;
}

/* =====================
ДЖОЙСТИК
===================== */

#joystick{
position:fixed;
z-index:200;
left:25px;
bottom:65px;
width:140px;
height:140px;
border-radius:50%;
border:3px solid #ffffff66;
background:#ffffff18;
touch-action:none;
}

#stick{
position:absolute;
left:40px;
top:40px;
width:60px;
height:60px;
border-radius:50%;
background:#ffffff70;
border:2px solid white;
pointer-events:none;
}

/* =====================
КНОПКИ
===================== */

#fire{
position:fixed;
z-index:200;
right:30px;
bottom:95px;
width:85px;
height:85px;
border-radius:50%;
border:2px solid white;
background:#a52c2ccc;
color:white;
font-weight:bold;
}

#reload{
position:fixed;
z-index:200;
right:135px;
bottom:35px;
width:100px;
height:45px;
border-radius:12px;
border:1px solid white;
background:#222c;
color:white;
font-weight:bold;
}

/* =====================
ОРУЖИЕ
===================== */

#weapon{
position:fixed;
z-index:80;
left:50%;
bottom:-15px;
width:170px;
height:130px;
transform:translateX(-50%);
transition:transform .07s;
}

#gun{
position:absolute;
left:30px;
bottom:0;
width:110px;
height:75px;
background:#151718;
border-radius:15px 15px 5px 5px;
box-shadow:0 0 10px #000;
}

#barrel{
position:absolute;
left:72px;
bottom:65px;
width:25px;
height:70px;
background:#303537;
border-radius:5px;
}

/* ПИСТОЛЕТ */

#pistol{
display:none;
position:absolute;
left:54px;
bottom:0;
width:65px;
height:85px;
transform:rotate(-4deg);
}

#pistolSlide{
position:absolute;
left:10px;
top:8px;
width:52px;
height:28px;
background:#17191a;
border-radius:5px 7px 3px 3px;
box-shadow:0 3px 7px #000;
}

#pistolBarrel{
position:absolute;
left:25px;
top:0;
width:22px;
height:18px;
background:#303537;
border-radius:3px;
}

#pistolHandle{
position:absolute;
left:20px;
top:32px;
width:32px;
height:52px;
background:#202324;
border-radius:3px 3px 9px 9px;
transform:rotate(7deg);
box-shadow:0 3px 7px #000;
}

/* НОЖ */

#knife{
display:none;
position:absolute;
left:45px;
bottom:0;
width:80px;
height:125px;
transform:rotate(-12deg);
transform-origin:50% 90%;
}

#knifeBlade{
position:absolute;
left:27px;
top:0;
width:25px;
height:82px;
background:linear-gradient(
135deg,
#eeeeee,
#888
);

clip-path:polygon(
50% 0%,
100% 20%,
85% 100%,
15% 100%,
0% 20%
);

filter:drop-shadow(0 2px 5px #000);
}

#knifeHandle{
position:absolute;
left:24px;
bottom:0;
width:31px;
height:55px;
background:#181a1b;
border-radius:7px 7px 10px 10px;
box-shadow:0 3px 7px #000;
}

#knifeGuard{
position:absolute;
left:17px;
bottom:48px;
width:45px;
height:8px;
background:#444;
border-radius:5px;
}

/* =====================
АНИМАЦИЯ ДОСТАВАНИЯ
===================== */

#weapon.weaponSwitching{
animation:weaponDraw .42s ease-out;
}

@keyframes weaponDraw{

0%{
transform:
translateX(-50%)
translateY(150px)
rotate(8deg);
opacity:0;
}

45%{
transform:
translateX(-50%)
translateY(35px)
rotate(-3deg);
opacity:1;
}

75%{
transform:
translateX(-50%)
translateY(-8px)
rotate(1deg);
}

100%{
transform:
translateX(-50%)
translateY(0)
rotate(0);
opacity:1;
}

}

/* =====================
АНИМАЦИЯ НОЖА
===================== */

#weapon.knifeDraw{
animation:knifeDraw .85s cubic-bezier(.2,.75,.25,1);
}

@keyframes knifeDraw{

0%{
transform:
translateX(-50%)
translateY(180px)
rotate(-35deg);
opacity:0;
}

12%{
transform:
translateX(-50%)
translateY(125px)
rotate(-20deg);
opacity:1;
}

25%{
transform:
translateX(-50%)
translateY(45px)
rotate(35deg);
opacity:1;
}

40%{
transform:
translateX(-50%)
translateY(-75px)
rotate(180deg);
opacity:1;
}

55%{
transform:
translateX(-50%)
translateY(-105px)
rotate(360deg);
opacity:1;
}

68%{
transform:
translateX(-50%)
translateY(-65px)
rotate(540deg);
opacity:1;
}

80%{
transform:
translateX(-50%)
translateY(-15px)
rotate(690deg);
opacity:1;
}

91%{
transform:
translateX(-50%)
translateY(5px)
rotate(770deg);
opacity:1;
}

100%{
transform:
translateX(-50%)
translateY(0)
rotate(720deg);
opacity:1;
}

}

/* =====================
ВСПЫШКА
===================== */

#muzzle{
display:none;
position:absolute;
left:78px;
bottom:125px;
width:35px;
height:35px;
background:#ffd34d;

clip-path:polygon(
50% 0%,
65% 35%,
100% 50%,
65% 65%,
50% 100%,
35% 65%,
0% 50%,
35% 35%
);

filter:drop-shadow(0 0 12px #ff9d00);
}

/* =====================
ВРАГИ
===================== */

.enemy{
position:absolute;
z-index:30;
width:60px;
height:120px;
transform:translate(-50%,-50%);
transform-origin:center center;
}

.enemyBody{
position:absolute;
left:20%;
bottom:0;
width:60%;
height:63%;
border-radius:8px 8px 2px 2px;
}

.enemyHead{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:46%;
aspect-ratio:1/1;
border-radius:50%;
background:#d49a78;
}

.enemyGun{
position:absolute;
left:65%;
top:47%;
width:75%;
height:8%;
background:#161818;
transform:rotate(-8deg);
}

.enemyHP{
position:absolute;
left:0;
top:-10px;
width:100%;
height:5px;
background:#111;
}

.enemyHPInner{
height:100%;
width:100%;
background:#39d36b;
}

.enemy.normal .enemyBody{
background:#a92f38;
}

.enemy.fast .enemyBody{
background:#8b35b8;
}

/* =====================
ВСПЫШКА УРОНА
===================== */

#damage{
position:fixed;
z-index:120;
inset:0;
pointer-events:none;
background:#d00;
opacity:0;
transition:opacity .08s;
}

/* =====================
HIT MARK
===================== */

#hitmark{
position:fixed;
z-index:150;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:#ff4444;
font-size:35px;
font-weight:bold;
opacity:0;
pointer-events:none;
}

/* =====================
МИНИ-КАРТА
===================== */

#minimap{
position:fixed;
z-index:150;
right:15px;
top:15px;
width:120px;
height:120px;
background:#777;
border:2px solid #ffffff99;
border-radius:8px;
overflow:hidden;
}

.mapBuilding{
display:none;
}

#playerDot{
position:absolute;
width:9px;
height:9px;
background:#21a5ff;
border-radius:50%;
transform:translate(-50%,-50%);
box-shadow:0 0 5px #21a5ff;
}

.enemyDot{
position:absolute;
width:7px;
height:7px;
background:#e33;
border-radius:50%;
transform:translate(-50%,-50%);
}

/* =====================
ЗОНА СВАЙПА ОРУЖИЯ
===================== */

#weaponSwitch{
position:fixed;
z-index:250;
top:48px;
right:150px;
width:82px;
height:55px;
border-radius:10px;
background:#111c;
border:2px solid #ffffff88;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
box-shadow:0 2px 8px #0008;
}

#weaponSwipeIcon{
font-size:27px;
line-height:1;
pointer-events:none;
}

#weaponSwipeHint{
position:absolute;
bottom:-13px;
left:50%;
transform:translateX(-50%);
font-size:8px;
color:#ffffff99;
white-space:nowrap;
pointer-events:none;
}

/* =====================
GAME OVER
===================== */

#gameover{
display:none;
position:fixed;
z-index:500;
inset:0;
background:#000d;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
font-size:32px;
font-weight:bold;
text-align:center;
}

#restart{
margin-top:20px;
padding:15px 30px;
font-size:20px;
border-radius:10px;
border:2px solid white;
background:#333;
color:white;
}

/* =====================
ПОВЕРНИ ТЕЛЕФОН
===================== */

#rotate{
display:none;
position:fixed;
z-index:9999;
inset:0;
background:#111;
color:white;
align-items:center;
justify-content:center;
text-align:center;
font-size:24px;
}

@media(max-width:700px) and (orientation:portrait){

#rotate{
display:flex;
}

#playButton{
right:25px;
bottom:30px;
width:160px;
height:60px;
font-size:24px;
}

#menuTitle{
font-size:32px;
top:35px;
}

#menuSubtitle{
top:82px;
}

#menuTabs{
width:82px;
padding-top:110px;
}

.menuTab{
width:62px;
height:62px;
}

}

</style>
</head>

<body>

<!-- =====================
МЕНЮ
===================== -->

<div id="menu">

<!-- =====================
ВКЛАДКИ
===================== -->

<div id="menuTabs">

<button class="menuTab active" id="gameTab">
▶
</button>

<button class="menuTab" id="friendsTab">

<div class="friendsIcon">

<div class="person p1"></div>
<div class="person p2"></div>
<div class="person p3"></div>

</div>

</button>

</div>


<!-- =====================
СТРАНИЦА ДРУЗЕЙ
===================== -->

<div id="friendsPage">

<div id="friendsTitle">
ДРУЗЬЯ
</div>

<div id="friendsEmpty">
Здесь будут твои друзья
</div>

</div>


<div id="menuTitle">
RAHL1K FPS
</div>

<div id="menuSubtitle">
LOBBY
</div>

<div id="lobby">

<div id="character">

<div id="characterHead"></div>

<div id="helmet"></div>
<div id="helmetFront"></div>

<div id="characterNeck"></div>

<script>

/* ==========================
ИГРОК
========================== */

const player={
x:1500,
y:1500,
angle:0,
hp:100
};

const MAP_W=3000;
const MAP_H=3000;


/* ==========================
КАМЕРА
========================== */

let cameraPitch=0;

const MAX_PITCH=65;


/* ==========================
ЗДАНИЯ
========================== */

const buildings=[
{x:0,y:0,w:0,h:0},
{x:0,y:0,w:0,h:0},
{x:0,y:0,w:0,h:0},
{x:0,y:0,w:0,h:0},
{x:0,y:0,w:0,h:0},
{x:0,y:0,w:0,h:0}
];

function updateBuildings(){
}


/* ==========================
СТОЛКНОВЕНИЯ
========================== */

function blocked(x,y){

const r=28;

if(
x<r||
y<r||
x>MAP_W-r||
y>MAP_H-r
)
return true;

return false;

}


/* ==========================
ДЖОЙСТИК
========================== */

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyID=null;

function setJoy(x,y){

const r=
joystick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=40;

const dist=
Math.hypot(dx,dy);

if(dist>max){

dx=dx/dist*max;
dy=dy/dist*max;

}

joyX=dx/max;
joyY=dy/max;

stick.style.left=
(40+dx)+"px";

stick.style.top=
(40+dy)+"px";

}

function resetJoy(){

joyX=0;
joyY=0;
joyID=null;

stick.style.left="40px";
stick.style.top="40px";

}

joystick.addEventListener(
"touchstart",
e=>{

e.preventDefault();

if(joyID!==null)return;

const t=e.changedTouches[0];

joyID=t.identifier;

setJoy(
t.clientX,
t.clientY
);

},
{passive:false}
);

joystick.addEventListener(
"touchmove",
e=>{

e.preventDefault();

for(const t of e.changedTouches){

if(t.identifier===joyID){

setJoy(
t.clientX,
t.clientY
);

}

}

},
{passive:false}
);

joystick.addEventListener(
"touchend",
e=>{

for(const t of e.changedTouches){

if(t.identifier===joyID){

resetJoy();

}

}

}
);

joystick.addEventListener(
"touchcancel",
resetJoy
);


/* ==========================
КАМЕРА 360° + ВВЕРХ / ВНИЗ
========================== */

let lookID=null;

let lastLookX=0;
let lastLookY=0;

document.addEventListener(
"touchstart",
e=>{

for(const t of e.changedTouches){

if(
t.clientX>
window.innerWidth*.42&&
!t.target.closest(
"#fire,#reload,#joystick,#weaponSwitch"
)
){

lookID=t.identifier;

lastLookX=t.clientX;
lastLookY=t.clientY;

}

}

},
{passive:false}
);

document.addEventListener(
"touchmove",
e=>{

if(lookID===null)return;

for(const t of e.changedTouches){

if(t.identifier===lookID){

e.preventDefault();

const dx=
t.clientX-lastLookX;

const dy=
t.clientY-lastLookY;

player.angle+=
dx*.008;

cameraPitch-=
dy*.35;

cameraPitch=
Math.max(
-MAX_PITCH,
Math.min(
MAX_PITCH,
cameraPitch
)
);

lastLookX=t.clientX;
lastLookY=t.clientY;

}

}

},
{passive:false}
);

document.addEventListener(
"touchend",
e=>{

for(const t of e.changedTouches){

if(t.identifier===lookID){

lookID=null;

}

}

}
);


/* ==========================
СВАЙП ОРУЖИЯ
========================== */

const weaponSwitch=
document.getElementById("weaponSwitch");

const weaponSwipeIcon=
document.getElementById("weaponSwipeIcon");

let weaponSwipeID=null;
let weaponSwipeStartX=0;
let weaponSwipeStartY=0;

weaponSwitch.addEventListener(
"touchstart",
e=>{

e.preventDefault();
e.stopPropagation();

if(weaponSwipeID!==null)return;

const t=e.changedTouches[0];

weaponSwipeID=t.identifier;

weaponSwipeStartX=t.clientX;
weaponSwipeStartY=t.clientY;

},
{passive:false}
);

weaponSwitch.addEventListener(
"touchmove",
e=>{

e.preventDefault();
e.stopPropagation();

},
{passive:false}
);

weaponSwitch.addEventListener(
"touchend",
e=>{

e.preventDefault();
e.stopPropagation();

for(const t of e.changedTouches){

if(t.identifier!==weaponSwipeID)
continue;

const dx=
t.clientX-weaponSwipeStartX;

const dy=
t.clientY-weaponSwipeStartY;

const absX=
Math.abs(dx);

const absY=
Math.abs(dy);

const minSwipe=25;

if(
absX>=minSwipe||
absY>=minSwipe
){

if(absX>absY){

if(dx<0){

switchWeapon("knife");

}else{

switchWeapon("pistol");

}

}else{

if(dy>0){

switchWeapon("rifle");

}

}

}

weaponSwipeID=null;

}

},
{passive:false}
);

weaponSwitch.addEventListener(
"touchcancel",
e=>{

weaponSwipeID=null;

},
{passive:false}
);


/* ==========================
ДВИЖЕНИЕ
========================== */

function updatePlayer(dt){

if(player.hp<=0)return;

const speed=270;

const forward=-joyY;
const strafe=joyX;

const dx=
(
Math.cos(player.angle)*forward-
Math.sin(player.angle)*strafe
)*
speed*
dt;

const dy=
(
Math.sin(player.angle)*forward+
Math.cos(player.angle)*strafe
)*
speed*
dt;

const nx=player.x+dx;
const ny=player.y+dy;

if(!blocked(nx,player.y))
player.x=nx;

if(!blocked(player.x,ny))
player.y=ny;

}


/* ==========================
ВРАГИ
========================== */

const enemies=[

{
x:500,
y:700,
hp:100,
el:null,
attack:0,
type:"normal"
},

{
x:2500,
y:700,
hp:100,
el:null,
attack:0,
type:"normal"
},

{
x:500,
y:2400,
hp:100,
el:null,
attack:0,
type:"fast"
},

{
x:2500,
y:2400,
hp:100,
el:null,
attack:0,
type:"fast"
},

{
x:1500,
y:2500,
hp:100,
el:null,
attack:0,
type:"normal"
}

];

let wave=1;


/* ==========================
СПАВН ВОЛНЫ
========================== */

function respawnEnemy(enemy){

const side=
Math.floor(
Math.random()*4
);

let x;
let y;

if(side===0){

x=150+Math.random()*(MAP_W-300);
y=150;

}

else if(side===1){

x=MAP_W-150;
y=150+Math.random()*(MAP_H-300);

}

else if(side===2){

x=150+Math.random()*(MAP_W-300);
y=MAP_H-150;

}

else{

x=150;
y=150+Math.random()*(MAP_H-300);

}

enemy.x=x;
enemy.y=y;
enemy.hp=100;
enemy.attack=0;

enemy.type=
Math.random()<.5
?"normal"
:"fast";

enemy.el.className=
"enemy "+
enemy.type;

enemy.el.style.display="block";

}


/*
Новая волна появляется только после того,
как убиты ВСЕ боты.
*/

function startNewWave(){

wave++;

for(const enemy of enemies){

respawnEnemy(enemy);

}

}


/* ==========================
СОЗДАНИЕ ВРАГОВ
========================== */

function createEnemies(){

for(const enemy of enemies){

const el=
document.createElement("div");

el.className=
"enemy "+
enemy.type;

el.innerHTML=`

<div class="enemyHP">

<div class="enemyHPInner"></div>

</div>

<div class="enemyHead"></div>

<div class="enemyBody"></div>

<div class="enemyGun"></div>

`;

document
.getElementById("game")
.appendChild(el);

enemy.el=el;

}

}

createEnemies();


/* ==========================
ПРОВЕРКА НОВОЙ ВОЛНЫ
========================== */

function checkWave(){

for(const enemy of enemies){

if(enemy.hp>0){

return;

}

}

startNewWave();

}


/* ==========================
ВРАГИ
========================== */

function updateEnemies(dt){

for(const enemy of enemies){

if(enemy.hp<=0){

enemy.el.style.display="none";

continue;

}

const dx=
player.x-enemy.x;

const dy=
player.y-enemy.y;

const distance=
Math.hypot(dx,dy);


/* движение */

if(
distance>120&&
distance<2400
){

const speed=
enemy.type==="fast"
?105
:65;

const ex=
dx/distance*
speed*
dt;

const ey=
dy/distance*
speed*
dt;

const nx=
enemy.x+ex;

const ny=
enemy.y+ey;

if(!blocked(nx,enemy.y))
enemy.x=nx;

if(!blocked(enemy.x,ny))
enemy.y=ny;

}


/* атака */

if(distance<750){

enemy.attack-=dt;

if(enemy.attack<=0){

enemy.attack=
enemy.type==="fast"
?0.65
:1.15;

enemyShoot(enemy);

}

}

showEnemy(enemy);

}

}


/* ==========================
ВРАГ СТРЕЛЯЕТ
========================== */

function enemyShoot(enemy){

if(player.hp<=0)return;

const dx=
player.x-enemy.x;

const dy=
player.y-enemy.y;

const distance=
Math.hypot(dx,dy);

let damage=4;

if(distance<300)
damage=9;

else if(distance<500)
damage=6;

player.hp=
Math.max(
0,
player.hp-damage
);

damageEffect();

}


/* ==========================
ОТОБРАЖЕНИЕ ВРАГА
========================== */

function showEnemy(enemy){

const dx=
enemy.x-player.x;

const dy=
enemy.y-player.y;

const distance=
Math.hypot(dx,dy);

let relative=
Math.atan2(dy,dx)-player.angle;

relative=
Math.atan2(
Math.sin(relative),
Math.cos(relative)
);

if(
Math.abs(relative)>
Math.PI/2
){

enemy.el.style.display="none";

return;

}

const sx=
window.innerWidth/2+
Math.tan(relative)*
window.innerWidth*.55;

const size=
Math.max(
25,
Math.min(
190,
70000/distance
)
);

enemy.el.style.display="block";

enemy.el.style.left=
sx+"px";

enemy.el.style.top=
(
window.innerHeight*.57+
cameraPitch*4
)+"px";

enemy.el.style.width=
size+"px";

enemy.el.style.height=
(size*2)+"px";

enemy.el.style.transform=
"translate(-50%,-50%)";

enemy.el
.querySelector(
".enemyHPInner"
)
.style.width=
Math.max(
0,
enemy.hp
)+"%";

}


/* ==========================
СТРЕЛЬБА
========================== */

let ammo=30;
let reserve=90;
let kills=0;

function shoot(){

if(player.hp<=0)return;

if(currentWeapon==="knife"){

knifeAttack();

return;

}

if(ammo<=0){

reload();

return;

}

ammo--;

const muzzle=
document.getElementById("muzzle");

muzzle.style.display="block";

setTimeout(
()=>{
muzzle.style.display="none";
},
70
);

let target=null;
let closest=Infinity;

for(const enemy of enemies){

if(enemy.hp<=0)continue;

const dx=
enemy.x-player.x;

const dy=
enemy.y-player.y;

const distance=
Math.hypot(dx,dy);

let a=
Math.atan2(
dy,
dx
)-player.angle;

a=
Math.atan2(
Math.sin(a),
Math.cos(a)
);

if(
Math.abs(a)<.12&&
distance<3000&&
distance<closest
){

target=enemy;
closest=distance;

}

}

if(target){

target.hp-=50;

showHit();

if(target.hp<=0){

kills++;

/*
+7 HP за убийство.
Максимум 100.
*/

player.hp=
Math.min(
100,
player.hp+7
);

checkWave();

}

}

const weapon=
document.getElementById("weapon");

weapon.style.transform=
"translateX(-50%) translateY(15px)";

setTimeout(
()=>{
weapon.style.transform=
"translateX(-50%)";
},
70
);

}


/* ==========================
АТАКА НОЖОМ
========================== */

function knifeAttack(){

let target=null;
let closest=Infinity;

for(const enemy of enemies){

if(enemy.hp<=0)continue;

const dx=
enemy.x-player.x;

const dy=
enemy.y-player.y;

const distance=
Math.hypot(dx,dy);

let a=
Math.atan2(
dy,
dx
)-player.angle;

a=
Math.atan2(
Math.sin(a),
Math.cos(a)
);

if(
Math.abs(a)<.25&&
distance<180&&
distance<closest
){

target=enemy;
closest=distance;

}

}

if(target){

target.hp-=100;

showHit();

if(target.hp<=0){

kills++;

/*
+7 HP за убийство ножом.
Максимум 100.
*/

player.hp=
Math.min(
100,
player.hp+7
);

checkWave();

}

}

const weapon=
document.getElementById("weapon");

weapon.style.transform=
"translateX(-50%) translateY(15px) rotate(-8deg)";

setTimeout(
()=>{
weapon.style.transform=
"translateX(-50%)";
},
120
);

}


/* ==========================
АВТОМАТИЧЕСКАЯ СТРЕЛЬБА
========================== */

let fireHeld=false;
let fireTimer=null;

const fireButton=
document.getElementById("fire");

fireButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

if(fireHeld)return;

fireHeld=true;

shoot();

fireTimer=setInterval(()=>{

if(fireHeld){

shoot();

}

},120);

},
{passive:false}
);

fireButton.addEventListener(
"touchend",
e=>{

e.preventDefault();

fireHeld=false;

if(fireTimer){

clearInterval(fireTimer);
fireTimer=null;

}

},
{passive:false}
);

fireButton.addEventListener(
"touchcancel",
e=>{

e.preventDefault();

fireHeld=false;

if(fireTimer){

clearInterval(fireTimer);
fireTimer=null;

}

},
{passive:false}
);


/* ==========================
ПОПАДАНИЕ
========================== */

function showHit(){

const hit=
document.getElementById("hitmark");

hit.style.opacity=1;

setTimeout(
()=>{
hit.style.opacity=0;
},
120
);

}


/* ==========================
ПЕРЕЗАРЯДКА
========================== */

function reload(){

if(
currentWeapon==="knife"
)
return;

if(
ammo>=30||
reserve<=0
)
return;

const amount=
Math.min(
30-ammo,
reserve
);

ammo+=amount;
reserve-=amount;

}

document
.getElementById("reload")
.addEventListener(
"touchstart",
e=>{

e.preventDefault();

reload();

},
{passive:false}
);


/* ==========================
УРОН
========================== */

function damageEffect(){

const damage=
document.getElementById("damage");

damage.style.opacity=.32;

setTimeout(
()=>{
damage.style.opacity=0;
},
120
);

}


/* ==========================
МИНИ-КАРТА
========================== */

function updateMinimap(){

const map=
document.getElementById("minimap");

const w=map.clientWidth;
const h=map.clientHeight;

const dot=
document.getElementById("playerDot");

dot.style.left=
(player.x/MAP_W*w)+"px";

dot.style.top=
(player.y/MAP_H*h)+"px";

document
.querySelectorAll(".enemyDot")
.forEach(
e=>e.remove()
);

for(const enemy of enemies){

if(enemy.hp<=0)continue;

const dot=
document.createElement("div");

dot.className="enemyDot";

dot.style.left=
(enemy.x/MAP_W*w)+"px";

dot.style.top=
(enemy.y/MAP_H*h)+"px";

map.appendChild(dot);

}

}


/* ==========================
HUD
========================== */

function updateHUD(){

let angle=
player.angle*
180/
Math.PI;

angle=
(
angle%360+
360
)%360;

document
.getElementById("info")
.innerHTML=
"POS: "+
Math.round(player.x)+
" / "+
Math.round(player.y)+
"&nbsp;&nbsp; ANGLE: "+
Math.round(angle)+
"°";

document
.getElementById("score")
.textContent=
"KILLS: "+
kills;

document
.getElementById("healthBar")
.style.width=
Math.max(
0,
player.hp
)+"%";

document
.getElementById("healthText")
.textContent=
"HP "+
Math.max(
0,
Math.round(player.hp)
);

document
.getElementById("ammo")
.textContent=
ammo+
" / "+
reserve;

}


/* ==================================================
ПЕРЕКЛЮЧЕНИЕ ОРУЖИЯ
================================================== */

let currentWeapon="rifle";

const weaponElement=
document.getElementById("weapon");

const rifleElement=
document.getElementById("gun");

const rifleBarrel=
document.getElementById("barrel");

const pistolElement=
document.getElementById("pistol");

const knifeElement=
document.getElementById("knife");


function updateWeaponIcon(){

if(currentWeapon==="rifle"){

weaponSwipeIcon.textContent="🔫";

}

else if(currentWeapon==="pistol"){

weaponSwipeIcon.textContent="🔫";

}

else if(currentWeapon==="knife"){

weaponSwipeIcon.textContent="🔪";

}

}


function showWeapon(type){

rifleElement.style.display="none";
rifleBarrel.style.display="none";
pistolElement.style.display="none";
knifeElement.style.display="none";

if(type==="rifle"){

rifleElement.style.display="block";
rifleBarrel.style.display="block";

}

if(type==="pistol"){

pistolElement.style.display="block";

}

if(type==="knife"){

knifeElement.style.display="block";

}

}


function switchWeapon(type){

if(type===currentWeapon)return;

currentWeapon=type;

weaponElement.classList.remove(
"weaponSwitching"
);

weaponElement.classList.remove(
"knifeDraw"
);

void weaponElement.offsetWidth;

showWeapon(type);

if(type==="knife"){

weaponElement.classList.add(
"knifeDraw"
);

}else{

weaponElement.classList.add(
"weaponSwitching"
);

}

setTimeout(()=>{

weaponElement.classList.remove(
"weaponSwitching"
);

weaponElement.classList.remove(
"knifeDraw"
);

},900);

updateWeaponIcon();


if(currentWeapon==="rifle"){

document
.getElementById("ammo")
.style.display="block";

document
.getElementById("reload")
.style.display="block";

document
.getElementById("fire")
.textContent="FIRE";

}

if(currentWeapon==="pistol"){

document
.getElementById("ammo")
.style.display="block";

document
.getElementById("reload")
.style.display="block";

document
.getElementById("fire")
.textContent="FIRE";

}

if(currentWeapon==="knife"){

document
.getElementById("ammo")
.style.display="none";

document
.getElementById("reload")
.style.display="none";

document
.getElementById("fire")
.textContent="ATTACK";

}

}


showWeapon("rifle");
updateWeaponIcon();


/* ==========================
ВКЛАДКИ МЕНЮ
========================== */

const gameTab=
document.getElementById("gameTab");

const friendsTab=
document.getElementById("friendsTab");

const friendsPage=
document.getElementById("friendsPage");

const lobby=
document.getElementById("lobby");

const menuTitle=
document.getElementById("menuTitle");

const menuSubtitle=
document.getElementById("menuSubtitle");

function showGamePage(){

gameTab.classList.add("active");
friendsTab.classList.remove("active");

friendsPage.classList.remove("active");

lobby.style.display="block";
menuTitle.style.display="block";
menuSubtitle.style.display="block";
playButton.style.display="block";

}

function showFriendsPage(){

friendsTab.classList.add("active");
gameTab.classList.remove("active");

friendsPage.classList.add("active");

lobby.style.display="none";
menuTitle.style.display="none";
menuSubtitle.style.display="none";
playButton.style.display="none";

}

gameTab.addEventListener(
"touchstart",
e=>{

e.preventDefault();
e.stopPropagation();

showGamePage();

},
{passive:false}
);

friendsTab.addEventListener(
"touchstart",
e=>{

e.preventDefault();
e.stopPropagation();

showFriendsPage();

},
{passive:false}
);


/* ==========================
МЕНЮ → ИГРА
========================== */

const menu=
document.getElementById("menu");

const playButton=
document.getElementById("playButton");

const countdown=
document.getElementById("countdown");

const countdownText=
document.getElementById("countdownText");

let gameStarted=false;

function startGame(){

if(gameStarted)return;

gameStarted=true;

playButton.style.display="none";

countdown.style.display="block";
countdownText.style.display="block";

let number=5;

countdown.textContent=number;

const timer=setInterval(()=>{

number--;

if(number>=0){

countdown.textContent=number;

}

if(number<0){

clearInterval(timer);

countdown.style.display="none";
countdownText.style.display="none";

menu.style.display="none";

}

},1000);

}

playButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

startGame();

},
{passive:false}
);


/* ==========================
GAME OVER
========================== */

function gameOver(){

const screen=
document.getElementById(
"gameover"
);

if(
screen.style.display==="flex"
)
return;

screen.style.display="flex";

document
.getElementById("finalScore")
.textContent=
"KILLS: "+
kills;

}

document
.getElementById("restart")
.addEventListener(
"touchstart",
()=>{
location.reload();
}
);


/* ==========================
GAME LOOP
========================== */

let last=
performance.now();

function loop(now){

const dt=
Math.min(
.05,
(now-last)/1000
);

last=now;

if(
gameStarted&&
player.hp>0
){

updatePlayer(dt);
updateEnemies(dt);
updateBuildings();
updateMinimap();
updateHUD();

}else if(
gameStarted&&
player.hp<=0
){

gameOver();

}

requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>
