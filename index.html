<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RAHL1K FPS</title>
<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
    touch-action:none;
    font-family:Arial,sans-serif;
}
#world{
    position:absolute;
    inset:0;
    overflow:hidden;
}
/* =========================
   НЕБО И ЗЕМЛЯ
========================= */
#sky{
    position:absolute;
    inset:0 0 45% 0;
    background:
    linear-gradient(
        #397da8,
        #8bb8ca
    );
}
#ground{
    position:absolute;
    left:0;
    top:55%;
    width:100%;
    height:45%;
    background:#3c4144;
}
/* =========================
   ДОРОГА
========================= */
#road{
    position:absolute;
    left:20%;
    top:55%;
    width:60%;
    height:1000px;
    background:#55595b;
    transform-origin:center top;
}
.roadLine{
    position:absolute;
    left:50%;
    width:10px;
    height:90px;
    background:#ddd;
    transform:translateX(-50%);
}
/* =========================
   ЗДАНИЯ
========================= */
.building{
    position:absolute;
    width:190px;
    height:145px;
    background:#76563c;
    border:5px solid #3e2d20;
    box-shadow:
    inset 0 0 0 4px #98704f,
    0 8px 15px #0008;
}
.window{
    position:absolute;
    width:38px;
    height:42px;
    background:#182c36;
    border:3px solid #222;
}
/* =========================
   КОНТЕЙНЕРЫ
========================= */
.container{
    position:absolute;
    width:160px;
    height:78px;
    background:#536b55;
    border:4px solid #29382b;
    box-shadow:0 7px 12px #0008;
}
/* =========================
   ВРАГ
========================= */
.enemy{
    position:absolute;
    width:46px;
    height:86px;
    background:#c52b33;
    border:3px solid #65171b;
    box-shadow:0 5px 10px #0009;
}
.enemy:before{
    content:"";
    position:absolute;
    left:7px;
    top:-34px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#d7a07b;
    border:3px solid #55382a;
}
.enemyHP{
    position:absolute;
    left:-5px;
    top:-48px;
    width:56px;
    height:6px;
    background:#111;
}
.enemyHP div{
    width:100%;
    height:100%;
    background:#31d06b;
}
/* =========================
   HUD
========================= */
#title{
    position:fixed;
    z-index:500;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:23px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}
#info{
    position:fixed;
    z-index:500;
    left:18px;
    top:48px;
    color:white;
    font-size:16px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#hp{
    position:fixed;
    z-index:500;
    left:20px;
    bottom:18px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#ammo{
    position:fixed;
    z-index:500;
    right:20px;
    bottom:18px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
/* =========================
   ПРИЦЕЛ
========================= */
#crosshair{
    position:fixed;
    z-index:500;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    transform:
    translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    width:30px;
    height:2px;
    background:white;
    box-shadow:0 0 3px #000;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:14px;
    top:0;
    width:2px;
    height:30px;
    background:white;
    box-shadow:0 0 3px #000;
}
/* =========================
   ОРУЖИЕ
========================= */
#gun{
    position:fixed;
    z-index:400;
    left:50%;
    bottom:-10px;
    width:120px;
    height:105px;
    transform:
    translateX(-50%);
    background:#151515;
    border-radius:
    25px 25px 0 0;
    box-shadow:0 -5px 15px #0008;
}
#barrel{
    position:absolute;
    left:50%;
    top:-55px;
    width:22px;
    height:65px;
    transform:translateX(-50%);
    background:#555;
    border:3px solid #222;
}
/* =========================
   ДЖОЙСТИК
========================= */
#joystick{
    position:fixed;
    z-index:600;
    left:25px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:
    rgba(255,255,255,.13);
    border:
    3px solid rgba(255,255,255,.45);
    touch-action:none;
}
#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:
    rgba(255,255,255,.5);
    border:2px solid white;
    pointer-events:none;
}
/* =========================
   КНОПКИ
========================= */
#fire{
    position:fixed;
    z-index:600;
    right:30px;
    bottom:95px;
    width:85px;
    height:85px;
    border-radius:50%;
    border:2px solid #ffffff88;
    background:
    rgba(170,35,35,.8);
    color:white;
    font-weight:bold;
    touch-action:none;
}
#reload{
    position:fixed;
    z-index:600;
    right:135px;
    bottom:35px;
    width:100px;
    height:45px;
    border-radius:12px;
    border:1px solid #ffffff66;
    background:
    rgba(30,30,30,.8);
    color:white;
    font-weight:bold;
    touch-action:none;
}
/* =========================
   ПОВОРОТ ТЕЛЕФОНА
========================= */
#rotate{
    display:none;
    position:fixed;
    z-index:1000;
    inset:0;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:24px;
}
</style>
</head>
<body>
<div id="world">
<div id="sky"></div>
<div id="ground"></div>
<div id="road">
    <div class="roadLine" style="top:50px"></div>
    <div class="roadLine" style="top:190px"></div>
    <div class="roadLine" style="top:330px"></div>
    <div class="roadLine" style="top:470px"></div>
    <div class="roadLine" style="top:610px"></div>
</div>
<!-- ЗДАНИЯ -->
<div class="building"
     id="building1"
     style="left:8%;top:32%;">
    <div class="window"
         style="left:25px;top:25px">
    </div>
    <div class="window"
         style="right:25px;top:25px">
    </div>
</div>
<div class="building"
     id="building2"
     style="right:8%;top:36%;">
    <div class="window"
         style="left:25px;top:25px">
    </div>
    <div class="window"
         style="right:25px;top:25px">
    </div>
</div>
<div class="building"
     id="building3"
     style="left:42%;top:27%;">
    <div class="window"
         style="left:25px;top:25px">
    </div>
    <div class="window"
         style="right:25px;top:25px">
    </div>
</div>
<!-- КОНТЕЙНЕРЫ -->
<div class="container"
     id="container1"
     style="left:20%;top:55%">
</div>
<div class="container"
     id="container2"
     style="right:18%;top:60%">
</div>
<!-- ВРАГ -->
<div class="enemy"
     id="enemy"
     style="left:70%;top:45%;">
    <div class="enemyHP">
        <div></div>
    </div>
</div>
</div>
<!-- HUD -->
<div id="title">
    RAHL1K FPS
</div>
<div id="info">
    POS: 0 / 0 &nbsp; ANGLE: 0°
</div>
<div id="hp">
    HP 100
</div>
<div id="ammo">
    30 / 90
</div>
<div id="crosshair"></div>
<!-- ОРУЖИЕ -->
<div id="gun">
    <div id="barrel"></div>
</div>
<!-- ДЖОЙСТИК -->
<div id="joystick">
<div id="stick"></div>
</div>
<button id="fire">
    FIRE
</button>
<button id="reload">
    RELOAD
</button>
<div id="rotate">
    ↔️
    <br><br>
    Поверни телефон горизонтально
</div>
<script>
/* =========================
   ЭЛЕМЕНТЫ
========================= */
const joystick =
document.getElementById("joystick");
const stick =
document.getElementById("stick");
const info =
document.getElementById("info");
const enemy =
document.getElementById("enemy");
const road =
document.getElementById("road");
const buildings =
document.querySelectorAll(".building");
const containers =
document.querySelectorAll(".container");
/* =========================
   ИГРОК
========================= */
let playerX=0;
let playerY=0;
/*
   Угол камеры.
   0 = смотрим вперёд
*/
let angle=0;
/* =========================
   ДЖОЙСТИК
========================= */
let joyX=0;
let joyY=0;
let joyActive=false;
let joyID=null;
function updateJoystick(x,y){
    const rect =
    joystick.getBoundingClientRect();
    const centerX =
    rect.left+rect.width/2;
    const centerY =
    rect.top+rect.height/2;
    let dx=x-centerX;
    let dy=y-centerY;
    const max=40;
    const distance=
    Math.hypot(dx,dy);
    if(distance>max){
        dx=dx/distance*max;
        dy=dy/distance*max;
    }
    joyX=dx/max;
    joyY=dy/max;
    stick.style.left=
    (40+dx)+"px";
    stick.style.top=
    (40+dy)+"px";
}
function resetJoystick(){
    joyActive=false;
    joyID=null;
    joyX=0;
    joyY=0;
    stick.style.left="40px";
    stick.style.top="40px";
}
joystick.addEventListener(
"touchstart",
function(e){
    e.preventDefault();
    if(joyActive)
        return;
    const t=e.changedTouches[0];
    joyActive=true;
    joyID=t.identifier;
    updateJoystick(
        t.clientX,
        t.clientY
    );
},
{passive:false}
);
joystick.addEventListener(
"touchmove",
function(e){
    e.preventDefault();
    if(!joyActive)
        return;
    for(const t of e.changedTouches){
        if(t.identifier===joyID){
            updateJoystick(
                t.clientX,
                t.clientY
            );
        }
    }
},
{passive:false}
);
joystick.addEventListener(
"touchend",
function(e){
    for(const t of e.changedTouches){
        if(t.identifier===joyID){
            resetJoystick();
        }
    }
},
{passive:false}
);
/* =========================
   СВАЙП КАМЕРЫ
========================= */
let lookActive=false;
let lookID=null;
let lastLookX=0;
document.addEventListener(
"touchstart",
function(e){
    for(const t of e.changedTouches){
        /*
           Правая часть экрана
        */
        if(
            t.clientX >
            window.innerWidth*0.45
            &&
            t.target!==joystick
            &&
            t.target!==document.getElementById("fire")
            &&
            t.target!==document.getElementById("reload")
        ){
            lookActive=true;
            lookID=t.identifier;
            lastLookX=t.clientX;
        }
    }
},
{passive:false}
);
document.addEventListener(
"touchmove",
function(e){
    if(!lookActive)
        return;
    for(const t of e.changedTouches){
        if(t.identifier===lookID){
            e.preventDefault();
            const dx=
            t.clientX-lastLookX;
            /*
               Плавность поворота
            */
            angle +=
            dx*0.006;
            /*
               Не даём углу
               бесконечно расти
            */
            if(angle>Math.PI*2)
                angle-=Math.PI*2;
            if(angle<-Math.PI*2)
                angle+=Math.PI*2;
            lastLookX=
            t.clientX;
        }
    }
},
{passive:false}
);
document.addEventListener(
"touchend",
function(e){
    for(const t of e.changedTouches){
        if(t.identifier===lookID){
            lookActive=false;
            lookID=null;
        }
    }
}
);
/* =========================
   ДВИЖЕНИЕ
========================= */
let lastTime=
performance.now();
function gameLoop(now){
    const dt=
    Math.min(
        0.05,
        (now-lastTime)/1000
    );
    lastTime=now;
    const speed=220;
    /*
       Вперёд/назад
    */
    const forward=
    -joyY;
    /*
       Влево/вправо
    */
    const strafe=
    joyX;
    /*
       Движение зависит
       от направления камеры
    */
    const moveX=
    (
        Math.cos(angle)*forward
        -
        Math.sin(angle)*strafe
    )
    *
    speed*
    dt;
    const moveY=
    (
        Math.sin(angle)*forward
        +
        Math.cos(angle)*strafe
    )
    *
    speed*
    dt;
    playerX+=moveX;
    playerY+=moveY;
    updateWorld();
    requestAnimationFrame(
        gameLoop
    );
}
requestAnimationFrame(
gameLoop
);
/* =========================
   ОТОБРАЖЕНИЕ МИРА
========================= */
function updateWorld(){
    /*
       Основное смещение
    */
    const worldX=
    -playerX;
    const worldY=
    -playerY;
    /*
       Поворот камеры
    */
    const lookX=
    angle*180/Math.PI;
    /*
       Здания
    */
    buildings.forEach(
    function(el){
        const baseX=
        el.dataset.baseX ||
        el.offsetLeft;
        const baseY=
        el.dataset.baseY ||
        el.offsetTop;
        el.dataset.baseX=baseX;
        el.dataset.baseY=baseY;
        /*
           Поворот имитируем
           горизонтальным смещением
        */
        const rotationOffset=
        -lookX*2;
        el.style.transform=
        "translate("+
        (
            worldX*.7+
            rotationOffset
        )+
        "px,"+
        worldY*.7+
        "px)";
    });
    /*
       Контейнеры
    */
    containers.forEach(
    function(el){
        el.style.transform=
        "translate("+
        (
            worldX+
            -lookX*3
        )+
        "px,"+
        worldY+
        "px)";
    });
    /*
       Враг
    */
    enemy.style.transform=
    "translate("+
    (
        worldX+
        -lookX*3
    )+
    "px,"+
    worldY+
    "px)";
    /*
       Дорога
    */
    road.style.transform=
    "translate("+
    (
        worldX*.25+
        -lookX
    )+
    "px,"+
    worldY*.25+
    "px)";
    /*
       HUD
    */
    let degrees=
    angle*180/Math.PI;
    degrees=
    ((degrees%360)+360)%360;
    info.innerHTML=
    "POS: "+
    Math.round(playerX)+
    " / "+
    Math.round(playerY)+
    "&nbsp;&nbsp; ANGLE: "+
    Math.round(degrees)+
    "°";
}
/* =========================
   СТРЕЛЬБА
========================= */
let ammo=30;
let reserve=90;
let enemyHP=100;
document
.getElementById("fire")
.addEventListener(
"touchstart",
function(e){
    e.preventDefault();
    shoot();
},
{passive:false}
);
function shoot(){
    if(ammo<=0){
        reload();
        return;
    }
    ammo--;
    document.getElementById("ammo")
    .textContent=
    ammo+" / "+reserve;
    /*
       Простая проверка:
       враг находится около
       центра экрана
    */
    const rect=
    enemy.getBoundingClientRect();
    const centerX=
    window.innerWidth/2;
    const centerY=
    window.innerHeight/2;
    if(
        centerX>rect.left &&
        centerX<rect.right &&
        centerY>rect.top-40 &&
        centerY<rect.bottom
    ){
        enemyHP-=50;
        enemy
        .querySelector(".enemyHP div")
        .style.width=
        Math.max(
            0,
            enemyHP
        )+"%";
        if(enemyHP<=0){
            enemy.style.display="none";
        }
    }
}
/* =========================
   RELOAD
========================= */
document
.getElementById("reload")
.addEventListener(
"touchstart",
function(e){
    e.preventDefault();
    reload();
},
{passive:false}
);
function reload(){
    if(
        ammo===30 ||
        reserve<=0
    )
        return;
    const need=
    30-ammo;
    const amount=
    Math.min(
        need,
        reserve
    );
    ammo+=amount;
    reserve-=amount;
    document.getElementById("ammo")
    .textContent=
    ammo+" / "+reserve;
}
/* =========================
   ПОВОРОТ ТЕЛЕФОНА
========================= */
function orientation(){
    document.getElementById(
        "rotate"
    ).style.display=
    window.innerHeight>
    window.innerWidth
    ? "flex"
    : "none";
}
window.addEventListener(
"resize",
orientation
);
orientation();
/* =========================
   ПЕРВОНАЧАЛЬНОЕ СОСТОЯНИЕ
========================= */
updateWorld();
</script>
</body>
</html>
