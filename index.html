function collides(x,y){

    const radius=25;

    if(
        x<radius ||
        y<radius ||
        x>map.width-radius ||
        y>map.height-radius
    ){
        return true;
    }

    for(const o of obstacles){

        if(
            x+radius>o.x &&
            x-radius<o.x+o.w &&
            y+radius>o.y &&
            y-radius<o.y+o.h
        ){
            return true;
        }
    }

    return false;
}

function updateJoystick(clientX,clientY){

    const r=joystick.getBoundingClientRect();

    let x=clientX-(r.left+r.width/2);

    const max=42;

    const distance=Math.hypot(x,y);

    if(distance>max){

        x=x/distance*max;
        y=y/distance*max;

    joy.x=x/max;
    joy.y=y/max;

    stick.style.left=(41+x)+"px";
    stick.style.top=(41+y)+"px";
}

function worldToScreen(x,y){

    const dx=x-player.x;
    const dy=y-player.y;

    const cos=Math.cos(-player.angle);
    const sin=Math.sin(-player.angle);

    return{

        x:dx*cos-dy*sin+W/2,

        y:dx*sin+dy*cos+H/2
    };
}

function drawRoad(x,y,w,h){

        p.x,
        p.y,

    ctx.lineWidth=4;

    ctx.strokeRect(
        p.x,
        p.y,
        p2.x-p.x,
        p2.y-p.y
    );
}

function checkGame(){

    if(
        player.hp<=0 &&
        !gameEnded
    ){

        player.hp=0;
        gameEnded=true;

        document.getElementById("message")
        .textContent="YOU DIED";

        document.getElementById("message")
        .style.display="block";

        document.getElementById("restart")
        .style.display="block";

        return;
    }

    const alive=bots.filter(
        b=>!b.dead
    ).length;

    if(
        alive===0 &&
        !gameEnded
    ){

        gameEnded=true;

        document.getElementById("message")
        .textContent="ROUND WON!";

        document.getElementById("message")
        .style.display="block";

        document.getElementById("restart")
        .style.display="block";
    }
}

    player.x=500;

    player.angle=0;
    player.hp=100;

    ammo=30;
    reserve=90;

    reloading=false;
    gameEnded=false;

    .style.display="none";

    document.getElementById("restart")
    .style.display="none";

========================= */

let last=performance.now();

function loop(now){

    const dt=Math.min(
        0.05,
        (now-last)/1000
    );

    last=now;

    movePlayer(dt);

    updateBots(dt);

    updateFire(dt);

    checkGame();

    updateHUD();

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawMap();

    drawBots();

    drawWeapon();

    drawFlash();

}
