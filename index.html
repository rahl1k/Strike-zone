function worldToScreen(x,y){

    const dx=x-player.x;
    const dy=y-player.y;

    const cos=
        Math.cos(-player.angle);

    const sin=
        Math.sin(-player.angle);

    return {

        x:
            dx*cos-dy*sin+
            W/2,

        y:
            dx*sin+dy*cos+
            H/2
    };
}

    if(
        player.hp<=0 &&
        !gameEnded
    ){

        player.hp=0;

        gameEnded=true;

        document.getElementById(
            "message"
        ).textContent=
            "YOU DIED";

        document.getElementById(
            "message"
        ).style.display="block";

        document.getElementById(
            "restart"
        ).style.display="block";

        return;
    }

    const alive=
        bots.filter(
            b=>!b.dead
        ).length;

    if(
        alive===0 &&
        !gameEnded
    ){

        gameEnded=true;

        document.getElementById(
            "message"
        ).textContent=
            "ROUND WON!";

        document.getElementById(
            "message"
        ).style.display="block";

        document.getElementById(
            "restart"
        ).style.display="block";
    }
}

/* =========================
   GAME LOOP
========================= */

let last=
    performance.now();

function loop(now){

    const dt=
        Math.min(
            0.05,
            (now-last)/1000
        );

    last=now;

    movePlayer(dt);

    updateBots(dt);

    checkGame();

    updateHUD();

    draw();

    requestAnimationFrame(
        loop

}
