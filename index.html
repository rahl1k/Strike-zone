<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAHL1K FPS v6 ONLINE</title>

<style>
*{
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#8b5a3c;
touch-action:none;
font-family:Arial,sans-serif;
}

#game{
position:fixed;
inset:0;
overflow:hidden;
background:#65b9ed;
perspective:900px;
}

#sky{
position:absolute;
left:0;
right:0;
top:0;
height:55%;
z-index:0;
background:#65b9ed;
overflow:hidden;
}

#sky:before,
#sky:after{
content:"";
position:absolute;
background:#fff;
border-radius:50%;
opacity:.85;
}

#sky:before{
width:180px;
height:55px;
left:12%;
top:18%;
box-shadow:
35px -15px 0 5px #fff,
75px 0 0 0 #fff,
300px 40px 0 10px #fff,
340px 25px 0 0 #fff,
650px -10px 0 8px #fff,
700px 10px 0 0 #fff;
}

#sky:after{
width:150px;
height:45px;
right:10%;
top:38%;
box-shadow:
-35px -15px 0 5px #fff,
-75px 0 0 0 #fff,
-300px 30px 0 8px #fff,
-340px 15px 0 0 #fff;
}

#ground{
position:absolute;
left:-100%;
right:-100%;
top:50%;
bottom:-100%;
z-index:1;
background-color:#8b5a3c;
background-image:
linear-gradient(to right,#70452f 2px,transparent 2px),
linear-gradient(to bottom,#70452f 2px,transparent 2px);
background-size:80px 40px;
transform-origin:center top;
transform:perspective(500px) rotateX(12deg) scaleY(2);
}

.roadV,
.roadH,
.mark,
.building{
display:none!important;
}

/* =====================
МЕНЮ
===================== */

linear-gradient(

#182635,
#263746 55%,
#111820
);

}

#legRight{

}

#menuName{
position:absolute;

ПРОФИЛЬ
===================== */

}

.person.p2{
left:17px;
top:0;
}

.person.p3{
right:0;
top:5px;
}

/* =====================
ДРУЗЬЯ
===================== */

#friendsPage,
#lobbyPage{
display:none;
position:absolute;
z-index:900;
inset:0;

}

#lobbyPage.active{

/* =====================
HUD
===================== */

#title{

}

overflow:hidden;
}

#healthBar{

width:100%;

}

#healthText{

inset:0;

}

#ammo{

}

ОРУЖИЕ
===================== */

/* =====================
БОТЫ + ОНЛАЙН ИГРОК
===================== */

.enemy,
.remotePlayer{
position:absolute;
z-index:30;
width:60px;
height:120px;
transform:translate(-50%,-50%);
}

.enemyBody,
.remotePlayerBody{
position:absolute;
left:20%;
bottom:0;
width:60%;
height:63%;
border-radius:8px;
}

.enemyHead,
.remotePlayerHead{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:46%;
aspect-ratio:1;
border-radius:50%;
background:#d49a78;
}

.enemyGun,
.remotePlayerGun{
position:absolute;
left:65%;
top:47%;
width:75%;
height:8%;
background:#161818;
}

.enemyHP,
.remotePlayerHP{
position:absolute;
left:0;
top:-10px;

height:5px;
background:#111;
}

.enemyHPInner,
.remotePlayerHPInner{

width:100%;
background:#39d36b;
}

.enemy.normal .enemyBody{
background:#a92f38;
}

.enemy.fast .enemyBody{
background:#8b35b8;
}

.remotePlayer{
z-index:35;

}

.remotePlayerBody{
background:#27352f;
border:3px solid #151b18;
}

.remotePlayerHelmet{
position:absolute;
left:50%;
top:-5%;
transform:translateX(-50%);

height:30%;
background:#26352d;
border:2px solid #151b18;
border-radius:50% 50% 20% 20%;
z-index:3;
}

.remotePlayerName{
position:absolute;
left:50%;
top:-28px;
transform:translateX(-50%);

<script>

/* ==========================
ОНЛАЙН
========================== */

let onlineSocket=null;

let myOnlineID=null;

let myNickname="";

let foundFriendID=null;

let cachedFriends=[];

let incomingLobbyFromID=null;

let currentLobbyMembers=[];

let lobbyCountdownTimer=null;

const remotePlayers=
new Map();

let multiplayerMatch=false;

let lastStateSend=0;


const $=
id=>
document.getElementById(id);


const profileStatus=
$("profileStatus");

const profileID=
$("profileID");

const nicknameInput=
$("nicknameInput");

const saveNickname=
$("saveNickname");

const friendIDInput=
$("friendIDInput");

const findFriendButton=
$("findFriendButton");

const friendResult=
$("friendResult");

const addFriendButton=
$("addFriendButton");

const friendsMessage=
$("friendsMessage");

const friendsList=
$("friendsList");

const lobbyFriendsList=
$("lobbyFriendsList");

const lobbyMessage=
$("lobbyMessage");

const lobbyInvitePopup=
$("lobbyInvitePopup");

const lobbyInviteText=
$("lobbyInviteText");

const acceptLobbyInvite=
$("acceptLobbyInvite");

const declineLobbyInvite=
$("declineLobbyInvite");

const lobbyPlayButton=
$("lobbyPlayButton");

const lobbyLeaveButton=
$("lobbyLeaveButton");


function escapeHTML(t){

return String(t)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


function sendOnline(data){

if(
onlineSocket &&
onlineSocket.readyState===
WebSocket.OPEN
){

onlineSocket.send(
JSON.stringify(data)
);

return true;

}

friendsMessage.textContent=
"Нет соединения с сервером";

lobbyMessage.textContent=
"Нет соединения с сервером";

return false;

}


/* ==========================
ПОДКЛЮЧЕНИЕ
========================== */

function connectOnline(){

const protocol=
location.protocol==="https:"
?"wss:"
:"ws:";

onlineSocket=
new WebSocket(
protocol+
"//"+
location.host
);


onlineSocket.addEventListener(
"open",
()=>{

profileStatus.textContent=
"● ONLINE";

profileStatus.style.color=
"#46dc73";

}
);


onlineSocket.addEventListener(
"close",
()=>{

profileStatus.textContent=
"● OFFLINE";

profileStatus.style.color=
"#ff5555";

setTimeout(
connectOnline,
2500
);

}
);


onlineSocket.addEventListener(
"error",
()=>{

profileStatus.textContent=
"ОШИБКА СОЕДИНЕНИЯ";

profileStatus.style.color=
"#ff5555";

}
);


onlineSocket.addEventListener(
"message",
event=>{

let data;

try{

data=
JSON.parse(
event.data
);

}catch{

return;

}


/* ID */

if(
data.type===
"welcome"
){

myOnlineID=
data.id;

myNickname=
data.nickname;

profileID.textContent=
"ID: "+
myOnlineID;

const saved=
localStorage.getItem(
"rahl1kNickname"
);

if(saved){

nicknameInput.value=
saved;

sendOnline({
type:"setNickname",
nickname:saved
});

}else{

nicknameInput.value=
myNickname;

$("menuName").textContent=
myNickname;

}

}


/* НИК */

if(
data.type===
"nicknameChanged"
){

myNickname=
data.nickname;

nicknameInput.value=
myNickname;

$("menuName").textContent=
myNickname;

localStorage.setItem(
"rahl1kNickname",
myNickname
);

renderLobbyMembers(
currentLobbyMembers
);

}


/* ПОИСК */

if(
data.type===
"findResult"
){

if(!data.found){

foundFriendID=null;

friendResult.style.display=
"block";

friendResult.textContent=
"Игрок не найден";

addFriendButton.style.display=
"none";

}else{

foundFriendID=
data.id;

friendResult.style.display=
"block";

friendResult.innerHTML=
"<b>"+
escapeHTML(
data.nickname
)+
"</b><br>ID: "+
data.id;

addFriendButton.style.display=
"block";

}

}


/* ДОБАВЛЕНИЕ */

if(
data.type===
"friendResult"
){

friendsMessage.textContent=
data.success
?"Игрок добавлен в друзья"
:(
data.message ||
"Не удалось добавить"
);

if(data.success){

addFriendButton.style.display=
"none";

sendOnline({
type:"getFriends"
});

}

}


/* НАС ДОБАВИЛИ */

if(
data.type===
"friendAdded"
){

friendsMessage.textContent=
data.nickname+
" добавлен в друзья";

sendOnline({
type:"getFriends"
});

}


/* СПИСОК */

if(
data.type===
"friendsList"
){

cachedFriends=
data.friends || [];

renderFriends(
cachedFriends
);

renderLobbyFriends(
cachedFriends
);

}


/* ЛОББИ */

if(
data.type===
"lobbyMessage"
){

lobbyMessage.textContent=
data.message || "";

}


if(
data.type===
"lobbyInvite"
){

incomingLobbyFromID=
data.fromID;

lobbyInviteText.textContent=
data.fromNickname+
" приглашает тебя в лобби";

lobbyInvitePopup.style.display=
"block";

}


if(
data.type===
"lobbyInviteAccepted"
){

lobbyMessage.textContent=
data.nickname+
" вошёл в лобби";

}


if(
data.type===
"lobbyState"
){

currentLobbyMembers=
data.members || [];

renderLobbyMembers(
currentLobbyMembers
);

if(data.inLobby){

lobbyMessage.textContent=
currentLobbyMembers.length>=2
?"Лобби готово"
:"Ожидание второго игрока";

}

}


/* ОТСЧЁТ */

if(
data.type===
"lobbyCountdown"
){

showLobbyCountdown(
Number(
data.startAt
)
);

}


/* ==========================
СТАРТ ОНЛАЙН МАТЧА
========================== */

if(
data.type===
"startGame"
){

multiplayerMatch=
true;

clearRemotePlayers();

if(data.spawn){

player.x=
Number(
data.spawn.x
) || 1500;

player.y=
Number(
data.spawn.y
) || 1500;

player.angle=
Number(
data.spawn.angle
) || 0;

player.hp=
100;

}


for(
const p
of
(data.players || [])
){

if(
Number(p.id)!==
Number(myOnlineID)
){

upsertRemotePlayer(
p
);

}

}


launchLobbyGame();

}


/* ==========================
ПОЗИЦИЯ ДРУГОГО ИГРОКА
========================== */

if(
data.type===
"remotePlayerState"
){

upsertRemotePlayer(
data
);

}


/* ==========================
ДРУГОЙ ИГРОК ВЫСТРЕЛИЛ
========================== */

if(
data.type===
"remotePlayerShot"
){

remoteShotEffect(
data.id
);

}


/* ==========================
ИГРОК ВЫШЕЛ
========================== */

if(
data.type===
"remotePlayerLeft"
){

removeRemotePlayer(
data.id
);

}

}
);

}


connectOnline();


/* ==========================
ДРУЗЬЯ
========================== */

function renderFriends(
friends
){

friendsList.innerHTML="";

if(!friends.length){

friendsList.innerHTML=
'<div style="color:#ffffff77;padding:8px 0">Список пуст</div>';

return;

}

for(
const f
of friends
){

const item=
document.createElement(
"div"
);

item.className=
"friendItem";

item.innerHTML=

'<div><b>'+
escapeHTML(
f.nickname
)+
'</b><br>'+
'<span style="font-size:11px;color:#ffffff88">'+
'ID: '+
f.id+
'</span></div>'+
'<div class="friendOnline">'+
'● ONLINE'+
'</div>';

friendsList.appendChild(
item
);

}

}


/* ==========================
ДРУЗЬЯ В ЛОББИ
========================== */

function renderLobbyFriends(
friends
){

lobbyFriendsList.innerHTML="";

if(!friends.length){

lobbyFriendsList.innerHTML=
'<div style="color:#ffffff77;font-size:12px">Нет друзей онлайн</div>';

return;

}


for(
const f
of friends
){

const item=
document.createElement(
"div"
);

item.className=
"lobbyFriendItem";


item.innerHTML=

'<div class="lobbyFriendTop">'+

'<div>'+

'<div class="lobbyFriendName">'+
escapeHTML(
f.nickname
)+
'</div>'+

'<div style="font-size:10px;color:#ffffff77">'+
'ID: '+
f.id+
'</div>'+

'</div>'+

'<div class="lobbyFriendStatus">'+
'● ONLINE'+
'</div>'+

'</div>';


const button=
document.createElement(
"button"
);

button.className=
"inviteLobbyButton";

button.textContent=
"ПРИГЛАСИТЬ В ЛОББИ";


button.addEventListener(
"touchstart",
e=>{

e.preventDefault();

e.stopPropagation();

sendOnline({
type:"inviteToLobby",
id:f.id
});

},
{passive:false}
);


item.appendChild(
button
);


item.addEventListener(
"touchstart",
e=>{

if(
e.target.closest(
".inviteLobbyButton"
)
)
return;

e.preventDefault();

document
.querySelectorAll(
".lobbyFriendItem"
)
.forEach(
x=>
x.classList.remove(
"selected"
)
);

item.classList.add(
"selected"
);

},
{passive:false}
);


lobbyFriendsList.appendChild(
item
);

}

}


/* ==========================
БОЕЦ ЛОББИ
========================== */

function createPartySoldier(
nickname
){

const s=
document.createElement(
"div"
);

s.className=
"partySoldier";

s.innerHTML=

'<div class="partyHead"></div>'+
'<div class="partyHelmet"></div>'+
'<div class="partyHelmetFront"></div>'+
'<div class="partyNeck"></div>'+
'<div class="partyArm left"></div>'+
'<div class="partyArm right"></div>'+
'<div class="partyBody"></div>'+
'<div class="partyVest"></div>'+
'<div class="partyLeg left"></div>'+
'<div class="partyLeg right"></div>'+
'<div class="partyPlayerName">'+
escapeHTML(
nickname
)+
'</div>';

return s;

}


function renderLobbyMembers(
members
){

const a=
$("partySlot1");

const b=
$("partySlot2");

a.innerHTML="";
b.innerHTML="";

a.classList.remove(
"empty"
);

b.classList.remove(
"empty"
);


const first=
members[0] ||
{
nickname:
myNickname ||
"Игрок"
};


a.appendChild(
createPartySoldier(
first.nickname
)
);


if(members[1]){

b.appendChild(
createPartySoldier(
members[1].nickname
)
);

}else{

b.classList.add(
"empty"
);

b.innerHTML=
'<div style="font-size:55px;color:#ffffff55;margin:auto">+</div>';

}

}


/* ==========================
КНОПКИ ПРОФИЛЯ
========================== */

saveNickname.addEventListener(
"touchstart",
e=>{

e.preventDefault();

const n=
nicknameInput
.value
.trim();

if(n){

sendOnline({
type:"setNickname",
nickname:n
});

}

},
{passive:false}
);


findFriendButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

const id=
Number(
friendIDInput.value
);

if(id){

sendOnline({
type:"findPlayer",
id:id
});

}

},
{passive:false}
);


addFriendButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

if(foundFriendID){

sendOnline({
type:"addFriend",
id:foundFriendID
});

}

},
{passive:false}
);


acceptLobbyInvite.addEventListener(
"touchstart",
e=>{

e.preventDefault();

if(
incomingLobbyFromID
){

sendOnline({
type:"acceptLobbyInvite",
fromID:
incomingLobbyFromID
});

}

lobbyInvitePopup.style.display=
"none";

incomingLobbyFromID=null;

showLobbyPage();

},
{passive:false}
);


declineLobbyInvite.addEventListener(
"touchstart",
e=>{

e.preventDefault();

if(
incomingLobbyFromID
){

sendOnline({
type:"declineLobbyInvite",
fromID:
incomingLobbyFromID
});

}

lobbyInvitePopup.style.display=
"none";

incomingLobbyFromID=null;

},
{passive:false}
);


lobbyPlayButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

if(
currentLobbyMembers.length<2
){

lobbyMessage.textContent=
"Сначала пригласи друга";

return;

}

sendOnline({
type:"startLobbyGame"
});

},
{passive:false}
);


lobbyLeaveButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

sendOnline({
type:"leaveLobby"
});

currentLobbyMembers=[];

renderLobbyMembers([]);

},
{passive:false}
);


/* ==========================
ИГРОК
========================== */

const player={
x:1500,
y:1500,
angle:0,
hp:100
};

const MAP_W=3000;

const MAP_H=3000;

let cameraPitch=0;

const MAX_PITCH=65;


function blocked(
x,
y
){

const r=28;

return(
x<r ||
y<r ||
x>MAP_W-r ||
y>MAP_H-r
);

}


/* ==========================
ВТОРОЙ ИГРОК
========================== */

function makeRemoteElement(
p
){

const el=
document.createElement(
"div"
);

el.className=
"remotePlayer";

el.innerHTML=

'<div class="remotePlayerName">'+
escapeHTML(
p.nickname ||
"Игрок"
)+
'</div>'+

'<div class="remotePlayerHP">'+
'<div class="remotePlayerHPInner"></div>'+
'</div>'+

'<div class="remotePlayerHelmet"></div>'+
'<div class="remotePlayerHead"></div>'+
'<div class="remotePlayerBody"></div>'+
'<div class="remotePlayerGun"></div>'+
'<div class="remotePlayerWeapon">🔫</div>';


$("game").appendChild(
el
);

return el;

}


function upsertRemotePlayer(
p
){

if(
Number(p.id)===
Number(myOnlineID)
)
return;


let r=
remotePlayers.get(
Number(p.id)
);


if(!r){

r={

id:
Number(p.id),

nickname:
p.nickname ||
"Игрок",

x:
Number(p.x) ||
1500,

y:
Number(p.y) ||
1500,

angle:
Number(p.angle) ||
0,

hp:
Number(p.hp) ||
100,

weapon:
p.weapon ||
"rifle",

el:
makeRemoteElement(p),

shotFlash:
0

};


remotePlayers.set(
r.id,
r
);

}else{

r.nickname=
p.nickname ||
r.nickname;

r.x=
Number(p.x);

r.y=
Number(p.y);

r.angle=
Number(p.angle);

if(
Number.isFinite(
Number(p.hp)
)
){

r.hp=
Number(p.hp);

}

r.weapon=
p.weapon ||
r.weapon;

}

}


function removeRemotePlayer(
id
){

const r=
remotePlayers.get(
Number(id)
);

if(
r &&
r.el
){

r.el.remove();

}

remotePlayers.delete(
Number(id)
);

}


function clearRemotePlayers(){

for(
const r
of remotePlayers.values()
){

if(r.el){

r.el.remove();

}

}

remotePlayers.clear();

}


function remoteShotEffect(
id
){

const r=
remotePlayers.get(
Number(id)
);

if(!r)
return;

r.shotFlash=
performance.now()+
120;

const joystick=

let joyID=null;


function setJoy(
x,
y
){

const r=
joystick
.getBoundingClientRect();

const cx=
r.left+
r.width/2;

const cy=
r.top+
r.height/2;

let dx=
x-cx;

let dy=
y-cy;

const max=40;

const dist=
Math.hypot(
dx,
dy
);

if(
dist>max
){

dx=
dx/dist*
max;

dy=
dy/dist*
max;

}

joyX=
dx/max;

joyY=
dy/max;

stick.style.left=
40+dx+"px";

stick.style.top=
40+dy+"px";

}


function resetJoy(){

joyX=0;

joyY=0;

joyID=null;

stick.style.left=
"40px";

stick.style.top=
"40px";

}


joystick.addEventListener(
"touchstart",
e=>{

e.preventDefault();

if(
joyID!==null
)
return;

const t=
e.changedTouches[0];

joyID=
t.identifier;

setJoy(
t.clientX,
t.clientY
);

},
{passive:false}
);


joystick.addEventListener(
"touchmove",
e=>{

e.preventDefault();

for(
const t
of e.changedTouches
){

if(
t.identifier===
joyID
){

setJoy(
t.clientX,
t.clientY
);

}

}

},
{passive:false}
);


joystick.addEventListener(
"touchend",
e=>{

for(
const t
of e.changedTouches
){

if(
t.identifier===
joyID
){

resetJoy();

}

}

}
);


joystick.addEventListener(
"touchcancel",
resetJoy
);

/* ==========================
GAME LOOP
========================== */

let last=
performance.now();


function loop(
now
){

const dt=
Math.min(
.05,
(
now-last
)/
1000
);


last=
now;


if(
gameStarted &&
player.hp>0
){

updatePlayer(
dt
);

updateEnemies(
dt
);

/* ДРУГОЙ ИГРОК */

updateRemotePlayers();

/* КАРТА */

updateMinimap();

/* HUD */

updateHUD();

/* ОТПРАВКА КООРДИНАТ */

sendPlayerState(
now
);

}else if(
gameStarted &&
player.hp<=0
){

gameOver();

}


requestAnimationFrame(
loop
);

}
