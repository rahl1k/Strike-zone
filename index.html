<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RAHL1K TEST</title>
<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
}
#game{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
}
#title{
    position:fixed;
    z-index:999;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font:bold 24px Arial;
}
</style>
</head>
<body>
<div id="title">
RAHL1K CANVAS TEST 4
</div>
<script>
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
/* СИНЕЕ НЕБО */
ctx.fillStyle = "blue";
ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);
/* ЗЕЛЁНАЯ ЗЕМЛЯ */
ctx.fillStyle = "green";
ctx.fillRect(
    0,
    canvas.height / 2,
    canvas.width,
    canvas.height / 2
);
/* БОЛЬШОЙ КРАСНЫЙ КВАДРАТ */
ctx.fillStyle = "red";
ctx.fillRect(
    canvas.width / 2 - 100,
    canvas.height / 2 - 100,
    200,
    200
);
/* БЕЛЫЙ ТЕКСТ */
ctx.fillStyle = "white";
ctx.font = "40px Arial";
ctx.textAlign = "center";
ctx.fillText(
    "CANVAS WORKS!",
    canvas.width / 2,
    100
);
</script>
</body>
</html>
