<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAHL1K FPS</title>
<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
    touch-action:none;
    font-family:Arial,sans-serif;
}
#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            #6d9bad 0%,
            #9bbbc5 48%,
            #41484b 48%,
            #41484b 100%
        );
}
/* Небо */
#sky{
    position:absolute;
    inset:0 0 52% 0;
    background:linear-gradient(#477b96,#a8c7d0);
}
/* Земля */
#ground{
    position:absolute;
    left:0;
    right:0;
    top:48%;
    bottom:0;
    background:
        repeating-linear-gradient(
            0deg,
            #41484b 0px,
            #41484b 45px,
            #484f52 46px,
            #484f52 47px
        );
}
/* Центральная дорога */
#road{
    position:absolute;
    top:48%;
    left:35%;
    width:30%;
    height:52%;
    background:#555b5e;
    border-left:3px solid #686e71;
    border-right:3px solid #686e71;
}
/* Разметка */
#line1,#line2,#line3,#line4{
    position:absolute;
    left:calc(50% - 4px);
    width:8px;
    height:45px;
    background:#ddd;
}
#line1{top:57%}
#line2{top:68%}
#line3{top:79%}
#line4{top:90%}
/* HUD */
#title{
    position:fixed;
    z-index:50;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:23px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}
#info{
    position:fixed;
    z-index:50;
    top:45px;
    left:15px;
    color:white;
    font-size:14px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#hp{
    position:fixed;
    z-index:50;
    left:20px;
    bottom:20px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#ammo{
    position:fixed;
    z-index:50;
    right:20px;
    bottom:20px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
/* Прицел */
#crosshair{
    position:fixed;
    z-index:50;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    transform:translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    left:0;
    top:14px;
    width:30px;
    height:2px;
    background:white;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:14px;
    top:0;
    width:2px;
    height:30px;
    background:white;
}
/* Джойстик */
#joystick{
    position:fixed;
    z-index:100;
    left:25px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    border:3px solid #ffffff66;
    background:#ffffff18;
}
#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ffffff70;
    border:2px solid white;
    pointer-events:none;
}
/* Кнопки */
#fire{
    position:fixed;
    z-index:100;
    right:30px;
    bottom:95px;
    width:85px;
    height:85px;
    border-radius:50%;
    border:2px solid white;
    background:#a52c2ccc;
    color:white;
    font-weight:bold;
    font-size:14px;
}
#reload{
    position:fixed;
    z-index:100;
    right:135px;
    bottom:35px;
    width:100px;
    height:45px;
    border-radius:12px;
    border:1px solid white;
    background:#222c;
    color:white;
    font-weight:bold;
}
/* Оружие */
#weapon{
    position:fixed;
    z-index:40;
    left:50%;
    bottom:-10px;
    transform:translateX(-50%);
    width:150px;
    height:110px;
}
#gunBody{
    position:absolute;
    left:25px;
    bottom:0;
    width:100px;
    height:70px;
    background:#17191a;
    border-radius:12px 12px 4px 4px;
}
#gunBarrel{
    position:absolute;
    left:65px;
    bottom:65px;
    width:20px;
    height:65px;
    background:#333;
}
/* Враги */
.enemy{
    position:absolute;
    width:55px;
    height:100px;
    transform:translate(-50%,-50%);
}
.enemyBody{
    position:absolute;
    left:10px;
    bottom:0;
    width:35px;
    height:65px;
    background:#b52f37;
    border-radius:8px 8px 2px 2px;
}
.enemyHead{
    position:absolute;
    left:14px;
    top:0;
    width:27px;
    height:27px;
    border-radius:50%;
    background:#d6a07c;
}
.enemyHP{
    position:absolute;
    left:0;
    top:-10px;
    width:55px;
    height:5px;
    background:#111;
}
.enemyHPInner{
    height:100%;
    width:100%;
    background:#35d06b;
}
/* Сообщение для вертикального телефона */
#rotate{
    display:none;
    position:fixed;
    z-index:999;
    inset:0;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:24px;
}
@media(max-width:700px) and (orientation:portrait){
    #rotate{
        display:flex;
    }
}
</style>
</head>
<body>
<div id="game">
<div id="sky"></div>
<div id="ground"></div>
<div id="road"></div>
<div id="line1"></div>
<div id="line2"></div>
<div id="line3"></div>
<div id="line4"></div>
<!-- стены -->
<div class="wall" id="wall1"></div>
<div class="wall" id="wall2"></div>
<div class="wall" id="wall3"></div>
<div class="wall" id="wall4"></div>
</div>
<div id="title">
RAHL1K FPS
</div>
<div id="info">
POS: 1500 / 1100 &nbsp; ANGLE: 0°
</div>
<div id="hp">
HP 100
</div>
<div id="ammo">
30 / 90
</div>
<div id="crosshair"></div>
<div id="joystick">
    <div id="stick"></div>
</div>
<button id="fire">
FIRE
</button>
<button id="reload">
RELOAD
</button>
<div id="weapon">
    <div id="gunBarrel"></div>
    <div id="gunBody"></div>
</div>
<div id="rotate">
    ↔️
    <br><br>
    Поверни телефон горизонтально
</div>
<script>
/* ===================================
   ИГРОК
=================================== */
const player={
    x:1500,
    y:1100,
    angle:0,
    hp:100
};
/* ===================================
   ДЖОЙСТИК
=================================== */
const joystick=
document.getElementById("joystick");
const stick=
document.getElementById("stick");
let joyX=0;
let joyY=0;
let joyID=null;
function moveStick(x,y){
    const r=
        joystick.getBoundingClientRect();
    const cx=
        r.left+r.width/2;
    const cy=
        r.top+r.height/2;
    let dx=
        x-cx;
    let dy=
        y-cy;
    const max=40;
    const distance=
        Math.hypot(dx,dy);
    if(distance>max){
        dx=
            dx/distance*max;
        dy=
            dy/distance*max;
    }
    joyX=
        dx/max;
    joyY=
        dy/max;
    stick.style.left=
        (40+dx)+"px";
    stick.style.top=
        (40+dy)+"px";
}
function resetStick(){
    joyX=0;
    joyY=0;
    joyID=null;
    stick.style.left="40px";
    stick.style.top="40px";
}
joystick.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        if(joyID!==null)return;
        const t=
            e.changedTouches[0];
        joyID=
            t.identifier;
        moveStick(
            t.clientX,
            t.clientY
        );
    },
    {passive:false}
);
joystick.addEventListener(
    "touchmove",
    e=>{
        e.preventDefault();
        for(
            const t of e.changedTouches
        ){
            if(
                t.identifier===joyID
            ){
                moveStick(
                    t.clientX,
                    t.clientY
                );
            }
        }
    },
    {passive:false}
);
joystick.addEventListener(
    "touchend",
    e=>{
        for(
            const t of e.changedTouches
        ){
            if(
                t.identifier===joyID
            ){
                resetStick();
            }
        }
    },
    {passive:false}
);
/* ===================================
   СВАЙП КАМЕРЫ
=================================== */
let lookID=null;
let lastX=0;
document.addEventListener(
    "touchstart",
    e=>{
        for(
            const t of e.changedTouches
        ){
            /*
               Правая часть экрана —
               камера.
            */
            if(
                t.clientX>
                window.innerWidth*0.42 &&
                !t.target.closest(
                    "#fire,#reload"
                )
            ){
                lookID=
                    t.identifier;
                lastX=
                    t.clientX;
            }
        }
    },
    {passive:false}
);
document.addEventListener(
    "touchmove",
    e=>{
        if(lookID===null)return;
        for(
            const t of e.changedTouches
        ){
            if(
                t.identifier===
                lookID
            ){
                e.preventDefault();
                const dx=
                    t.clientX-lastX;
                /*
                   Поворот камеры.
                   Ограничения нет.
                   Можно крутиться:
                   360°
                   720°
                   1080°
                   и дальше.
                */
                player.angle+=
                    dx*0.008;
                lastX=
                    t.clientX;
            }
        }
    },
    {passive:false}
);
document.addEventListener(
    "touchend",
    e=>{
        for(
            const t of e.changedTouches
        ){
            if(
                t.identifier===
                lookID
            ){
                lookID=null;
            }
        }
    }
);
/* ===================================
   ГРАНИЦЫ КАРТЫ
=================================== */
const MAP_W=3000;
const MAP_H=2200;
const walls=[
    {
        x:300,
        y:300,
        w:600,
        h:150
    },
    {
        x:300,
        y:300,
        w:150,
        h:600
    },
    {
        x:1200,
        y:250,
        w:650,
        h:150
    },
    {
        x:1700,
        y:250,
        w:150,
        h:600
    },
    {
        x:500,
        y:1300,
        w:700,
        h:150
    },
    {
        x:500,
        y:1300,
        w:150,
        h:600
    },
    {
        x:1800,
        y:1300,
        w:650,
        h:150
    },
    {
        x:2300,
        y:1300,
        w:150,
        h:600
    }
];
function blocked(x,y){
    const r=25;
    if(
        x<r ||
        y<r ||
        x>MAP_W-r ||
        y>MAP_H-r
    ){
        return true;
    }
    for(
        const w of walls
    ){
        if(
            x+r>w.x &&
            x-r<
            w.x+w.w &&
            y+r>w.y &&
            y-r<
            w.y+w.h
        ){
            return true;
        }
    }
    return false;
}
/* ===================================
   ДВИЖЕНИЕ
=================================== */
function updatePlayer(dt){
    const speed=260;
    /*
       Вперёд/назад
    */
    const forward=
        -joyY;
    /*
       Влево/вправо
    */
    const strafe=
        joyX;
    /*
       Движение относительно
       камеры.
    */
    const dx=
        (
            Math.cos(
                player.angle
            )*
            forward
            -
            Math.sin(
                player.angle
            )*
            strafe
        )*
        speed*
        dt;
    const dy=
        (
            Math.sin(
                player.angle
            )*
            forward
            +
            Math.cos(
                player.angle
            )*
            strafe
        )*
        speed*
        dt;
    const nx=
        player.x+dx;
    const ny=
        player.y+dy;
    if(
        !blocked(
            nx,
            player.y
        )
    ){
        player.x=nx;
    }
    if(
        !blocked(
            player.x,
            ny
        )
    ){
        player.y=ny;
    }
}
/* ===================================
   ВРАГИ
=================================== */
let enemies=[
    {
        x:2400,
        y:500,
        hp:100,
        element:null
    },
    {
        x:2200,
        y:900,
        hp:100,
        element:null
    },
    {
        x:800,
        y:1800,
        hp:100,
        element:null
    }
];
function createEnemies(){
    for(
        const enemy of enemies
    ){
        const el=
            document.createElement(
                "div"
            );
        el.className="enemy";
        el.innerHTML=`
            <div class="enemyHP">
                <div class="enemyHPInner"></div>
            </div>
            <div class="enemyHead"></div>
            <div class="enemyBody"></div>
        `;
        document
        .getElementById("game")
        .appendChild(el);
        enemy.element=el;
    }
}
createEnemies();
/* ===================================
   ОТОБРАЖЕНИЕ ВРАГОВ
=================================== */
function updateEnemies(){
    for(
        const enemy of enemies
    ){
        if(
            enemy.hp<=0
        ){
            enemy.element.style.display=
                "none";
            continue;
        }
        const dx=
            enemy.x-player.x;
        const dy=
            enemy.y-player.y;
        /*
           Угол до врага
        */
        let relativeAngle=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;
        /*
           Нормализуем угол
        */
        relativeAngle=
            Math.atan2(
                Math.sin(
                    relativeAngle
                ),
                Math.cos(
                    relativeAngle
                )
            );
        const distance=
            Math.hypot(
                dx,
                dy
            );
        /*
           Враг за спиной —
           скрываем.
        */
        if(
            Math.abs(
                relativeAngle
            )>Math.PI/2
        ){
            enemy.element.style.display=
                "none";
            continue;
        }
        const screenX=
            window.innerWidth/2+
            Math.tan(
                relativeAngle
            )*
            window.innerWidth*
            0.55;
        const size=
            Math.max(
                25,
                Math.min(
                    180,
                    65000/distance
                )
            );
        const screenY=
            window.innerHeight*0.53;
        enemy.element.style.display=
            "block";
        enemy.element.style.left=
            screenX+"px";
        enemy.element.style.top=
            screenY+"px";
        enemy.element.style.width=
            size+"px";
        enemy.element.style.height=
            (size*1.8)+"px";
        const hp=
            enemy.element
            .querySelector(
                ".enemyHPInner"
            );
        hp.style.width=
            Math.max(
                0,
                enemy.hp
            )+"%";
    }
}
/* ===================================
   СТРЕЛЬБА
=================================== */
let ammo=30;
let reserve=90;
document
.getElementById("fire")
.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        shoot();
    },
    {passive:false}
);
function shoot(){
    if(
        ammo<=0
    ){
        reload();
        return;
    }
    ammo--;
    let target=null;
    let closest=Infinity;
    for(
        const enemy of enemies
    ){
        if(
            enemy.hp<=0
        )
            continue;
        const dx=
            enemy.x-player.x;
        const dy=
            enemy.y-player.y;
        const distance=
            Math.hypot(
                dx,
                dy
            );
        let a=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;
        a=
            Math.atan2(
                Math.sin(a),
                Math.cos(a)
            );
        /*
           Прицел примерно
           по центру экрана.
        */
        if(
            Math.abs(a)<0.12 &&
            distance<1200 &&
            distance<closest
        ){
            target=enemy;
            closest=distance;
        }
    }
    if(target){
        target.hp-=50;
    }
}
/* ===================================
   ПЕРЕЗАРЯДКА
=================================== */
function reload(){
    if(
        ammo>=30 ||
        reserve<=0
    )
        return;
    const amount=
        Math.min(
            30-ammo,
            reserve
        );
    ammo+=amount;
    reserve-=amount;
}
document
.getElementById("reload")
.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        reload();
    },
    {passive:false}
);
/* ===================================
   HUD
=================================== */
function updateHUD(){
    let degrees=
        player.angle*
        180/
        Math.PI;
    degrees=
        (
            degrees%360+
            360
        )%360;
    document
    .getElementById("info")
    .innerHTML=
        "POS: "+
        Math.round(
            player.x
        )+
        " / "+
        Math.round(
            player.y
        )+
        "&nbsp;&nbsp; ANGLE: "+
        Math.round(
            degrees
        )+
        "°";
    document
    .getElementById("hp")
    .textContent=
        "HP "+
        Math.max(
            0,
            Math.round(
                player.hp
            )
        );
    document
    .getElementById("ammo")
    .textContent=
        ammo+
        " / "+
        reserve;
}
/* ===================================
   АНИМАЦИЯ ОРУЖИЯ
=================================== */
let recoil=0;
function updateWeapon(){
    const weapon=
        document.getElementById(
            "weapon"
        );
    weapon.style.transform=
        "translateX(-50%) translateY("+
        recoil+
        "px)";
    recoil*=0.8;
}
/* ===================================
   GAME LOOP
=================================== */
let last=
    performance.now();
function loop(now){
    const dt=
        Math.min(
            0.05,
            (now-last)/1000
        );
    last=now;
    updatePlayer(dt);
    updateEnemies();
    updateHUD();
    updateWeapon();
    requestAnimationFrame(
        loop
    );
}
requestAnimationFrame(
    loop
);
</script>
</body>
</html>
