<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>rahl1k • STRIKE ZONE FPS 1.1</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#202629;
    touch-action:none;
    font-family:Arial,sans-serif;
}
#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}
#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 5px #000;
}
#title{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;
    font-weight:bold;
    white-space:nowrap;
}
#status{
    position:absolute;
    top:43px;
    left:50%;
    transform:translateX(-50%);
    font-size:13px;
    color:#55ff77;
    white-space:nowrap;
}
#hp{
    position:absolute;
    left:20px;
    bottom:20px;
    font-size:22px;
    font-weight:bold;
}
#ammo{
    position:absolute;
    right:20px;
    bottom:20px;
    font-size:22px;
    font-weight:bold;
}
#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:28px;
    transform:translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    left:0;
    top:13px;
    width:28px;
    height:2px;
    background:white;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:13px;
    top:0;
    width:2px;
    height:28px;
    background:white;
}
#joystick{
    position:fixed;
    left:30px;
    bottom:30px;
    width:150px;
    height:150px;
    border-radius:50%;
    background:#ffffff22;
    border:4px solid #ffffff88;
    z-index:100;
    touch-action:none;
}
#stick{
    position:absolute;
    left:42px;
    top:42px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#ffffff88;
    border:3px solid white;
    pointer-events:none;
}
#fire{
    position:fixed;
    right:25px;
    bottom:90px;
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid white;
    background:#a52129;
    color:white;
    font-weight:bold;
    font-size:16px;
    z-index:100;
    touch-action:none;
}
#reload{
    position:fixed;
    right:130px;
    bottom:30px;
    width:105px;
    height:45px;
    border-radius:12px;
    border:2px solid white;
    background:#222;
    color:white;
    font-weight:bold;
    z-index:100;
    touch-action:none;
}
#message{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:200;
    color:white;
    font-size:38px;
    font-weight:bold;
    text-align:center;
    text-shadow:0 3px 8px #000;
}
#restart{
    display:none;
    position:fixed;
    left:50%;
    top:65%;
    transform:translate(-50%,-50%);
    width:180px;
    height:55px;
    border-radius:14px;
    border:2px solid white;
    background:#222;
    color:white;
    font-weight:bold;
    z-index:200;
}
#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:22px;
}
</style>
</head>
<body>
<div id="rotate">
    ↔️<br><br>
    Поверни iPhone<br>
    горизонтально
</div>
<div id="hud">
<div id="title">
    rahl1k • STRIKE ZONE FPS 1.1
</div>
<div id="status">
    FPS READY
</div>
<div id="crosshair"></div>
<div id="hp">
    HP 100
</div>
<div id="ammo">
    30 / 90
</div>
</div>
<div id="joystick">
    <div id="stick"></div>
</div>

FIRE

RELOAD

<div id="message"></div>
<button id="restart">
    PLAY AGAIN
</button>
<script>
/* =================================
   CANVAS
================================= */
const canvas =
    document.getElementById("game");
const ctx =
    canvas.getContext("2d");
let W=0;
let H=0;
let DPR=1;
function resize(){
    W=window.innerWidth;
    H=window.innerHeight;
    DPR=Math.min(
        window.devicePixelRatio || 1,
        2
    );
    canvas.width=W*DPR;
    canvas.height=H*DPR;
    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
    document.getElementById(
        "rotate"
    ).style.display =
        H>W ? "flex" : "none";
}
window.addEventListener(
    "resize",
    resize
);
resize();
/* =================================
   МИР
================================= */
const mapWidth=3000;
const mapHeight=2200;
/*
   Стены в мире.
*/
const walls=[
    {x:250,y:250,w:600,h:120},
    {x:250,y:250,w:120,h:650},
    {x:1950,y:250,w:600,h:120},
    {x:2430,y:250,w:120,h:650},
    {x:250,y:1450,w:650,h:120},
    {x:250,y:1450,w:120,h:550},
    {x:1900,y:1450,w:650,h:120},
    {x:2430,y:1450,w:120,h:550},
    {x:1100,y:650,w:800,h:130},
    {x:1100,y:1420,w:800,h:130},
    {x:1300,y:950,w:400,h:130},
    {x:700,y:500,w:180,h:80},
    {x:2100,y:500,w:180,h:80},
    {x:700,y:1150,w:180,h:80},
    {x:2100,y:1150,w:180,h:80}
];
/* =================================
   ИГРОК
================================= */
const player={
    x:500,
    y:500,
    angle:0,
    hp:100
};
/* =================================
   ОРУЖИЕ
================================= */
let ammo=30;
let reserve=90;
let reloading=false;
let flash=0;
/* =================================
   БОТЫ
================================= */
let bots=[];
function spawnBots(){
    bots=[
        {
            x:2400,
            y:500,
            hp:100,
            dead:false,
            cooldown:0
        },
        {
            x:2300,
            y:1050,
            hp:100,
            dead:false,
            cooldown:0
        },
        {
            x:2450,
            y:1900,
            hp:100,
            dead:false,
            cooldown:0
        },
        {
            x:700,
            y:1900,
            hp:100,
            dead:false,
            cooldown:0
        },
        {
            x:1500,
            y:1850,
            hp:100,
            dead:false,
            cooldown:0
        }
    ];
}
spawnBots();
/* =================================
   СТОЛКНОВЕНИЯ
================================= */
function collides(x,y){
    const r=25;
    for(
        const wall of walls
    ){
        if(
            x+r>wall.x &&
            x-r<wall.x+wall.w &&
            y+r>wall.y &&
            y-r<wall.y+wall.h
        ){
            return true;
        }
    }
    return false;
}
/* =================================
   ДЖОЙСТИК
================================= */
const joystick =
    document.getElementById(
        "joystick"
    );
const stick =
    document.getElementById(
        "stick"
    );
const status =
    document.getElementById(
        "status"
    );
let joyX=0;
let joyY=0;
let joystickActive=false;
let joystickPointer=null;
function moveJoystick(
    clientX,
    clientY
){
    const r =
        joystick.getBoundingClientRect();
    const cx =
        r.left+r.width/2;
    const cy =
        r.top+r.height/2;
    let dx =
        clientX-cx;
    let dy =
        clientY-cy;
    const max=45;
    const d =
        Math.hypot(dx,dy);
    if(d>max){
        dx=dx/d*max;
        dy=dy/d*max;
    }
    joyX=dx/max;
    joyY=dy/max;
    stick.style.left =
        (42+dx)+"px";
    stick.style.top =
        (42+dy)+"px";
    status.textContent =
        "MOVE • "+
        Math.round(player.x)+
        ","+
        Math.round(player.y);
}
joystick.addEventListener(
    "pointerdown",
    function(e){
        e.preventDefault();
        joystickActive=true;
        joystickPointer=
            e.pointerId;
        joystick.setPointerCapture(
            e.pointerId
        );
        moveJoystick(
            e.clientX,
            e.clientY
        );
    },
    {passive:false}
);
joystick.addEventListener(
    "pointermove",
    function(e){
        if(
            !joystickActive ||
            e.pointerId!==joystickPointer
        )
            return;
        e.preventDefault();
        moveJoystick(
            e.clientX,
            e.clientY
        );
    },
    {passive:false}
);
function releaseJoystick(){
    joystickActive=false;
    joystickPointer=null;
    joyX=0;
    joyY=0;
    stick.style.left="42px";
    stick.style.top="42px";
}
joystick.addEventListener(
    "pointerup",
    releaseJoystick
);
joystick.addEventListener(
    "pointercancel",
    releaseJoystick
);
/* =================================
   СВАЙП
================================= */
let lookActive=false;
let lookPointer=null;
let lastLookX=0;
document.addEventListener(
    "pointerdown",
    function(e){
        if(
            e.target===joystick ||
            joystick.contains(e.target) ||
            e.target===document.getElementById("fire") ||
            e.target===document.getElementById("reload") ||
            e.target===document.getElementById("restart")
        )
            return;
        if(
            e.clientX>
            W*0.45
        ){
            lookActive=true;
            lookPointer=
                e.pointerId;
            lastLookX=
                e.clientX;
        }
    }
);
document.addEventListener(
    "pointermove",
    function(e){
        if(
            !lookActive ||
            e.pointerId!==lookPointer
        )
            return;
        const dx =
            e.clientX-lastLookX;
        player.angle +=
            dx*0.008;
        lastLookX=
            e.clientX;
    }
);
document.addEventListener(
    "pointerup",
    function(e){
        if(
            e.pointerId===
            lookPointer
        ){
            lookActive=false;
            lookPointer=null;
        }
    }
);
/* =================================
   ДВИЖЕНИЕ
================================= */
function movePlayer(dt){
    if(gameEnded)
        return;
    const speed=230;
    /*
       вверх джойстика = вперёд
    */
    const forward=-joyY;
    const side=joyX;
    const dx =
        (
            Math.cos(player.angle)*
            forward
            -
            Math.sin(player.angle)*
            side
        )*
        speed*dt;
    const dy =
        (
            Math.sin(player.angle)*
            forward
            +
            Math.cos(player.angle)*
            side
        )*
        speed*dt;
    const nx=
        player.x+dx;
    const ny=
        player.y+dy;
    if(
        nx>30 &&
        nx<mapWidth-30 &&
        !collides(nx,player.y)
    ){
        player.x=nx;
    }
    if(
        ny>30 &&
        ny<mapHeight-30 &&
        !collides(player.x,ny)
    ){
        player.y=ny;
    }
}
/* =================================
   ЛУЧ СТЕНЫ
================================= */
function raycast(angle){
    const maxDistance=1000;
    const step=8;
    for(
        let d=1;
        d<maxDistance;
        d+=step
    ){
        const x=
            player.x+
            Math.cos(angle)*d;
        const y=
            player.y+
            Math.sin(angle)*d;
        if(
            x<0 ||
            y<0 ||
            x>mapWidth ||
            y>mapHeight
        )
            return d;
        for(
            const wall of walls
        ){
            if(
                x>=wall.x &&
                x<=wall.x+wall.w &&
                y>=wall.y &&
                y<=wall.y+wall.h
            ){
                return d;
            }
        }
    }
    return maxDistance;
}
/* =================================
   БОТЫ
================================= */
function updateBots(dt){
    if(gameEnded)
        return;
    for(
        const bot of bots
    ){
        if(bot.dead)
            continue;
        const dx=
            player.x-bot.x;
        const dy=
            player.y-bot.y;
        const distance=
            Math.hypot(dx,dy);
        if(distance>100){
            const speed=35;
            const nx=
                bot.x+
                dx/distance*
                speed*dt;
            const ny=
                bot.y+
                dy/distance*
                speed*dt;
            if(
                !collides(nx,bot.y)
            )
                bot.x=nx;
            if(
                !collides(bot.x,ny)
            )
                bot.y=ny;
        }else{
            bot.cooldown-=dt;
            if(
                bot.cooldown<=0
            ){
                player.hp-=7;
                bot.cooldown=1;
            }
        }
    }
}
/* =================================
   ВИД ОТ ПЕРВОГО ЛИЦА
================================= */
function drawWorld(){
    /*
       Небо
    */
    ctx.fillStyle="#718791";
    ctx.fillRect(
        0,
        0,
        W,
        H/2
    );
    /*
       Земля
    */
    ctx.fillStyle="#30383c";
    ctx.fillRect(
        0,
        H/2,
        W,
        H/2
    );
    /*
       Полосы земли
    */
    ctx.strokeStyle="#465054";
    ctx.lineWidth=2;
    for(
        let i=1;
        i<12;
        i++
    ){
        const y=
            H/2+
            (H/2)*
            (i/12);
        ctx.beginPath();
        ctx.moveTo(
            0,
            y
        );
        ctx.lineTo(
            W,
            y
        );
        ctx.stroke();
    }
    /*
       RAYCAST
    */
    const rays=
        Math.min(
            220,
            Math.floor(W/3)
        );
    const fov=
        Math.PI/3;
    const projection=
        (W/2)/
        Math.tan(fov/2);
    for(
        let i=0;
        i<rays;
        i++
    ){
        const screenX=
            i*
            W/rays;
        const rayAngle=
            player.angle-
            fov/2+
            (i/rays)*fov;
        let distance=
            raycast(rayAngle);
        /*
           убираем fish-eye
        */
        distance *=
            Math.cos(
                rayAngle-
                player.angle
            );
        distance=
            Math.max(
                1,
                distance
            );
        const wallHeight=
            projection/
            distance*
            100;
        const top=
            H/2-
            wallHeight/2;
        const shade=
            Math.max(
                25,
                180-distance/7
            );
        ctx.fillStyle=
            `rgb(${shade*.65},${shade*.72},${shade*.75})`;
        ctx.fillRect(
            screenX,
            top,
            W/rays+1,
            wallHeight
        );
    }
    drawEnemies();
    drawWeapon();
}
/* =================================
   ВРАГИ FPS
================================= */
function drawEnemies(){
    const fov=
        Math.PI/3;
    const visible=[];
    for(
        const bot of bots
    ){
        if(bot.dead)
            continue;
        const dx=
            bot.x-player.x;
        const dy=
            bot.y-player.y;
        const distance=
            Math.hypot(dx,dy);
        let relative=
            Math.atan2(dy,dx)-
            player.angle;
        relative=
            Math.atan2(
                Math.sin(relative),
                Math.cos(relative)
            );
        if(
            Math.abs(relative)>
            fov/2
        )
            continue;
        const corrected=
            distance*
            Math.cos(relative);
        if(corrected<=5)
            continue;
        /*
           Проверяем,
           есть ли стена между нами
        */
        const wallDistance=
            raycast(
                player.angle+
                relative
            );
        if(
            wallDistance<
            distance-30
        )
            continue;
        const screenX=
            W/2+
            Math.tan(relative)*
            (W/2)/
            Math.tan(fov/2);
        const size=
            Math.min(
                H*0.8,
                9000/
                corrected
            );
        visible.push({
            bot,
            x:screenX,
            size,
            distance:corrected
        });
    }
    visible.sort(
        (a,b)=>
            b.distance-a.distance
    );
    for(
        const item of visible
    ){
        const bot=
            item.bot;
        const x=
            item.x;
        const size=
            item.size;
        const bottom=
            H/2+
            size*.5;
        /*
           тело
        */
        ctx.fillStyle="#b92d36";
        ctx.fillRect(
            x-size*.25,
            bottom-size,
            size*.5,
            size
        );
        /*
           голова
        */
        ctx.fillStyle="#dca582";
        ctx.beginPath();
        ctx.arc(
            x,
            bottom-size*1.18,
            size*.18,
            0,
            Math.PI*2
        );
        ctx.fill();
        /*
           HP
        */
        const barW=
            size*.65;
        ctx.fillStyle="#111";
        ctx.fillRect(
            x-barW/2,
            bottom-size*1.45,
            barW,
            7
        );
        ctx.fillStyle="#35d16b";
        ctx.fillRect(
            x-barW/2,
            bottom-size*1.45,
            barW*
            (bot.hp/100),
            7
        );
    }
}
/* =================================
   ОРУЖИЕ
================================= */
function drawWeapon(){
    /*
       корпус
    */
    ctx.fillStyle="#111";
    ctx.fillRect(
        W/2-75,
        H-120,
        150,
        120
    );
    /*
       ствол
    */
    ctx.fillStyle="#555";
    ctx.fillRect(
        W/2-16,
        H-185,
        32,
        85
    );
    /*
       рукоятка
    */
    ctx.fillStyle="#171717";
    ctx.fillRect(
        W/2-45,
        H-50,
        90,
        60
    );
    /*
       вспышка
    */
    if(flash>0){
        ctx.fillStyle=
            "rgba(255,210,50,.9)";
        ctx.beginPath();
        ctx.arc(
            W/2,
            H-190,
            30,
            0,
            Math.PI*2
        );
        ctx.fill();
        flash-=0.016;
    }
}
/* =================================
   СТРЕЛЬБА
================================= */
function shoot(){
    if(
        gameEnded ||
        reloading
    )
        return;
    if(ammo<=0){
        reload();
        return;
    }
    ammo--;
    flash=.08;
    const fov=
        Math.PI/3;
    let target=null;
    let best=Infinity;
    for(
        const bot of bots
    ){
        if(bot.dead)
            continue;
        const dx=
            bot.x-player.x;
        const dy=
            bot.y-player.y;
        const distance=
            Math.hypot(dx,dy);
        let relative=
            Math.atan2(dy,dx)-
            player.angle;
        relative=
            Math.atan2(
                Math.sin(relative),
                Math.cos(relative)
            );
        if(
            Math.abs(relative)>.12
        )
            continue;
        const wallDistance=
            raycast(
                player.angle+
                relative
            );
        if(
            wallDistance<
            distance-30
        )
            continue;
        if(
            distance<best
        ){
            best=distance;
            target=bot;
        }
    }
    if(target){
        target.hp-=50;
        if(
            target.hp<=0
        ){
            target.hp=0;
            target.dead=true;
        }
    }
}
/* =================================
   ПЕРЕЗАРЯДКА
================================= */
function reload(){
    if(
        reloading ||
        ammo>=30 ||
        reserve<=0
    )
        return;
    reloading=true;
    setTimeout(
        function(){
            const need=
                30-ammo;
            const amount=
                Math.min(
                    need,
                    reserve
                );
            ammo+=amount;
            reserve-=amount;
            reloading=false;
        },
        900
    );
}
document
.getElementById("fire")
.addEventListener(
    "pointerdown",
    function(e){
        e.preventDefault();
        shoot();
    },
    {passive:false}
);
document
.getElementById("reload")
.addEventListener(
    "pointerdown",
    function(e){
        e.preventDefault();
        reload();
    },
    {passive:false}
);
/* =================================
   HUD
================================= */
function updateHUD(){
    document.getElementById(
        "hp"
    ).textContent=
        "HP "+
        Math.max(
            0,
            Math.floor(player.hp)
        );
    document.getElementById(
        "ammo"
    ).textContent=
        reloading
        ? "RELOADING..."
        :
        ammo+
        " / "+
        reserve;
    const alive=
        bots.filter(
            b=>!b.dead
        ).length;
    if(
        !gameEnded &&
        !joystickActive &&
        !lookActive
    ){
        status.textContent=
            alive+
            " ENEMIES • FPS";
    }
}
/* =================================
   GAME STATE
================================= */
let gameEnded=false;
function checkGame(){
    if(
        player.hp<=0 &&
        !gameEnded
    ){
        player.hp=0;
        gameEnded=true;
        message.textContent=
            "YOU DIED";
        message.style.display=
            "block";
        restart.style.display=
            "block";
        return;
    }
    const alive=
        bots.filter(
            b=>!b.dead
        ).length;
    if(
        alive===0 &&
        !gameEnded
    ){
        gameEnded=true;
        message.textContent=
            "ROUND WON!";
        message.style.display=
            "block";
        restart.style.display=
            "block";
    }
}
const message=
    document.getElementById(
        "message"
    );
const restart=
    document.getElementById(
        "restart"
    );
function resetGame(){
    player.x=500;
    player.y=500;
    player.angle=0;
    player.hp=100;
    ammo=30;
    reserve=90;
    reloading=false;
    gameEnded=false;
    spawnBots();
    message.style.display=
        "none";
    restart.style.display=
        "none";
}
restart.addEventListener(
    "pointerdown",
    function(e){
        e.preventDefault();
        resetGame();
    },
    {passive:false}
);
/* =================================
   GAME LOOP
================================= */
let last=
    performance.now();
function loop(now){
    const dt=
        Math.min(
            .05,
            (now-last)/1000
        );
    last=now;
    movePlayer(dt);
    updateBots(dt);
    checkGame();
    updateHUD();
    drawWorld();
    requestAnimationFrame(
        loop
    );
}
resetGame();
requestAnimationFrame(
    loop
);
</script>
</body>
