<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAHL1K FPS v5</title>

<style>

*{
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#8b5a3c;
touch-action:none;
font-family:Arial,sans-serif;
}

#game{
position:fixed;
inset:0;
overflow:hidden;
background:#65b9ed;
perspective:900px;
}

/* =====================
НЕБО
===================== */

#sky{
display:block;
position:absolute;
left:0;
right:0;
top:0;
height:55%;
z-index:0;
background:#65b9ed;
overflow:hidden;
}

#sky:before,
#sky:after{
content:"";
position:absolute;
background:#fff;
border-radius:50%;
opacity:.85;
}

#sky:before{
width:180px;
height:55px;
left:12%;
top:18%;
box-shadow:
35px -15px 0 5px #fff,
75px 0 0 0 #fff,
300px 40px 0 10px #fff,
340px 25px 0 0 #fff,
650px -10px 0 8px #fff,
700px 10px 0 0 #fff;
}

#sky:after{
width:150px;
height:45px;
right:10%;
top:38%;
box-shadow:
-35px -15px 0 5px #fff,
-75px 0 0 0 #fff,
-300px 30px 0 8px #fff,
-340px 15px 0 0 #fff;
}

/* =====================
ПОЛ
===================== */

#ground{
position:absolute;
left:-100%;
right:-100%;
top:50%;
bottom:-100%;
z-index:1;
background-color:#8b5a3c;

background-image:
linear-gradient(
to right,
#70452f 2px,
transparent 2px
),
linear-gradient(
to bottom,
#70452f 2px,
transparent 2px
);

background-size:80px 40px;

transform-origin:center top;
transform:perspective(500px) rotateX(12deg) scaleY(2);
}

.roadV,
.roadH,
.mark{
display:none;
}

.building{
display:none !important;
}

/* =====================
МЕНЮ
===================== */

#menu{
position:fixed;
z-index:1000;
inset:0;
background:
linear-gradient(
to bottom,
#182635,
#263746 55%,
#111820
);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

#menuTitle{
position:absolute;
top:55px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:42px;
font-weight:900;
letter-spacing:3px;
text-shadow:0 4px 12px #000;
}

#menuSubtitle{
position:absolute;
top:110px;
left:50%;
transform:translateX(-50%);
color:#ffffffaa;
font-size:15px;
letter-spacing:2px;
}

#lobby{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:260px;
height:400px;
}

#character{
position:absolute;
left:50%;
bottom:10px;
width:150px;
height:340px;
transform:translateX(-50%);
}

#characterHead{
position:absolute;
left:50%;
top:5px;
transform:translateX(-50%);
width:82px;
height:82px;
border-radius:50%;
background:#c98f6c;
border:3px solid #222;
z-index:3;
}

#helmet{
position:absolute;
left:50%;
top:-8px;
transform:translateX(-50%);
width:105px;
height:62px;
background:#26352d;
border-radius:55px 55px 20px 20px;
border:4px solid #151b18;
z-index:4;
box-shadow:0 5px 8px #0008;
}

#helmetFront{
position:absolute;
left:50%;
top:39px;
transform:translateX(-50%);
width:96px;
height:13px;
background:#17201b;
border-radius:5px;
z-index:5;
}

#characterNeck{
position:absolute;
left:50%;
top:76px;
transform:translateX(-50%);
width:30px;
height:35px;
background:#b97e60;
z-index:1;
}

#characterBody{
position:absolute;
left:50%;
top:92px;
transform:translateX(-50%);
width:115px;
height:145px;
background:#27352f;
border-radius:18px 18px 10px 10px;
border:4px solid #151b18;
z-index:2;
}

#vest{
position:absolute;
left:50%;
top:101px;
transform:translateX(-50%);
width:105px;
height:105px;
background:#343d38;
border:5px solid #171c19;
border-radius:12px;
z-index:4;
box-shadow:
inset 0 0 0 4px #4b554f,
0 4px 8px #0008;
}

#vestPlate{
position:absolute;
left:50%;
top:12px;
transform:translateX(-50%);
width:70px;
height:65px;
background:#252c29;
border:3px solid #151917;
border-radius:7px;
}

#vestStrap1{
position:absolute;
left:7px;
top:0;
width:15px;
height:95px;
background:#202722;
}

#vestStrap2{
position:absolute;
right:7px;
top:0;
width:15px;
height:95px;
background:#202722;
}

#armLeft,
#armRight{
position:absolute;
top:105px;
width:38px;
height:120px;
background:#27352f;
border:4px solid #151b18;
border-radius:18px;
z-index:1;
}

#armLeft{
left:5px;
transform:rotate(8deg);
}

#armRight{
right:5px;
transform:rotate(-8deg);
}

#legLeft,
#legRight{
position:absolute;
top:225px;
width:45px;
height:105px;
background:#202723;
border:4px solid #151b18;
border-radius:8px 8px 5px 5px;
z-index:1;
}

#legLeft{
left:28px;
}

#legRight{
right:28px;
}

#menuName{
position:absolute;
bottom:-25px;
left:50%;
transform:translateX(-50%);
color:white;
font-weight:bold;
font-size:18px;
text-shadow:0 2px 5px #000;
white-space:nowrap;
}

/* =====================
ПРОФИЛЬ
===================== */

#profileBox{
position:absolute;
left:130px;
top:35px;
width:225px;
padding:12px;
border:1px solid #ffffff33;
border-radius:12px;
background:#111a22cc;
z-index:1030;
color:white;
}

#profileStatus{
font-size:11px;
color:#ffd45b;
margin-bottom:7px;
font-weight:bold;
}

#profileID{
font-size:14px;
font-weight:bold;
margin-bottom:8px;
}

#nicknameRow{
display:flex;
gap:6px;
}

#nicknameInput{
width:145px;
height:35px;
border-radius:7px;
border:1px solid #ffffff55;
background:#202d38;
color:white;
padding:0 9px;
font-size:13px;
user-select:text;
-webkit-user-select:text;
}

#saveNickname{
width:50px;
height:35px;
border:0;
border-radius:7px;
background:#22b94b;
color:white;
font-size:16px;
font-weight:bold;
}

#playButton{
position:absolute;
right:45px;
bottom:45px;
width:190px;
height:70px;
border:3px solid #baffc7;
border-radius:15px;
background:#22b94b;
color:white;
font-size:28px;
font-weight:bold;
box-shadow:
0 5px 0 #13732e,
0 8px 18px #0008;
}

#playButton:active,
#lobbyPlayButton:active{
transform:translateY(4px);
}

/* =====================
ОБРАТНЫЙ ОТСЧЁТ
===================== */

#countdown{
display:none;
position:absolute;
z-index:1100;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:#e52222;
font-size:120px;
font-weight:900;
text-shadow:
0 4px 10px #000,
0 0 20px #ff000066;
}

#countdownText{
display:none;
position:absolute;
z-index:1100;
left:50%;
top:36%;
transform:translateX(-50%);
color:white;
font-size:24px;
font-weight:bold;
text-shadow:0 2px 6px #000;
}

/* =====================
ВКЛАДКИ
===================== */

#menuTabs{
position:absolute;
left:0;
top:0;
bottom:0;
width:105px;
z-index:1050;
background:#111a22dd;
border-right:2px solid #ffffff18;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:12px;
}

.menuTab{
width:78px;
height:78px;
border:2px solid #ffffff22;
border-radius:16px;
background:#202d38;
display:flex;
align-items:center;
justify-content:center;
color:#d7dde1;
font-size:34px;
box-shadow:0 4px 10px #0008;
transition:.15s;
padding:0;
}

.menuTab.active{
background:#30414d;
border-color:#ffffff66;
}

#lobbyTab{
font-size:31px;
}

.friendsIcon{
position:relative;
width:50px;
height:42px;
}

.person{
position:absolute;
width:16px;
height:16px;
border-radius:50%;
background:#c7cdd1;
top:0;
}

.person:after{
content:"";
position:absolute;
left:-5px;
top:15px;
width:26px;
height:18px;
border-radius:14px 14px 5px 5px;
background:#c7cdd1;
}

.person.p1{
left:0;
top:5px;
}

.person.p2{
left:17px;
top:0;
z-index:2;
}

.person.p3{
right:0;
top:5px;
}

/* =====================
ДРУЗЬЯ
===================== */

#friendsPage{
display:none;
position:absolute;
z-index:900;
inset:0;
padding-left:125px;
padding-right:25px;
padding-top:115px;
color:white;
}

#friendsPage.active{
display:block;
}

#friendsTitle{
position:absolute;
top:45px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:34px;
font-weight:900;
}

#friendSearchBox{
max-width:600px;
margin:0 auto;
background:#111a22cc;
border:1px solid #ffffff33;
border-radius:14px;
padding:14px;
}

#friendSearchRow{
display:flex;
gap:8px;
}

#friendIDInput{
flex:1;
height:42px;
border:1px solid #ffffff55;
border-radius:8px;
background:#202d38;
color:white;
font-size:16px;
padding:0 12px;
user-select:text;
-webkit-user-select:text;
}

#findFriendButton{
width:110px;
border:0;
border-radius:8px;
background:#3a78d4;
color:white;
font-weight:bold;
}

#friendResult{
display:none;
margin-top:12px;
padding:10px;
border-radius:9px;
background:#202d38;
}

#addFriendButton{
display:none;
margin-top:8px;
width:100%;
height:38px;
border:0;
border-radius:8px;
background:#22b94b;
color:white;
font-weight:bold;
}

#friendsMessage{
min-height:18px;
margin-top:8px;
font-size:12px;
color:#ffd45b;
}

#friendsListTitle{
margin-top:14px;
font-weight:bold;
font-size:16px;
}

#friendsList{
margin-top:7px;
max-height:150px;
overflow:auto;
}

.friendItem{
display:flex;
align-items:center;
justify-content:space-between;
padding:9px 10px;
margin-bottom:6px;
border-radius:8px;
background:#202d38;
}

.friendOnline{
color:#46dc73;
font-size:12px;
}

/* =====================
НОВАЯ СТРАНИЦА ЛОББИ
===================== */

#lobbyPage{
display:none;
position:absolute;
z-index:920;
inset:0;
padding-left:120px;
color:white;
}

#lobbyPage.active{
display:block;
}

#lobbyPageTitle{
position:absolute;
left:50%;
top:28px;
transform:translateX(-50%);
font-size:34px;
font-weight:900;
text-shadow:0 4px 12px #000;
}

#partyArea{
position:absolute;
left:48%;
top:51%;
transform:translate(-50%,-50%);
display:flex;
align-items:flex-end;
justify-content:center;
gap:35px;
width:430px;
height:285px;
}

.partySlot{
position:relative;
width:170px;
height:280px;
display:flex;
align-items:flex-end;
justify-content:center;
}

.partySlot.empty{
opacity:.35;
}

.partySoldier{
position:relative;
width:120px;
height:245px;
}

.partyHead{
position:absolute;
left:50%;
top:9px;
transform:translateX(-50%);
width:62px;
height:62px;
border-radius:50%;
background:#c98f6c;
border:3px solid #222;
z-index:3;
}

.partyHelmet{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:80px;
height:48px;
background:#26352d;
border-radius:45px 45px 17px 17px;
border:3px solid #151b18;
z-index:4;
box-shadow:0 4px 7px #0008;
}

.partyHelmetFront{
position:absolute;
left:50%;
top:36px;
transform:translateX(-50%);
width:73px;
height:10px;
background:#17201b;
border-radius:5px;
z-index:5;
}

.partyNeck{
position:absolute;
left:50%;
top:67px;
transform:translateX(-50%);
width:23px;
height:28px;
background:#b97e60;
}

.partyBody{
position:absolute;
left:50%;
top:82px;
transform:translateX(-50%);
width:90px;
height:107px;
background:#27352f;
border-radius:15px 15px 8px 8px;
border:3px solid #151b18;
z-index:2;
}

.partyVest{
position:absolute;
left:50%;
top:89px;
transform:translateX(-50%);
width:82px;
height:80px;
background:#343d38;
border:4px solid #171c19;
border-radius:9px;
z-index:4;
box-shadow:inset 0 0 0 3px #4b554f;
}

.partyVest:after{
content:"";
position:absolute;
left:50%;
top:10px;
transform:translateX(-50%);
width:52px;
height:48px;
background:#252c29;
border:2px solid #151917;
border-radius:5px;
}

.partyArm{
position:absolute;
top:91px;
width:29px;
height:94px;
background:#27352f;
border:3px solid #151b18;
border-radius:14px;
z-index:1;
}

.partyArm.left{

transform:rotate(7deg);
}

.partyArm.right{

}

.partyLeg{

top:181px;
width:34px;
height:61px;
background:#202723;
border:3px solid #151b18;
border-radius:7px 7px 4px 4px;
}

.partyLeg.left{
left:24px;
}

.partyLeg.right{
right:24px;
}

.partyPlayerName{
position:absolute;
bottom:-3px;
left:50%;
transform:translateX(-50%);
font-size:14px;
font-weight:bold;
white-space:nowrap;
text-shadow:0 2px 5px #000;
}

#lobbyFriendsPanel{
position:absolute;
right:22px;
top:82px;
width:235px;
max-height:255px;
padding:12px;
background:#111a22dd;
border:1px solid #ffffff2f;
border-radius:13px;
overflow:auto;
}

#lobbyFriendsTitle{
font-size:15px;
font-weight:bold;
margin-bottom:8px;
}

.lobbyFriendItem{
padding:9px;
margin-bottom:7px;
border-radius:8px;
background:#202d38;
border:1px solid transparent;
}

.lobbyFriendItem.selected{

background:#293a48;
}

.lobbyFriendTop{

justify-content:space-between;
align-items:center;
}

.lobbyFriendName{
font-size:13px;
font-weight:bold;
}

.lobbyFriendStatus{
font-size:10px;
color:#46dc73;
}

.inviteLobbyButton{
display:none;
margin-top:8px;
width:100%;
height:34px;
border:0;
border-radius:7px;
background:#3a78d4;
color:white;
font-size:11px;
font-weight:bold;
}

.lobbyFriendItem.selected .inviteLobbyButton{
display:block;
}

#lobbyMessage{
position:absolute;
right:22px;
top:350px;
width:235px;
text-align:center;
font-size:12px;
color:#ffd45b;
}

#lobbyPlayButton{
position:absolute;
left:135px;
bottom:28px;
width:190px;
height:66px;
border:3px solid #baffc7;
border-radius:15px;
background:#22b94b;
color:white;
font-size:25px;
font-weight:bold;
box-shadow:
0 5px 0 #13732e,
0 8px 18px #0008;
}

#lobbyLeaveButton{
position:absolute;
right:25px;
bottom:28px;
width:150px;
height:42px;
border:1px solid #ffffff66;
border-radius:10px;
background:#8d3232;
color:white;
font-weight:bold;
}

/* =====================
ПРИГЛАШЕНИЕ
===================== */

#lobbyInvitePopup{
display:none;
position:absolute;
z-index:1250;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:330px;
padding:20px;
border:2px solid #ffffff44;
border-radius:16px;
background:#101820f2;
box-shadow:0 10px 35px #000;
text-align:center;
color:white;
}

#lobbyInviteTitle{
font-size:20px;
font-weight:900;
margin-bottom:8px;
}

#lobbyInviteText{
font-size:14px;
color:#ffffffbb;
margin-bottom:16px;
}

#inviteButtons{
display:flex;
gap:10px;
}

#acceptLobbyInvite{
flex:1;
height:44px;
border:0;
border-radius:9px;
background:#22b94b;
color:white;
font-weight:bold;
}

#declineLobbyInvite{
flex:1;
height:44px;
border:0;
border-radius:9px;
background:#a53737;
color:white;
font-weight:bold;
}

/* =====================
HUD
===================== */

#title{
position:fixed;
z-index:100;
top:10px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:23px;
font-weight:bold;
text-shadow:0 2px 5px #000;
}

#info{
position:fixed;
z-index:100;
top:44px;
left:15px;
color:white;
font-size:14px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}

#score{
position:fixed;
z-index:100;
top:68px;
left:15px;
color:#ffd84d;
font-size:16px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}

#healthBox{
position:fixed;
z-index:100;
left:20px;
bottom:20px;
width:190px;
height:28px;
background:#111c;
border:2px solid white;
border-radius:6px;
overflow:hidden;
}

#healthBar{
height:100%;
width:100%;
background:#36c968;
transition:width .15s;
}

#healthText{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:bold;
font-size:16px;
text-shadow:0 1px 3px #000;
}

#ammo{
position:fixed;
z-index:100;
right:20px;
bottom:20px;
color:white;
font-size:22px;
font-weight:bold;
text-shadow:0 2px 4px #000;
}

#crosshair{
position:fixed;
z-index:100;
left:50%;
top:50%;
width:32px;
height:32px;
transform:translate(-50%,-50%);
}

#crosshair:before{
content:"";
position:absolute;
left:0;
top:15px;
width:32px;
height:2px;
background:white;
}

#crosshair:after{
content:"";
position:absolute;
left:15px;
top:0;
width:2px;
height:32px;
background:white;
}

#joystick{
position:fixed;
z-index:200;
left:25px;
bottom:65px;
width:140px;
height:140px;
border-radius:50%;
border:3px solid #ffffff66;
background:#ffffff18;
touch-action:none;
}

#stick{
position:absolute;
left:40px;
top:40px;
width:60px;
height:60px;
border-radius:50%;
background:#ffffff70;
border:2px solid white;
pointer-events:none;
}

#fire{
position:fixed;
z-index:200;
right:30px;
bottom:95px;
width:85px;
height:85px;
border-radius:50%;
border:2px solid white;
background:#a52c2ccc;
color:white;
font-weight:bold;
}

#reload{
position:fixed;
z-index:200;
right:135px;
bottom:35px;
width:100px;
height:45px;
border-radius:12px;
border:1px solid white;
background:#222c;
color:white;
font-weight:bold;
}

/* =====================
ОРУЖИЕ
===================== */

#weapon{
position:fixed;
z-index:80;
left:50%;
bottom:-15px;
width:170px;
height:130px;
transform:translateX(-50%);
transition:transform .07s;
}

#gun{
position:absolute;
left:30px;
bottom:0;
width:110px;
height:75px;
background:#151718;
border-radius:15px 15px 5px 5px;
box-shadow:0 0 10px #000;
}

#barrel{
position:absolute;
left:72px;
bottom:65px;
width:25px;
height:70px;
background:#303537;
border-radius:5px;
}

#pistol{
display:none;
position:absolute;
left:54px;
bottom:0;
width:65px;
height:85px;
transform:rotate(-4deg);
}

#pistolSlide{
position:absolute;
left:10px;
top:8px;

height:28px;
background:#17191a;

#pistolBarrel{
position:absolute;
left:25px;
top:0;
width:22px;
height:18px;
background:#303537;

}

#pistolHandle{
position:absolute;

top:32px;

height:52px;

box-shadow:0 3px 7px #000;
}

#knife{
display:none;
position:absolute;
left:45px;
bottom:0;
width:80px;

<script>

/* ==========================
ОНЛАЙН ПРОФИЛЬ
========================== */

let onlineSocket=null;
let myOnlineID=null;
let myNickname="";
let foundFriendID=null;

let cachedFriends=[];

let incomingLobbyFromID=null;

let currentLobbyMembers=[];

let lobbyCountdownTimer=null;

const profileStatus=
document.getElementById("profileStatus");

const profileID=
document.getElementById("profileID");

const nicknameInput=
document.getElementById("nicknameInput");

const saveNickname=
document.getElementById("saveNickname");

const friendIDInput=
document.getElementById("friendIDInput");

const findFriendButton=
document.getElementById("findFriendButton");

const friendResult=
document.getElementById("friendResult");

const addFriendButton=
document.getElementById("addFriendButton");

const friendsMessage=
document.getElementById("friendsMessage");

const friendsList=
document.getElementById("friendsList");

const lobbyFriendsList=
document.getElementById("lobbyFriendsList");

const lobbyMessage=
document.getElementById("lobbyMessage");

const lobbyInvitePopup=
document.getElementById("lobbyInvitePopup");

const lobbyInviteText=
document.getElementById("lobbyInviteText");

const acceptLobbyInvite=
document.getElementById("acceptLobbyInvite");

const declineLobbyInvite=
document.getElementById("declineLobbyInvite");

const lobbyPlayButton=
document.getElementById("lobbyPlayButton");

const lobbyLeaveButton=
document.getElementById("lobbyLeaveButton");


function sendOnline(data){

if(
onlineSocket &&
onlineSocket.readyState===WebSocket.OPEN
){

onlineSocket.send(
JSON.stringify(data)
);

return true;

}

friendsMessage.textContent=
"Нет соединения с сервером";

lobbyMessage.textContent=
"Нет соединения с сервером";

return false;

}


function connectOnline(){

const protocol=
location.protocol==="https:"
?"wss:"
:"ws:";

onlineSocket=
new WebSocket(
protocol+"//"+location.host
);

onlineSocket.addEventListener(
"open",
()=>{

profileStatus.textContent=
"● ONLINE";

profileStatus.style.color=
"#46dc73";

}
);

onlineSocket.addEventListener(
"close",
()=>{

profileStatus.textContent=
"● OFFLINE";

profileStatus.style.color=
"#ff5555";

setTimeout(
connectOnline,
2500
);

}
);

onlineSocket.addEventListener(
"error",
()=>{

profileStatus.textContent=
"ОШИБКА СОЕДИНЕНИЯ";

profileStatus.style.color=
"#ff5555";

}
);

onlineSocket.addEventListener(
"message",
event=>{

let data;

try{

data=
JSON.parse(event.data);

}catch{

return;

}


/* =========================
ID ПОЛУЧЕН
========================= */

if(data.type==="welcome"){

myOnlineID=data.id;
myNickname=data.nickname;

profileID.textContent=
"ID: "+myOnlineID;

const savedNickname=
localStorage.getItem(
"rahl1kNickname"
);

if(savedNickname){

nicknameInput.value=
savedNickname;

sendOnline({
type:"setNickname",
nickname:savedNickname
});

}else{

nicknameInput.value=
myNickname;

document
.getElementById("menuName")
.textContent=
myNickname;

}

}


/* =========================
НИК ИЗМЕНЁН
========================= */

if(data.type==="nicknameChanged"){

myNickname=
data.nickname;

nicknameInput.value=
myNickname;

document
.getElementById("menuName")
.textContent=
myNickname;

localStorage.setItem(
"rahl1kNickname",
myNickname
);

profileStatus.textContent=
"● ONLINE";

profileStatus.style.color=
"#46dc73";

renderLobbyMembers(
currentLobbyMembers
);

}


/* =========================
ПОИСК ДРУГА
========================= */

if(data.type==="findResult"){

if(!data.found){

foundFriendID=null;

friendResult.style.display=
"block";

friendResult.textContent=
"Игрок не найден";

addFriendButton.style.display=
"none";

return;

}

foundFriendID=
data.id;

friendResult.style.display=
"block";

friendResult.innerHTML=
"<b>"+
escapeHTML(data.nickname)+
"</b><br>ID: "+
data.id;

addFriendButton.style.display=
"block";

}


/* =========================
ДРУГ ДОБАВЛЕН
========================= */

if(data.type==="friendResult"){

if(!data.success){

friendsMessage.textContent=
data.message ||
"Не удалось добавить";

return;

}

friendsMessage.textContent=
"Игрок добавлен в друзья";

addFriendButton.style.display=
"none";

sendOnline({
type:"getFriends"
});

}


/* =========================
НАС ДОБАВИЛИ
========================= */

if(data.type==="friendAdded"){

friendsMessage.textContent=
data.nickname+
" добавлен в друзья";

sendOnline({
type:"getFriends"
});

}


/* =========================
СПИСОК ДРУЗЕЙ
========================= */

if(data.type==="friendsList"){

cachedFriends=
data.friends || [];

renderFriends(
cachedFriends
);

renderLobbyFriends(
cachedFriends
);

}


/* =========================
СООБЩЕНИЕ ЛОББИ
========================= */

if(data.type==="lobbyMessage"){

lobbyMessage.textContent=
data.message || "";

}


/* =========================
ПРИГЛАШЕНИЕ
========================= */

if(data.type==="lobbyInvite"){

incomingLobbyFromID=
data.fromID;

lobbyInviteText.textContent=
data.fromNickname+
" приглашает тебя в лобби";

lobbyInvitePopup.style.display=
"block";

}


/* =========================
ПРИГЛАШЕНИЕ ПРИНЯТО
========================= */

if(data.type==="lobbyInviteAccepted"){

lobbyMessage.textContent=
data.nickname+
" вошёл в лобби";

}


/* =========================
СОСТОЯНИЕ ЛОББИ
========================= */

if(data.type==="lobbyState"){

currentLobbyMembers=
data.members || [];

renderLobbyMembers(
currentLobbyMembers
);

if(data.inLobby){

lobbyMessage.textContent=
currentLobbyMembers.length>=2
?"Лобби готово"
:"Ожидание второго игрока";

}

}


/* =========================
ОБЩИЙ ОТСЧЁТ
========================= */

if(data.type==="lobbyCountdown"){

showLobbyCountdown(
Number(data.startAt)
);

}


/* =========================
СЕРВЕР ЗАПУСТИЛ ИГРУ
========================= */

if(data.type==="startGame"){

launchLobbyGame();

}

}
);

}


/* ==========================
БЕЗОПАСНЫЙ ТЕКСТ
========================== */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==========================
СПИСОК ДРУЗЕЙ
========================== */

function renderFriends(friends){

friendsList.innerHTML="";

if(friends.length===0){

friendsList.innerHTML=
'<div style="color:#ffffff77;font-size:13px;padding:8px 0">Список пуст</div>';

return;

}

for(const friend of friends){

const item=
document.createElement("div");

item.className=
"friendItem";

item.innerHTML=
'<div><b>'+
escapeHTML(friend.nickname)+
'</b><br><span style="font-size:11px;color:#ffffff88">ID: '+
friend.id+
'</span></div>'+
'<div class="friendOnline">● ONLINE</div>';

friendsList.appendChild(
item
);

}

}


/* ==========================
ДРУЗЬЯ В ЛОББИ
========================== */

function renderLobbyFriends(friends){

lobbyFriendsList.innerHTML="";

if(friends.length===0){

lobbyFriendsList.innerHTML=
'<div style="color:#ffffff77;font-size:12px">Нет друзей онлайн</div>';

return;

}

for(const friend of friends){

const item=
document.createElement("div");

item.className=
"lobbyFriendItem";

const top=
document.createElement("div");

top.className=
"lobbyFriendTop";

top.innerHTML=
'<div>'+
'<div class="lobbyFriendName">'+
escapeHTML(friend.nickname)+
'</div>'+
'<div style="font-size:10px;color:#ffffff77">ID: '+
friend.id+
'</div>'+
'</div>'+
'<div class="lobbyFriendStatus">● ONLINE</div>';

const button=
document.createElement("button");

button.className=
"inviteLobbyButton";

button.textContent=
"ПРИГЛАСИТЬ В ЛОББИ";

button.addEventListener(
"touchstart",
e=>{

e.preventDefault();
e.stopPropagation();

sendOnline({
type:"inviteToLobby",
id:friend.id
});

lobbyMessage.textContent=
"Отправляем приглашение...";

},
{passive:false}
);

item.appendChild(top);
item.appendChild(button);

item.addEventListener(
"touchstart",
e=>{

if(
e.target.closest(
".inviteLobbyButton"
)
)
return;

e.preventDefault();
e.stopPropagation();

document
.querySelectorAll(
".lobbyFriendItem"
)
.forEach(el=>
el.classList.remove(
"selected"
)
);

item.classList.add(
"selected"
);

},
{passive:false}
);

lobbyFriendsList.appendChild(
item
);

}

}


/* ==========================
БОЕЦ ДЛЯ ЛОББИ
========================== */

function createPartySoldier(
nickname
){

const soldier=
document.createElement("div");

soldier.className=
"partySoldier";

soldier.innerHTML=`

<div class="partyHead"></div>

<div class="partyHelmet"></div>

<div class="partyHelmetFront"></div>

<div class="partyNeck"></div>

<div class="partyArm left"></div>

<div class="partyArm right"></div>

<div class="partyBody"></div>

<div class="partyVest"></div>

<div class="partyLeg left"></div>

<div class="partyLeg right"></div>

<div class="partyPlayerName">
${escapeHTML(nickname)}
</div>

`;

return soldier;

}


/* ==========================
ПОКАЗАТЬ ИГРОКОВ ЛОББИ
========================== */

function renderLobbyMembers(
members
){

const slot1=
document.getElementById(
"partySlot1"
);

const slot2=
document.getElementById(
"partySlot2"
);

slot1.innerHTML="";
slot2.innerHTML="";

slot1.classList.remove(
"empty"
);

slot2.classList.remove(
"empty"
);

let first=
members[0];

let second=
members[1];


/*
Если сервер ещё не прислал
состояние, показываем себя.
*/

if(!first){

first={
id:myOnlineID,
nickname:
myNickname ||
nicknameInput.value ||
"Игрок"
};

}


slot1.appendChild(
createPartySoldier(
first.nickname
)
);


if(second){

slot2.appendChild(
createPartySoldier(
second.nickname
)
);

}else{

slot2.classList.add(
"empty"
);

const waiting=
document.createElement(
"div"
);

waiting.style.position=
"absolute";

waiting.style.left=
"50%";

waiting.style.top=
"50%";

waiting.style.transform=
"translate(-50%,-50%)";

waiting.style.fontSize=
"55px";

waiting.style.color=
"#ffffff55";

waiting.textContent=
"+";

function blocked(x,y){

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyID=null;

function setJoy(x,y){

const r=
joystick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=40;

const dist=
Math.hypot(dx,dy);

if(dist>max){

dx=dx/dist*max;
dy=dy/dist*max;

}

joyX=dx/max;
joyY=dy/max;

stick.style.left=
(40+dx)+"px";

stick.style.top=
(40+dy)+"px";

}

function resetJoy(){

joyX=0;
joyY=0;
joyID=null;

stick.style.left="40px";
stick.style.top="40px";

}

joystick.addEventListener(
"touchstart",
e=>{

e.preventDefault();

if(joyID!==null)return;

const t=e.changedTouches[0];

joyID=t.identifier;

setJoy(
t.clientX,
t.clientY
);

},
{passive:false}
);

joystick.addEventListener(
"touchmove",
e=>{

e.preventDefault();

for(const t of e.changedTouches){

if(t.identifier===joyID){

setJoy(
t.clientX,
t.clientY
);

}

}

},
{passive:false}
);

joystick.addEventListener(
"touchend",
e=>{

for(const t of e.changedTouches){

if(t.identifier===joyID){

resetJoy();

}

}

}
);

joystick.addEventListener(
"touchcancel",
resetJoy
);

function updatePlayer(dt){

if(player.hp<=0)return;

const speed=270;

const forward=-joyY;
const strafe=joyX;

const dx=
(
Math.cos(player.angle)*forward-
Math.sin(player.angle)*strafe
)*
speed*
dt;

const dy=
(
Math.sin(player.angle)*forward+
Math.cos(player.angle)*strafe
)*
speed*
dt;

const nx=player.x+dx;
const ny=player.y+dy;

if(!blocked(nx,player.y))
player.x=nx;

if(!blocked(player.x,ny))
player.y=ny;

}

function updateEnemies(dt){

for(const enemy of enemies){

if(enemy.hp<=0){

enemy.el.style.display="none";

continue;

}

const dx=
player.x-enemy.x;

const dy=
player.y-enemy.y;

const distance=
Math.hypot(dx,dy);

if(
distance>120&&
distance<2400
){

const speed=
enemy.type==="fast"
?105
:65;

const ex=
dx/distance*
speed*
dt;

const ey=
dy/distance*
speed*
dt;

const nx=
enemy.x+ex;

const ny=
enemy.y+ey;

if(!blocked(nx,enemy.y))
enemy.x=nx;

if(!blocked(enemy.x,ny))
enemy.y=ny;

}

if(distance<750){

enemy.attack-=dt;

if(enemy.attack<=0){

enemy.attack=
enemy.type==="fast"
?0.65
:1.15;

enemyShoot(enemy);

}

}

showEnemy(enemy);

}

}


function enemyShoot(enemy){

if(player.hp<=0)return;

const dx=
player.x-enemy.x;

const dy=
player.y-enemy.y;

const distance=
Math.hypot(dx,dy);

let damage=4;

if(distance<300)
damage=9;

else if(distance<500)
damage=6;

player.hp=
Math.max(
0,
player.hp-damage
);

damageEffect();

}

========================== */

function showEnemy(enemy){

const dx=
enemy.x-player.x;

const dy=
enemy.y-player.y;

const distance=
Math.hypot(dx,dy);

let relative=
Math.atan2(dy,dx)-player.angle;

relative=
Math.atan2(
Math.sin(relative),
Math.cos(relative)
);

if(
Math.abs(relative)>
Math.PI/2
){

enemy.el.style.display="none";

return;

}

const sx=
window.innerWidth/2+
Math.tan(relative)*
window.innerWidth*.55;

const size=
Math.max(
25,
Math.min(
190,
70000/distance
)
);

enemy.el.style.display="block";

enemy.el.style.left=
sx+"px";

enemy.el.style.top=
(
window.innerHeight*.57+
cameraPitch*4
)+"px";

enemy.el.style.width=
size+"px";

enemy.el.style.height=
(size*2)+"px";

enemy.el.style.transform=
"translate(-50%,-50%)";

enemy.el
.querySelector(
".enemyHPInner"
)
.style.width=
Math.max(
0,
enemy.hp
)+"%";

}

/* ==========================
ОБЫЧНЫЙ ЗАПУСК ИГРЫ
========================== */

const menu=
document.getElementById("menu");

const countdown=
document.getElementById("countdown");

const countdownText=
document.getElementById("countdownText");

let gameStarted=false;


function startGame(){

if(gameStarted)return;

playButton.style.display=
"none";

countdown.style.display=
"block";

countdownText.style.display=
"block";

let number=5;

countdown.textContent=
number;

const timer=
setInterval(()=>{

number--;

if(number>=0){

countdown.textContent=
number;

}

if(number<0){

clearInterval(timer);

countdown.style.display=
"none";

countdownText.style.display=
"none";

menu.style.display=
"none";

gameStarted=true;

}

},1000);

}


playButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

startGame();

},
{passive:false}
);


/* ==========================
СЕРВЕРНЫЙ ОТСЧЁТ ЛОББИ
========================== */

function showLobbyCountdown(
startAt
){

if(lobbyCountdownTimer){

clearInterval(
lobbyCountdownTimer
);

lobbyCountdownTimer=null;

}

countdown.style.display=
"block";

countdownText.style.display=
"block";

countdownText.textContent=
"МАТЧ НАЧИНАЕТСЯ";

function update(){

const remaining=
startAt-Date.now();

let number=
Math.ceil(
remaining/1000
);

if(number<0)
number=0;

if(number>5)
number=5;

countdown.textContent=
number;

}

update();

lobbyCountdownTimer=
setInterval(
update,
100
);

}


/* ==========================
ЗАПУСК ОТ СЕРВЕРА
========================== */

function launchLobbyGame(){

if(lobbyCountdownTimer){

clearInterval(
lobbyCountdownTimer
);

lobbyCountdownTimer=null;

}

countdown.textContent=
"0";

setTimeout(
()=>{

countdown.style.display=
"none";

countdownText.style.display=
"none";

menu.style.display=
"none";

gameStarted=true;

},
120
);

}


/* ==========================
GAME OVER
========================== */

function gameOver(){

const screen=
document.getElementById(
"gameover"
);

if(
screen.style.display==="flex"
)
return;

screen.style.display="flex";

document
.getElementById("finalScore")
.textContent=
"KILLS: "+
kills;

}

document
.getElementById("restart")
.addEventListener(
"touchstart",
()=>{
location.reload();
}
);


/* ==========================
GAME LOOP
========================== */

let last=
performance.now();

function loop(now){

const dt=
Math.min(
.05,
(now-last)/1000
);

last=now;

if(
gameStarted&&
player.hp>0
){

updatePlayer(dt);
updateEnemies(dt);
updateBuildings();
updateMinimap();
updateHUD();

}else if(
gameStarted&&
player.hp<=0
){

gameOver();

}

requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>
