<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAHL1K FPS v2</title>
<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
    touch-action:none;
    font-family:Arial,sans-serif;
}
/* =========================
   ИГРОВОЙ МИР
========================= */
#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            #4f8197 0%,
            #a8c4ca 47%,
            #343a3d 47%,
            #343a3d 100%
        );
}
/* небо */
#sky{
    position:absolute;
    inset:0 0 47% 0;
    background:
        linear-gradient(
            #42758e,
            #a9c8d0
        );
}
/* земля */
#ground{
    position:absolute;
    left:0;
    right:0;
    top:47%;
    bottom:0;
    background:
        repeating-linear-gradient(
            0deg,
            #3b4144 0px,
            #3b4144 44px,
            #454b4e 45px,
            #454b4e 46px
        );
}
/* =========================
   ДОРОГИ
========================= */
.roadV{
    position:absolute;
    top:47%;
    bottom:0;
    left:30%;
    width:40%;
    background:#50575a;
    border-left:
        3px solid #656b6e;
    border-right:
        3px solid #656b6e;
}
.roadH{
    position:absolute;
    left:0;
    right:0;
    top:63%;
    height:28%;
    background:#50575a;
    border-top:
        3px solid #656b6e;
    border-bottom:
        3px solid #656b6e;
}
/* =========================
   ДОРОЖНАЯ РАЗМЕТКА
========================= */
.mark{
    position:absolute;
    background:#ddd;
    z-index:3;
}
.mark.v{
    width:7px;
    height:45px;
    left:calc(50% - 3px);
}
.mark.h{
    width:45px;
    height:7px;
    top:77%;
}
/* =========================
   ЗДАНИЯ
========================= */
.building{
    position:absolute;
    background:
        linear-gradient(
            135deg,
            #272b2d,
            #17191a
        );
    border:
        3px solid #71777a;
    box-shadow:
        inset 0 0 20px #0008;
    z-index:10;
}
/* =========================
   HUD
========================= */
#title{
    position:fixed;
    z-index:100;
    top:10px;
    left:50%;
    transform:
        translateX(-50%);
    color:white;
    font-size:23px;
    font-weight:bold;
    text-shadow:
        0 2px 5px #000;
}
#info{
    position:fixed;
    z-index:100;
    top:44px;
    left:15px;
    color:white;
    font-size:14px;
    font-weight:bold;
    text-shadow:
        0 2px 4px #000;
}
#hp{
    position:fixed;
    z-index:100;
    left:20px;
    bottom:20px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:
        0 2px 4px #000;
}
#ammo{
    position:fixed;
    z-index:100;
    right:20px;
    bottom:20px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:
        0 2px 4px #000;
}
/* =========================
   ПРИЦЕЛ
========================= */
#crosshair{
    position:fixed;
    z-index:100;
    left:50%;
    top:50%;
    width:32px;
    height:32px;
    transform:
        translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    left:0;
    top:15px;
    width:32px;
    height:2px;
    background:white;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:15px;
    top:0;
    width:2px;
    height:32px;
    background:white;
}
/* =========================
   ДЖОЙСТИК
========================= */
#joystick{
    position:fixed;
    z-index:200;
    left:25px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    border:
        3px solid #ffffff66;
    background:
        #ffffff18;
    touch-action:none;
}
#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ffffff70;
    border:
        2px solid white;
    pointer-events:none;
}
/* =========================
   КНОПКИ
========================= */
#fire{
    position:fixed;
    z-index:200;
    right:30px;
    bottom:95px;
    width:85px;
    height:85px;
    border-radius:50%;
    border:2px solid white;
    background:
        #a52c2ccc;
    color:white;
    font-weight:bold;
}
#reload{
    position:fixed;
    z-index:200;
    right:135px;
    bottom:35px;
    width:100px;
    height:45px;
    border-radius:12px;
    border:1px solid white;
    background:#222c;
    color:white;
    font-weight:bold;
}
/* =========================
   ОРУЖИЕ
========================= */
#weapon{
    position:fixed;
    z-index:80;
    left:50%;
    bottom:-15px;
    width:170px;
    height:130px;
    transform:
        translateX(-50%);
}
#gun{
    position:absolute;
    left:30px;
    bottom:0;
    width:110px;
    height:75px;
    background:#151718;
    border-radius:
        15px 15px 5px 5px;
    box-shadow:
        0 0 10px #000;
}
#barrel{
    position:absolute;
    left:72px;
    bottom:65px;
    width:25px;
    height:70px;
    background:#303537;
    border-radius:5px;
}
/* =========================
   ВРАГИ
========================= */
.enemy{
    position:absolute;
    z-index:30;
    transform:
        translate(-50%,-50%);
    width:60px;
    height:120px;
}
.enemyBody{
    position:absolute;
    left:12px;
    bottom:0;
    width:36px;
    height:75px;
    background:#a92f38;
    border-radius:
        8px 8px 2px 2px;
}
.enemyHead{
    position:absolute;
    left:16px;
    top:0;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#d49a78;
}
.enemyGun{
    position:absolute;
    left:40px;
    top:55px;
    width:45px;
    height:9px;
    background:#161818;
    transform:
        rotate(-8deg);
}
.enemyHP{
    position:absolute;
    left:0;
    top:-10px;
    width:60px;
    height:5px;
    background:#111;
}
.enemyHPInner{
    height:100%;
    width:100%;
    background:#39d36b;
}
/* =========================
   ВЕРТИКАЛЬНЫЙ ЭКРАН
========================= */
#rotate{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:24px;
}
@media(
    max-width:700px
) and (
    orientation:portrait
){
    #rotate{
        display:flex;
    }
}
</style>
</head>
<body>
<div id="game">
<div id="sky"></div>
<div id="ground"></div>
<div class="roadV"></div>
<div class="roadH"></div>
<!-- здания -->
<div
    class="building"
    id="b1">
</div>
<div
    class="building"
    id="b2">
</div>
<div
    class="building"
    id="b3">
</div>
<div
    class="building"
    id="b4">
</div>
<div
    class="building"
    id="b5">
</div>
<div
    class="building"
    id="b6">
</div>
<!-- разметка -->
<div
    class="mark v"
    style="top:55%">
</div>
<div
    class="mark v"
    style="top:67%">
</div>
<div
    class="mark v"
    style="top:80%">
</div>
<div
    class="mark v"
    style="top:91%">
</div>
</div>
<div id="title">
RAHL1K FPS
</div>
<div id="info">
POS: 1500 / 1100 &nbsp;&nbsp; ANGLE: 0°
</div>
<div id="hp">
HP 100
</div>
<div id="ammo">
30 / 90
</div>
<div id="crosshair"></div>
<div id="joystick">
<div id="stick"></div>
</div>
<button id="fire">
FIRE
</button>
<button id="reload">
RELOAD
</button>
<div id="weapon">
<div id="barrel"></div>
<div id="gun"></div>
</div>
<div id="rotate">
↔️
<br><br>
Поверни телефон горизонтально
</div>
<script>
/* =================================
   ИГРОК
================================= */
const player={
    x:1500,
    y:1100,
    angle:0,
    hp:100
};
/* =================================
   РАЗМЕР КАРТЫ
================================= */
const MAP_W=4000;
const MAP_H=3000;
/* =================================
   ЗДАНИЯ
================================= */
const buildings=[
    {
        x:300,
        y:300,
        w:800,
        h:350
    },
    {
        x:2750,
        y:300,
        w:800,
        h:350
    },
    {
        x:300,
        y:1900,
        w:800,
        h:400
    },
    {
        x:2750,
        y:1900,
        w:800,
        h:400
    },
    {
        x:1250,
        y:500,
        w:400,
        h:300
    },
    {
        x:2000,
        y:500,
        w:400,
        h:300
    }
];
/* =================================
   ПОКАЗ ЗДАНИЙ
================================= */
function updateBuildings(){
    const centerX=
        window.innerWidth/2;
    const centerY=
        window.innerHeight*0.60;
    for(
        let i=0;
        i<buildings.length;
        i++
    ){
        const b=
            buildings[i];
        const el=
            document.getElementById(
                "b"+(i+1)
            );
        const dx=
            b.x-player.x;
        const dy=
            b.y-player.y;
        /*
           учитываем направление
           взгляда
        */
        const cos=
            Math.cos(
                player.angle
            );
        const sin=
            Math.sin(
                player.angle
            );
        const forward=
            dx*cos+
            dy*sin;
        const side=
            -dx*sin+
            dy*cos;
        if(
            forward<
            -50
        ){
            el.style.display=
                "none";
            continue;
        }
        /*
           проекция
        */
        const f=
            Math.max(
                100,
                forward
            );
        const sx=
            centerX+
            side*
            0.55;
        const sy=
            centerY-
            12000/f;
        const scale=
            Math.min(
                2.5,
                Math.max(
                    0.15,
                    900/f
                )
            );
        const width=
            b.w*
            0.55*
            scale;
        const height=
            b.h*
            0.55*
            scale;
        el.style.display=
            "block";
        el.style.left=
            sx+"px";
        el.style.top=
            sy+"px";
        el.style.width=
            width+"px";
        el.style.height=
            height+"px";
    }
}
/* =================================
   СТОЛКНОВЕНИЯ
================================= */
function blocked(x,y){
    const r=28;
    /*
       границы
    */
    if(
        x<r ||
        y<r ||
        x>MAP_W-r ||
        y>MAP_H-r
    ){
        return true;
    }
    /*
       здания
    */
    for(
        const b of buildings
    ){
        if(
            x+r>b.x &&
            x-r<
            b.x+b.w &&
            y+r>b.y &&
            y-r<
            b.y+b.h
        ){
            return true;
        }
    }
    return false;
}
/* =================================
   ДЖОЙСТИК
================================= */
const joystick=
    document.getElementById(
        "joystick"
    );
const stick=
    document.getElementById(
        "stick"
    );
let joyX=0;
let joyY=0;
let joyID=null;
function setJoy(
    x,
    y
){
    const r=
        joystick.getBoundingClientRect();
    const cx=
        r.left+
        r.width/2;
    const cy=
        r.top+
        r.height/2;
    let dx=
        x-cx;
    let dy=
        y-cy;
    const max=40;
    const dist=
        Math.hypot(
            dx,
            dy
        );
    if(
        dist>max
    ){
        dx=
            dx/dist*
            max;
        dy=
            dy/dist*
            max;
    }
    joyX=
        dx/max;
    joyY=
        dy/max;
    stick.style.left=
        (40+dx)+"px";
    stick.style.top=
        (40+dy)+"px";
}
function resetJoy(){
    joyX=0;
    joyY=0;
    joyID=null;
    stick.style.left=
        "40px";
    stick.style.top=
        "40px";
}
joystick.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        if(
            joyID!==null
        )
            return;
        const t=
            e.changedTouches[0];
        joyID=
            t.identifier;
        setJoy(
            t.clientX,
            t.clientY
        );
    },
    {passive:false}
);
joystick.addEventListener(
    "touchmove",
    e=>{
        e.preventDefault();
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.identifier===
                joyID
            ){
                setJoy(
                    t.clientX,
                    t.clientY
                );
            }
        }
    },
    {passive:false}
);
joystick.addEventListener(
    "touchend",
    e=>{
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.identifier===
                joyID
            ){
                resetJoy();
            }
        }
    }
);
joystick.addEventListener(
    "touchcancel",
    resetJoy
);
/* =================================
   КАМЕРА 360°
================================= */
let lookID=null;
let lastLookX=0;
document.addEventListener(
    "touchstart",
    e=>{
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.clientX>
                window.innerWidth*
                0.42 &&
                !t.target.closest(
                    "#fire,#reload"
                )
            ){
                lookID=
                    t.identifier;
                lastLookX=
                    t.clientX;
            }
        }
    },
    {passive:false}
);
document.addEventListener(
    "touchmove",
    e=>{
        if(
            lookID===null
        )
            return;
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.identifier===
                lookID
            ){
                e.preventDefault();
                const dx=
                    t.clientX-
                    lastLookX;
                /*
                   свободный поворот
                   360°
                   720°
                   1080°
                   ...
                */
                player.angle+=
                    dx*
                    0.008;
                lastLookX=
                    t.clientX;
            }
        }
    },
    {passive:false}
);
document.addEventListener(
    "touchend",
    e=>{
        for(
            const t of
            e.changedTouches
        ){
            if(
                t.identifier===
                lookID
            ){
                lookID=null;
            }
        }
    }
);
/* =================================
   ДВИЖЕНИЕ
================================= */
function updatePlayer(dt){
    const speed=270;
    const forward=
        -joyY;
    const strafe=
        joyX;
    /*
       движение относительно
       камеры
    */
    const dx=
        (
            Math.cos(
                player.angle
            )*
            forward
            -
            Math.sin(
                player.angle
            )*
            strafe
        )*
        speed*
        dt;
    const dy=
        (
            Math.sin(
                player.angle
            )*
            forward
            +
            Math.cos(
                player.angle
            )*
            strafe
        )*
        speed*
        dt;
    const nx=
        player.x+
        dx;
    const ny=
        player.y+
        dy;
    /*
       X
    */
    if(
        !blocked(
            nx,
            player.y
        )
    ){
        player.x=
            nx;
    }
    /*
       Y
    */
    if(
        !blocked(
            player.x,
            ny
        )
    ){
        player.y=
            ny;
    }
}
/* =================================
   ВРАГИ
================================= */
const enemies=[
    {
        x:700,
        y:900,
        hp:100,
        el:null
    },
    {
        x:3300,
        y:900,
        hp:100,
        el:null
    },
    {
        x:700,
        y:2500,
        hp:100,
        el:null
    },
    {
        x:3300,
        y:2500,
        hp:100,
        el:null
    },
    {
        x:1800,
        y:2200,
        hp:100,
        el:null
    }
];
function createEnemies(){
    for(
        const enemy of enemies
    ){
        const el=
            document.createElement(
                "div"
            );
        el.className=
            "enemy";
        el.innerHTML=`
            <div class="enemyHP">
                <div class="enemyHPInner"></div>
            </div>
            <div class="enemyHead"></div>
            <div class="enemyBody"></div>
            <div class="enemyGun"></div>
        `;
        document
        .getElementById(
            "game"
        )
        .appendChild(el);
        enemy.el=
            el;
    }
}
createEnemies();
/* =================================
   ВРАГИ НА ЭКРАНЕ
================================= */
function updateEnemies(){
    const cx=
        window.innerWidth/2;
    const cy=
        window.innerHeight*
        0.57;
    for(
        const enemy of enemies
    ){
        if(
            enemy.hp<=0
        ){
            enemy.el.style.display=
                "none";
            continue;
        }
        const dx=
            enemy.x-
            player.x;
        const dy=
            enemy.y-
            player.y;
        const distance=
            Math.hypot(
                dx,
                dy
            );
        let relative=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;
        relative=
            Math.atan2(
                Math.sin(relative),
                Math.cos(relative)
            );
        /*
           за спиной
        */
        if(
            Math.abs(relative)>
            Math.PI/2
        ){
            enemy.el.style.display=
                "none";
            continue;
        }
        /*
           положение по X
        */
        const sx=
            cx+
            Math.tan(
                relative
            )*
            window.innerWidth*
            0.55;
        /*
           размер
        */
        const size=
            Math.max(
                25,
                Math.min(
                    190,
                    70000/
                    distance
                )
            );
        enemy.el.style.display=
            "block";
        enemy.el.style.left=
            sx+"px";
        enemy.el.style.top=
            cy+"px";
        enemy.el.style.width=
            size+"px";
        enemy.el.style.height=
            (size*2)+"px";
        const hp=
            enemy.el.querySelector(
                ".enemyHPInner"
            );
        hp.style.width=
            Math.max(
                0,
                enemy.hp
            )+"%";
    }
}
/* =================================
   СТРЕЛЬБА
================================= */
let ammo=30;
let reserve=90;
const fire=
    document.getElementById(
        "fire"
    );
fire.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        shoot();
    },
    {passive:false}
);
function shoot(){
    if(
        ammo<=0
    ){
        reload();
        return;
    }
    ammo--;
    let target=null;
    let closest=
        Infinity;
    for(
        const enemy of enemies
    ){
        if(
            enemy.hp<=0
        )
            continue;
        const dx=
            enemy.x-
            player.x;
        const dy=
            enemy.y-
            player.y;
        const distance=
            Math.hypot(
                dx,
                dy
            );
        let a=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;
        a=
            Math.atan2(
                Math.sin(a),
                Math.cos(a)
            );
        /*
           примерно в центре
        */
        if(
            Math.abs(a)<
            0.11 &&
            distance<
            1400 &&
            distance<
            closest
        ){
            target=
                enemy;
            closest=
                distance;
        }
    }
    if(
        target
    ){
        target.hp-=50;
    }
    /*
       отдача
    */
    const weapon=
        document.getElementById(
            "weapon"
        );
    weapon.style.transform=
        "translateX(-50%) translateY(15px)";
    setTimeout(
        ()=>{
            weapon.style.transform=
                "translateX(-50%)";
        },
        70
    );
}
/* =================================
   ПЕРЕЗАРЯДКА
================================= */
function reload(){
    if(
        ammo>=30 ||
        reserve<=0
    )
        return;
    const need=
        30-ammo;
    const amount=
        Math.min(
            need,
            reserve
        );
    ammo+=amount;
    reserve-=amount;
}
document
.getElementById(
    "reload"
)
.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        reload();
    },
    {passive:false}
);
/* =================================
   HUD
================================= */
function updateHUD(){
    let angle=
        player.angle*
        180/
        Math.PI;
    angle=
        (
            angle%360+
            360
        )%360;
    document
    .getElementById(
        "info"
    )
    .innerHTML=
        "POS: "+
        Math.round(
            player.x
        )+
        " / "+
        Math.round(
            player.y
        )+
        "&nbsp;&nbsp; ANGLE: "+
        Math.round(
            angle
        )+
        "°";
    document
    .getElementById(
        "hp"
    )
    .textContent=
        "HP "+
        Math.max(
            0,
            Math.round(
                player.hp
            )
        );
    document
    .getElementById(
        "ammo"
    )
    .textContent=
        ammo+
        " / "+
        reserve;
}
/* =================================
   ИГРОВОЙ ЦИКЛ
================================= */
let last=
    performance.now();
function loop(now){
    const dt=
        Math.min(
            0.05,
            (now-last)/1000
        );
    last=now;
    updatePlayer(dt);
    updateBuildings();
    updateEnemies();
    updateHUD();
    requestAnimationFrame(
        loop
    );
}
requestAnimationFrame(
    loop
);
</script>
</body>
</html>
