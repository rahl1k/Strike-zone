<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>rahl1k FPS TEST</title>
<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
    touch-action:none;
    font-family:Arial,sans-serif;
}
#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}
#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    z-index:10;
}
#title{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}
#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:24px;
    height:24px;
    transform:translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    left:0;
    top:11px;
    width:24px;
    height:2px;
    background:white;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:11px;
    top:0;
    width:2px;
    height:24px;
    background:white;
}
/* =====================
   ДЖОЙСТИК
===================== */
#joystick{
    position:fixed;
    left:25px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:#ffffff18;
    border:3px solid #ffffff66;
    z-index:100;
    touch-action:none;
}
#stick{
    position:absolute;
    left:41px;
    top:41px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#ffffff66;
    border:2px solid #ffffffaa;
    pointer-events:none;
}
/* =====================
   ПОДСКАЗКА
===================== */
#info{
    position:absolute;
    top:48px;
    left:50%;
    transform:translateX(-50%);
    font-size:14px;
    white-space:nowrap;
    text-shadow:0 2px 4px #000;
}
</style>
</head>
<body>
<div id="hud">
<div id="title">
    rahl1k FPS TEST
</div>
<div id="info">
    JOYSTICK + SWIPE
</div>
<div id="crosshair"></div>
</div>
<div id="joystick">
<div id="stick"></div>
</div>
<script>
/* ==================================================
   CANVAS
================================================== */
const canvas =
    document.getElementById("game");
const ctx =
    canvas.getContext("2d");
let W=0;
let H=0;
let DPR=1;
function resize(){
    W=window.innerWidth;
    H=window.innerHeight;
    DPR=
        Math.min(
            window.devicePixelRatio || 1,
            2
        );
    canvas.width=
        W*DPR;
    canvas.height=
        H*DPR;
    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}
window.addEventListener(
    "resize",
    resize
);
resize();
/* ==================================================
   ИГРОК
================================================== */
const player={
    x:500,
    y:500,
    angle:0
};
/* ==================================================
   ПРОСТАЯ КАРТА
================================================== */
const walls=[
    {
        x:200,
        y:200,
        w:1000,
        h:100
    },
    {
        x:200,
        y:200,
        w:100,
        h:800
    },
    {
        x:1100,
        y:200,
        w:100,
        h:800
    },
    {
        x:200,
        y:900,
        w:1000,
        h:100
    },
    {
        x:600,
        y:500,
        w:100,
        h:400
    }
];
/* ==================================================
   СТОЛКНОВЕНИЕ
================================================== */
function collides(x,y){
    const r=20;
    for(
        const w of walls
    ){
        if(
            x+r>w.x &&
            x-r<w.x+w.w &&
            y+r>w.y &&
            y-r<w.y+w.h
        ){
            return true;
        }
    }
    return false;
}
/* ==================================================
   ДЖОЙСТИК
================================================== */
const joystick =
    document.getElementById(
        "joystick"
    );
const stick =
    document.getElementById(
        "stick"
    );
let joyX=0;
let joyY=0;
let joyActive=false;
let joyId=null;
function setJoystick(
    x,
    y
){
    const r=
        joystick.getBoundingClientRect();
    const centerX=
        r.left+
        r.width/2;
    const centerY=
        r.top+
        r.height/2;
    let dx=
        x-centerX;
    let dy=
        y-centerY;
    const max=45;
    const distance=
        Math.hypot(dx,dy);
    if(
        distance>max
    ){
        dx=
            dx/distance*
            max;
        dy=
            dy/distance*
            max;
    }
    joyX=
        dx/max;
    joyY=
        dy/max;
    stick.style.left=
        (41+dx)+"px";
    stick.style.top=
        (41+dy)+"px";
}
function resetJoystick(){
    joyActive=false;
    joyId=null;
    joyX=0;
    joyY=0;
    stick.style.left="41px";
    stick.style.top="41px";
}
/* TOUCH START */
joystick.addEventListener(
    "touchstart",
    function(e){
        e.preventDefault();
        const t=
            e.changedTouches[0];
        joyActive=true;
        joyId=
            t.identifier;
        setJoystick(
            t.clientX,
            t.clientY
        );
    },
    {passive:false}
);
/* TOUCH MOVE */
joystick.addEventListener(
    "touchmove",
    function(e){
        e.preventDefault();
        if(!joyActive)
            return;
        for(
            const t of e.changedTouches
        ){
            if(
                t.identifier===
                joyId
            ){
                setJoystick(
                    t.clientX,
                    t.clientY
                );
                break;
            }
        }
    },
    {passive:false}
);
/* TOUCH END */
joystick.addEventListener(
    "touchend",
    function(e){
        e.preventDefault();
        for(
            const t of e.changedTouches
        ){
            if(
                t.identifier===
                joyId
            ){
                resetJoystick();
                break;
            }
        }
    },
    {passive:false}
);
/* ==================================================
   СВАЙП КАМЕРЫ
================================================== */
let lookId=null;
let lastLookX=0;
canvas.addEventListener(
    "touchstart",
    function(e){
        for(
            const t of e.changedTouches
        ){
            /*
              Правая часть экрана
            */
            if(
                t.clientX>
                W*0.45
            ){
                lookId=
                    t.identifier;
                lastLookX=
                    t.clientX;
                break;
            }
        }
    },
    {passive:false}
);
canvas.addEventListener(
    "touchmove",
    function(e){
        e.preventDefault();
        if(
            lookId===null
        )
            return;
        for(
            const t of e.changedTouches
        ){
            if(
                t.identifier===
                lookId
            ){
                const dx=
                    t.clientX-
                    lastLookX;
                player.angle +=
                    dx*0.008;
                lastLookX=
                    t.clientX;
                break;
            }
        }
    },
    {passive:false}
);
canvas.addEventListener(
    "touchend",
    function(e){
        for(
            const t of e.changedTouches
        ){
            if(
                t.identifier===
                lookId
            ){
                lookId=null;
                break;
            }
        }
    }
);
/* ==================================================
   ДВИЖЕНИЕ
================================================== */
function updatePlayer(dt){
    const speed=220;
    /*
       Вверх джойстика =
       движение вперёд
    */
    const forward=
        -joyY;
    const side=
        joyX;
    const dx=
        (
            Math.cos(player.angle)*
            forward
            -
            Math.sin(player.angle)*
            side
        )*
        speed*
        dt;
    const dy=
        (
            Math.sin(player.angle)*
            forward
            +
            Math.cos(player.angle)*
            side
        )*
        speed*
        dt;
    const nx=
        player.x+dx;
    const ny=
        player.y+dy;
    if(
        !collides(
            nx,
            player.y
        )
    ){
        player.x=nx;
    }
    if(
        !collides(
            player.x,
            ny
        )
    ){
        player.y=ny;
    }
}
/* ==================================================
   RAYCAST
================================================== */
function raycast(angle){
    const max=1200;
    const step=5;
    for(
        let d=1;
        d<max;
        d+=step
    ){
        const x=
            player.x+
            Math.cos(angle)*
            d;
        const y=
            player.y+
            Math.sin(angle)*
            d;
        if(
            x<0 ||
            y<0 ||
            x>1400 ||
            y>1200
        ){
            return d;
        }
        for(
            const wall of walls
        ){
            if(
                x>=wall.x &&
                x<=wall.x+wall.w &&
                y>=wall.y &&
                y<=wall.y+wall.h
            ){
                return d;
            }
        }
    }
    return max;
}
/* ==================================================
   FPS РЕНДЕР
================================================== */
function draw(){
    /*
       НЕБО
    */
    ctx.fillStyle=
        "#6e858f";
    ctx.fillRect(
        0,
        0,
        W,
        H/2
    );
    /*
       ПОЛ
    */
    ctx.fillStyle=
        "#30383b";
    ctx.fillRect(
        0,
        H/2,
        W,
        H/2
    );
    /*
       Линии пола
    */
    ctx.strokeStyle=
        "#465054";
    ctx.lineWidth=2;
    for(
        let i=1;
        i<12;
        i++
    ){
        const y=
            H/2+
            (H/2)*
            i/12;
        ctx.beginPath();
        ctx.moveTo(
            0,
            y
        );
        ctx.lineTo(
            W,
            y
        );
        ctx.stroke();
    }
    /*
       СТЕНЫ
    */
    const fov=
        Math.PI/3;
    const rays=
        Math.min(
            240,
            Math.floor(W/3)
        );
    const projection=
        (W/2)/
        Math.tan(fov/2);
    for(
        let i=0;
        i<rays;
        i++
    ){
        const screenX=
            i*
            W/rays;
        const angle=
            player.angle-
            fov/2+
            (i/rays)*
            fov;
        let distance=
            raycast(angle);
        distance *=
            Math.cos(
                angle-
                player.angle
            );
        distance=
            Math.max(
                1,
                distance
            );
        const wallHeight=
            projection/
            distance*
            100;
        const top=
            H/2-
            wallHeight/2;
        const brightness=
            Math.max(
                35,
                180-distance/7
            );
        ctx.fillStyle=
            "rgb("+
            brightness*0.65+
            ","+
            brightness*0.72+
            ","+
            brightness*0.75+
            ")";
        ctx.fillRect(
            screenX,
            top,
            W/rays+1,
            wallHeight
        );
    }
    /*
       ОРУЖИЕ-ЗАГЛУШКА
    */
    ctx.fillStyle="#111";
    ctx.fillRect(
        W/2-55,
        H-85,
        110,
        70
    );
    ctx.fillStyle="#555";
    ctx.fillRect(
        W/2-10,
        H-125,
        20,
        55
    );
}
/* ==================================================
   GAME LOOP
================================================== */
let last=
    performance.now();
function loop(now){
    const dt=
        Math.min(
            0.05,
            (now-last)/1000
        );
    last=now;
    updatePlayer(dt);
    draw();
    requestAnimationFrame(
        loop
    );
}
requestAnimationFrame(
    loop
);
</script>
</body>
</html>
