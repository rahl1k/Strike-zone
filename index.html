<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RAHL1K FPS</title>
<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
    background:#222;
}
#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}
#title{
    position:fixed;
    z-index:20;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:23px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}
#info{
    position:fixed;
    z-index:20;
    top:45px;
    left:15px;
    color:white;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#hp{
    position:fixed;
    z-index:20;
    left:20px;
    bottom:20px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#ammo{
    position:fixed;
    z-index:20;
    right:20px;
    bottom:20px;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}
#crosshair{
    position:fixed;
    z-index:20;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    transform:translate(-50%,-50%);
}
#crosshair:before{
    content:"";
    position:absolute;
    top:14px;
    left:0;
    width:30px;
    height:2px;
    background:white;
}
#crosshair:after{
    content:"";
    position:absolute;
    left:14px;
    top:0;
    width:2px;
    height:30px;
    background:white;
}
/* Джойстик */
#joystick{
    position:fixed;
    z-index:100;
    left:25px;
    bottom:25px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:#ffffff18;
    border:3px solid #ffffff66;
    touch-action:none;
}
#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ffffff66;
    border:2px solid #fff;
    pointer-events:none;
}
/* Кнопки */
button{
    position:fixed;
    z-index:100;
    color:white;
    font-weight:bold;
    border:1px solid #ffffff66;
    background:#222c;
    touch-action:none;
}
#fire{
    right:30px;
    bottom:95px;
    width:85px;
    height:85px;
    border-radius:50%;
    background:#a52222cc;
}
#reload{
    right:135px;
    bottom:35px;
    width:100px;
    height:45px;
    border-radius:12px;
}
#rotate{
    display:none;
    position:fixed;
    z-index:1000;
    inset:0;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:24px;
}
</style>
</head>
<body>
<div id="title">RAHL1K FPS</div>
<div id="info">POS: 0 / 0 &nbsp; ANGLE: 0°</div>
<div id="hp">HP 100</div>
<div id="ammo">30 / 90</div>
<div id="crosshair"></div>
<div id="joystick">
    <div id="stick"></div>
</div>

FIRE
RELOAD

<div id="rotate">
    ↔️
    <br><br>
    Поверни телефон горизонтально
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=0;
let H=0;
let DPR=1;
function resize(){
    W=innerWidth;
    H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=W*DPR;
    canvas.height=H*DPR;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    document.getElementById("rotate").style.display=
        H>W ? "flex" : "none";
}
addEventListener("resize",resize);
resize();
/* =========================
   ИГРОК
========================= */
const MAP_W=3000;
const MAP_H=2200;
const player={
    x:1500,
    y:1100,
    angle:0,
    hp:100
};
/* =========================
   ДЖОЙСТИК
========================= */
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joyX=0;
let joyY=0;
let joyID=null;
function setJoystick(x,y){
    const r=joystick.getBoundingClientRect();
    let dx=x-(r.left+r.width/2);
    let dy=y-(r.top+r.height/2);
    const max=40;
    const d=Math.hypot(dx,dy);
    if(d>max){
        dx=dx/d*max;
        dy=dy/d*max;
    }
    /*
       ВАЖНО:
       dx вправо = +X
       dx влево = -X
       dy вниз = +Y
       dy вверх = -Y
    */
    joyX=dx/max;
    joyY=dy/max;
    stick.style.left=(40+dx)+"px";
    stick.style.top=(40+dy)+"px";
}
function resetJoystick(){
    joyX=0;
    joyY=0;
    joyID=null;
    stick.style.left="40px";
    stick.style.top="40px";
}
joystick.addEventListener("touchstart",e=>{
    e.preventDefault();
    if(joyID!==null)return;
    const t=e.changedTouches[0];
    joyID=t.identifier;
    setJoystick(t.clientX,t.clientY);
},{passive:false});
joystick.addEventListener("touchmove",e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
        if(t.identifier===joyID){
            setJoystick(
                t.clientX,
                t.clientY
            );
        }
    }
},{passive:false});
joystick.addEventListener("touchend",e=>{
    for(const t of e.changedTouches){
        if(t.identifier===joyID){
            resetJoystick();
        }
    }
},{passive:false});
joystick.addEventListener("touchcancel",resetJoystick);
/* =========================
   КАМЕРА
========================= */
let lookID=null;
let lastLookX=0;
document.addEventListener("touchstart",e=>{
    for(const t of e.changedTouches){
        if(
            t.clientX>W*0.45 &&
            t.target!==joystick &&
            t.target!==document.getElementById("fire") &&
            t.target!==document.getElementById("reload")
        ){
            lookID=t.identifier;
            lastLookX=t.clientX;
        }
    }
},{passive:false});
document.addEventListener("touchmove",e=>{
    if(lookID===null)return;
    for(const t of e.changedTouches){
        if(t.identifier===lookID){
            e.preventDefault();
            const dx=t.clientX-lastLookX;
            player.angle+=dx*0.006;
            if(player.angle>Math.PI*2)
                player.angle-=Math.PI*2;
            if(player.angle<0)
                player.angle+=Math.PI*2;
            lastLookX=t.clientX;
        }
    }
},{passive:false});
document.addEventListener("touchend",e=>{
    for(const t of e.changedTouches){
        if(t.identifier===lookID){
            lookID=null;
        }
    }
});
/* =========================
   КАРТА
========================= */
const obstacles=[
    {x:250,y:250,w:600,h:150},
    {x:250,y:250,w:150,h:650},
    {x:1200,y:200,w:650,h:150},
    {x:1700,y:200,w:150,h:600},
    {x:500,y:1200,w:700,h:150},
    {x:500,y:1200,w:150,h:650},
    {x:1750,y:1200,w:700,h:150},
    {x:2300,y:1200,w:150,h:650},
    {x:1200,y:750,w:550,h:120},
    {x:1200,y:1500,w:550,h:120}
];
/* =========================
   ВРАГИ
========================= */
let bots=[
    {x:2400,y:400,hp:100},
    {x:2200,y:900,hp:100},
    {x:2400,y:1900,hp:100},
    {x:700,y:1850,hp:100},
    {x:1500,y:1850,hp:100}
];
/* =========================
   СТОЛКНОВЕНИЯ
========================= */
function blocked(x,y){
    const r=25;
    if(
        x<r ||
        y<r ||
        x>MAP_W-r ||
        y>MAP_H-r
    ){
        return true;
    }
    for(const o of obstacles){
        if(
            x+r>o.x &&
            x-r<o.x+o.w &&
            y+r>o.y &&
            y-r<o.y+o.h
        ){
            return true;
        }
    }
    return false;
}
/* =========================
   ДВИЖЕНИЕ
========================= */
function updatePlayer(dt){
    const speed=240;
    /*
       НИКАКОГО ПОВОРОТА ОСЕЙ.
       Стик вверх:
       joyY = -1
       => y уменьшается
       => движение вверх.
       Стик вниз:
       joyY = +1
       => y увеличивается
       => движение вниз.
       Стик влево:
       joyX = -1
       => x уменьшается.
       Стик вправо:
       joyX = +1
       => x увеличивается.
    */
    const dx=joyX*speed*dt;
    const dy=joyY*speed*dt;
    const nx=player.x+dx;
    const ny=player.y+dy;
    if(!blocked(nx,player.y))
        player.x=nx;
    if(!blocked(player.x,ny))
        player.y=ny;
}
/* =========================
   РИСОВАНИЕ
========================= */
function draw(){
    ctx.clearRect(0,0,W,H);
    /* небо */
    ctx.fillStyle="#6594aa";
    ctx.fillRect(0,0,W,H/2);
    /* земля */
    ctx.fillStyle="#3b4144";
    ctx.fillRect(0,H/2,W,H/2);
    /* сетка */
    ctx.strokeStyle="#4d5457";
    ctx.lineWidth=1;
    const grid=100;
    for(
        let x=0;
        x<=MAP_W;
        x+=grid
    ){
        const sx=
            W/2+
            (x-player.x);
        if(sx>-100&&sx<W+100){
            ctx.beginPath();
            ctx.moveTo(sx,H/2);
            ctx.lineTo(sx,H);
            ctx.stroke();
        }
    }
    for(
        let y=0;
        y<=MAP_H;
        y+=grid
    ){
        const sy=
            H/2+
            (y-player.y)*0.4;
        if(sy>H/2&&sy<H+100){
            ctx.beginPath();
            ctx.moveTo(0,sy);
            ctx.lineTo(W,sy);
            ctx.stroke();
        }
    }
    /* стены */
    for(const o of obstacles){
        const sx=
            W/2+
            (o.x-player.x);
        const sy=
            H/2+
            (o.y-player.y)*0.4;
        const sw=o.w;
        const sh=o.h*0.4;
        ctx.fillStyle="#202427";
        ctx.fillRect(sx,sy,sw,sh);
        ctx.strokeStyle="#899196";
        ctx.strokeRect(sx,sy,sw,sh);
    }
    /* враги */
    for(const bot of bots){
        if(bot.hp<=0)continue;
        const dx=bot.x-player.x;
        const dy=bot.y-player.y;
        /*
           Враг показывается
           в соответствии с
           положением на карте.
        */
        const sx=
            W/2+
            dx;
        const sy=
            H/2+
            dy*0.4;
        const distance=
            Math.max(
                100,
                Math.hypot(dx,dy)
            );
        const size=
            Math.max(
                20,
                500/distance*100
            );
        if(
            sx>-100 &&
            sx<W+100 &&
            sy>H/2-100 &&
            sy<H+100
        ){
            ctx.fillStyle="#c72f36";
            ctx.fillRect(
                sx-size*.3,
                sy-size,
                size*.6,
                size
            );
            ctx.fillStyle="#d9a17e";
            ctx.beginPath();
            ctx.arc(
                sx,
                sy-size*1.15,
                size*.25,
                0,
                Math.PI*2
            );
            ctx.fill();
            /* HP */
            ctx.fillStyle="#111";
            ctx.fillRect(
                sx-size*.45,
                sy-size*1.55,
                size*.9,
                5
            );
            ctx.fillStyle="#31d06b";
            ctx.fillRect(
                sx-size*.45,
                sy-size*1.55,
                size*.9*(bot.hp/100),
                5
            );
        }
    }
    /* оружие */
    ctx.fillStyle="#111";
    ctx.fillRect(
        W/2-55,
        H-85,
        110,
        85
    );
    ctx.fillStyle="#555";
    ctx.fillRect(
        W/2-10,
        H-135,
        20,
        60
    );
}
/* =========================
   HUD
========================= */
function updateHUD(){
    document.getElementById("info").innerHTML=
        "POS: "+
        Math.round(player.x)+
        " / "+
        Math.round(player.y)+
        "&nbsp;&nbsp; ANGLE: "+
        Math.round(
            player.angle*180/Math.PI
        )+
        "°";
    document.getElementById("hp").textContent=
        "HP "+Math.max(0,Math.round(player.hp));
    document.getElementById("ammo").textContent=
        ammo+" / "+reserve;
}
/* =========================
   СТРЕЛЬБА
========================= */
let ammo=30;
let reserve=90;
document.getElementById("fire")
.addEventListener("touchstart",e=>{
    e.preventDefault();
    if(ammo<=0){
        reload();
        return;
    }
    ammo--;
    /*
       Проверяем врага
       около центра экрана.
    */
    let target=null;
    let closest=Infinity;
    for(const bot of bots){
        if(bot.hp<=0)continue;
        const dx=bot.x-player.x;
        const dy=bot.y-player.y;
        const distance=
            Math.hypot(dx,dy);
        const screenX=
            W/2+dx;
        const screenY=
            H/2+dy*0.4;
        const crossX=W/2;
        const crossY=H/2;
        const dist=
            Math.hypot(
                screenX-crossX,
                screenY-crossY
            );
        if(
            dist<45 &&
            distance<1200 &&
            distance<closest
        ){
            target=bot;
            closest=distance;
        }
    }
    if(target){
        target.hp-=50;
    }
},{passive:false});
/* =========================
   ПЕРЕЗАРЯДКА
========================= */
function reload(){
    if(ammo>=30||reserve<=0)
        return;
    const amount=
        Math.min(
            30-ammo,
            reserve
        );
    ammo+=amount;
    reserve-=amount;
}
document.getElementById("reload")
.addEventListener("touchstart",e=>{
    e.preventDefault();
    reload();
},{passive:false});
/* =========================
   GAME LOOP
========================= */
let last=performance.now();
function loop(now){
    const dt=
        Math.min(
            0.05,
            (now-last)/1000
        );
    last=now;
    updatePlayer(dt);
    updateHUD();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
