name: Butterfly Server Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply server patch
        run: python3 tools/add_butterfly_server.py
      - name: Commit server.js
        run: |
          if git diff --quiet -- server.js; then
            echo "No server changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Support Butterfly Legacy on server"
          git push origin HEAD:main
