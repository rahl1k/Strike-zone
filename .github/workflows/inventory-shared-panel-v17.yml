name: Inventory Shared Panel V17
on:
  push:
    paths:
      - '.github/workflows/inventory-shared-panel-v17.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/inventory_shared_panel_v17.py
      - run: grep -q 'RAHL1K INVENTORY SHARED PANEL V17' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use shared bottom apply panel for Butterfly and Karambit'
          git push