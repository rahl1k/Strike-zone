name: Special Knives V20
on:
  push:
    paths:
      - '.github/workflows/special-knives-v20.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/special_knives_v20.py
      - run: grep -q 'RAHL1K SPECIAL KNIVES V20' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Butterfly selection and restore Karambit card'
          git push