name: Fix Friend Invite
on:
  push:
    paths:
      - '.github/workflows/fix-friend-invite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- RAHL1K FRIEND INVITE DIRECT FIX V2 -->'
          if marker not in s:
              addon='''\n<!-- RAHL1K FRIEND INVITE DIRECT FIX V2 -->\n<style>\n.lobbyFriendItem .inviteLobbyButton{display:none!important}\n.lobbyFriendItem.selected .inviteLobbyButton{display:block!important}\n</style>\n<script>\n(function(){\n const list=document.getElementById('lobbyFriendsList');\n if(!list)return;\n function selectFriend(e){\n   const row=e.target.closest('.lobbyFriendItem');\n   if(!row||!list.contains(row)||e.target.closest('.inviteLobbyButton'))return;\n   e.preventDefault();\n   list.querySelectorAll('.lobbyFriendItem').forEach(x=>x.classList.remove('selected'));\n   row.classList.add('selected');\n }\n list.addEventListener('pointerdown',selectFriend,{passive:false});\n list.addEventListener('click',selectFriend,{passive:false});\n list.addEventListener('touchend',selectFriend,{passive:false});\n})();\n</script>\n'''
              s=s.replace('</body>',addon+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix friend invite button interaction"
            git push
          fi