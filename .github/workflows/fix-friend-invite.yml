name: Fix Friend Invite
on:
  push:
    paths:
      - '.github/workflows/fix-friend-invite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch friend invite click
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- RAHL1K FRIEND INVITE CLICK FIX -->'
          if marker not in s:
            addon=r'''
<!-- RAHL1K FRIEND INVITE CLICK FIX -->
<script>
(function(){
  function bindInviteRows(){
    const panel=document.getElementById('lobbyFriendsPanel');
    if(!panel)return;
    panel.addEventListener('click',function(e){
      const row=e.target.closest('.lobbyFriendItem');
      if(!row || !panel.contains(row))return;
      if(e.target.closest('.inviteLobbyButton'))return;
      panel.querySelectorAll('.lobbyFriendItem.selected').forEach(function(x){if(x!==row)x.classList.remove('selected')});
      row.classList.toggle('selected');
    });
    panel.addEventListener('touchend',function(e){
      const row=e.target.closest('.lobbyFriendItem');
      if(!row || !panel.contains(row) || e.target.closest('.inviteLobbyButton'))return;
      if(e.cancelable)e.preventDefault();
      panel.querySelectorAll('.lobbyFriendItem.selected').forEach(function(x){if(x!==row)x.classList.remove('selected')});
      row.classList.toggle('selected');
    },{passive:false});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bindInviteRows);
  else bindInviteRows();
})();
</script>
'''
            s=s.replace('</body>',addon+'\n</body>')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix lobby friend invite button selection'
            git push
          fi