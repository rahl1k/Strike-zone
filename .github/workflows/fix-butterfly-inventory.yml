name: Fix Butterfly Inventory
on:
  push:
    paths:
      - '.github/workflows/fix-butterfly-inventory.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- RAHL1K BUTTERFLY INVENTORY BRIDGE FIX V3 -->'
          addon=r'''
<!-- RAHL1K BUTTERFLY INVENTORY BRIDGE FIX V3 -->
<style>
#weapon.butterfly-draw-v3{animation:bfDrawV3 1.35s cubic-bezier(.16,.8,.22,1) both}
#weapon.butterfly-draw-v3 #butterflyLegacy{animation:bfBodyV3 1.35s linear both}
#weapon.butterfly-draw-v3 #bfBlade{animation:bfBladeV3 1.35s ease-in-out both}
#weapon.butterfly-draw-v3 #bfA{animation:bfAV3 1.35s ease-in-out both}
#weapon.butterfly-draw-v3 #bfB{animation:bfBV3 1.35s ease-in-out both}
@keyframes bfDrawV3{0%{transform:translateX(-50%) translate(52px,74px) rotate(28deg) scale(.72)}12%{transform:translateX(-50%) translate(12px,24px) rotate(-30deg) scale(.92)}28%{transform:translateX(-50%) translate(-8px,-18px) rotate(46deg) scale(1.05)}46%{transform:translateX(-50%) translate(10px,-22px) rotate(-44deg) scale(1.09)}64%{transform:translateX(-50%) translate(-6px,-16px) rotate(36deg) scale(1.07)}82%{transform:translateX(-50%) translate(4px,-8px) rotate(-20deg) scale(1.03)}100%{transform:translateX(-50%) rotate(0) scale(1)}}
@keyframes bfBodyV3{0%{transform:translateX(-50%) rotate(110deg)}14%{transform:translateX(-50%) rotate(-150deg)}30%{transform:translateX(-50%) rotate(170deg)}48%{transform:translateX(-50%) rotate(-155deg)}66%{transform:translateX(-50%) rotate(130deg)}84%{transform:translateX(-50%) rotate(-80deg)}100%{transform:translateX(-50%) rotate(-10deg)}}
@keyframes bfBladeV3{0%,10%{transform:rotate(176deg)}26%{transform:rotate(-42deg)}44%{transform:rotate(74deg)}62%{transform:rotate(-58deg)}80%{transform:rotate(32deg)}100%{transform:rotate(0)}}
@keyframes bfAV3{0%{transform:rotate(176deg)}18%{transform:rotate(-168deg)}36%{transform:rotate(154deg)}54%{transform:rotate(-146deg)}72%{transform:rotate(118deg)}88%{transform:rotate(-54deg)}100%{transform:rotate(8deg)}}
@keyframes bfBV3{0%{transform:rotate(-176deg)}18%{transform:rotate(168deg)}36%{transform:rotate(-154deg)}54%{transform:rotate(146deg)}72%{transform:rotate(-118deg)}88%{transform:rotate(54deg)}100%{transform:rotate(-8deg)}}
#weapon.inspect-butterfly-v3{animation:bfInspectV3 2.85s cubic-bezier(.18,.74,.2,1) both}
#weapon.inspect-butterfly-v3 #butterflyLegacy{animation:bfInspectBodyV3 2.85s linear both}
#weapon.inspect-butterfly-v3 #bfA{animation:bfInspectAV3 2.85s ease-in-out both}
#weapon.inspect-butterfly-v3 #bfB{animation:bfInspectBV3 2.85s ease-in-out both}
@keyframes bfInspectV3{0%{transform:translateX(-50%)}10%{transform:translateX(-50%) translate(-5px,-48px) rotate(-16deg) scale(1.08)}22%{transform:translateX(-50%) translate(10px,-72px) rotate(38deg) scale(1.16)}38%{transform:translateX(-50%) translate(-12px,-60px) rotate(-34deg) scale(1.18)}54%{transform:translateX(-50%) translate(11px,-68px) rotate(46deg) scale(1.19)}70%{transform:translateX(-50%) translate(-9px,-58px) rotate(-42deg) scale(1.18)}86%{transform:translateX(-50%) translate(6px,-34px) rotate(54deg) scale(1.12)}100%{transform:translateX(-50%)}}
@keyframes bfInspectBodyV3{0%{transform:translateX(-50%) rotate(-10deg)}12%{transform:translateX(-50%) rotate(120deg)}26%{transform:translateX(-50%) rotate(-205deg)}40%{transform:translateX(-50%) rotate(195deg)}56%{transform:translateX(-50%) rotate(-185deg)}72%{transform:translateX(-50%) rotate(215deg)}86%{transform:translateX(-50%) rotate(-260deg)}95%{transform:translateX(-50%) rotate(55deg)}100%{transform:translateX(-50%) rotate(-10deg)}}
@keyframes bfInspectAV3{0%{transform:rotate(8deg)}12%{transform:rotate(165deg)}26%{transform:rotate(-178deg)}40%{transform:rotate(188deg)}56%{transform:rotate(-162deg)}72%{transform:rotate(176deg)}86%{transform:rotate(-225deg)}100%{transform:rotate(8deg)}}
@keyframes bfInspectBV3{0%{transform:rotate(-8deg)}12%{transform:rotate(-165deg)}26%{transform:rotate(178deg)}40%{transform:rotate(-188deg)}56%{transform:rotate(162deg)}72%{transform:rotate(-176deg)}86%{transform:rotate(225deg)}100%{transform:rotate(-8deg)}}
</style>
<script>
(function(){
  const we=document.getElementById('weapon'); if(!we)return;
  const KEY='rahl1k_butterfly_legacy_v1';
  const side=()=>{try{return String(myTeam||'CT').toLowerCase()==='t'?'t':'ct'}catch(e){return 'ct'}};
  const state=()=>{try{return Object.assign({ct:true,t:true},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {ct:true,t:true}}};
  const bfAllowed=()=>!!state()[side()];
  const m9Allowed=()=>{try{return !!(window.RAHL1K_INVENTORY&&window.RAHL1K_INVENTORY.isAllowed&&window.RAHL1K_INVENTORY.isAllowed('knife'))}catch(e){return false}};
  function showBF(){['gun','barrel','pistol','knife'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none'});const b=document.getElementById('butterflyLegacy');if(b)b.style.display='block';const a=document.getElementById('ammo');if(a)a.style.display='none';const r=document.getElementById('reload');if(r)r.style.display='none';const f=document.getElementById('fire');if(f){f.style.display='block';f.textContent='ATTACK'}const i=document.getElementById('weaponSwipeIcon');if(i)i.textContent='🦋'}
  function drawBF(){we.classList.remove('butterfly-draw','butterfly-draw-v2','butterfly-draw-v3','inspect-butterfly','inspect-butterfly-v2','inspect-butterfly-v3','butterfly-attack');void we.offsetWidth;we.classList.add('butterfly-draw-v3');setTimeout(()=>we.classList.remove('butterfly-draw-v3'),1400)}
  function selectBF(){if(!bfAllowed())return false;try{cancelInspect()}catch(e){}currentWeapon='butterfly';showBF();drawBF();return true}
  if(window.RAHL1K_BUTTERFLY){window.RAHL1K_BUTTERFLY.select=selectBF;window.RAHL1K_BUTTERFLY.allowed=bfAllowed}else window.RAHL1K_BUTTERFLY={select:selectBF,allowed:bfAllowed};
  const originalSwitch=switchWeapon;let last='knife';
  switchWeapon=function(type){
    if(type==='butterfly')return selectBF();
    if(type==='knife'){
      const m=m9Allowed(),b=bfAllowed();
      if(!m&&!b){try{showWeaponUnavailableMessage&&showWeaponUnavailableMessage()}catch(e){}return false}
      let target;if(m&&b){target=last==='knife'?'butterfly':'knife';last=target}else target=b?'butterfly':'knife';
      if(target==='butterfly')return selectBF();
      const bf=document.getElementById('butterflyLegacy');if(bf)bf.style.display='none';
      return originalSwitch.call(this,'knife');
    }
    const bf=document.getElementById('butterflyLegacy');if(bf)bf.style.display='none';
    return originalSwitch.apply(this,arguments);
  };
  const originalInspect=inspectWeapon;
  inspectWeapon=function(){if(currentWeapon!=='butterfly')return originalInspect.apply(this,arguments);if(!gameStarted||respawning||matchEnded||matchMenuOpen||player.hp<=0||inspectingWeapon||knifeAttackAnimating)return;inspectingWeapon=true;we.classList.remove('inspect-butterfly','inspect-butterfly-v2','inspect-butterfly-v3','butterfly-draw','butterfly-draw-v2','butterfly-draw-v3');void we.offsetWidth;we.classList.add('inspect-butterfly-v3');if(inspectTimer)clearTimeout(inspectTimer);inspectTimer=setTimeout(()=>{we.classList.remove('inspect-butterfly-v3');inspectingWeapon=false;inspectTimer=null},2900)};
})();
</script>
'''
          for old in ['<!-- RAHL1K BUTTERFLY INVENTORY BRIDGE FIX V2 -->','<!-- RAHL1K BUTTERFLY INVENTORY BRIDGE FIX -->']:
              while old in s:
                  start=s.find(old); end=s.find('</script>',start)
                  if end==-1: break
                  s=s[:start]+s[end+9:]
          if marker not in s:s=s.replace('</body>',addon+'\n</body>')
          s=s.replace('<title>RAHL1K FPS v13 BUTTERFLY LEGACY</title>','<title>RAHL1K FPS v13.3 BUTTERFLY FIXED</title>')
          s=s.replace('<title>RAHL1K FPS v13.1 BUTTERFLY FIX</title>','<title>RAHL1K FPS v13.3 BUTTERFLY FIXED</title>')
          s=s.replace('<title>RAHL1K FPS v13.2 BUTTERFLY WORKING</title>','<title>RAHL1K FPS v13.3 BUTTERFLY FIXED</title>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Butterfly knife and requested animations'
            git push
          fi