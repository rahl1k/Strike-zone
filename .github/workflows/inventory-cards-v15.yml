name: Inventory Cards V15
on:
  push:
    paths:
      - '.github/workflows/inventory-cards-v15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/inventory_cards_v15.py
      - run: |
          grep -q 'RAHL1K INVENTORY CARDS V15' index.html
          grep -q 'KARAMBIT' index.html
          grep -q 'inventoryWeapons' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix horizontal inventory and Karambit apply buttons'
          git push