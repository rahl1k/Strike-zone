name: Visible Floor V9
on:
  push:
    paths:
      - '.github/workflows/floor-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/floor_v9.py
      - run: grep -q 'RAHL1K VISIBLE FLOOR V9 START' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make floor clearly visible on both maps'
          git push