name: Inventory Special Fix V18
on:
  push:
    paths:
      - '.github/workflows/inventory-special-fix-v18.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/inventory_special_fix_v18.py
      - run: |
          grep -q 'RAHL1K INVENTORY SPECIAL FIX V18' index.html
          ! grep -q 'RAHL1K INVENTORY SHARED PANEL V17' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Butterfly apply and Karambit inventory panel'
          git push