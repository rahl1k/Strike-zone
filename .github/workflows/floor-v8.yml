name: Floor V8
on:
  push:
    paths:
      - '.github/workflows/floor-v8.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/add_floor_v8.py
      - run: grep -q 'RAHL1K FLOOR V8 START' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add grounded perspective floors to both maps'
          git push