name: Inventory Router V22
on:
  push:
    paths:
      - '.github/workflows/inventory-router-v22.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/inventory_router_v22.py
      - run: |
          grep -q 'RAHL1K INVENTORY ROUTER V22' index.html
          ! grep -q 'RAHL1K INVENTORY ROUTER V21' index.html
          grep -q 'karambitInventoryCard' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix inventory card touch and per-weapon apply'
          git push