name: Sandstone Floor V11
on:
  push:
    paths:
      - '.github/workflows/floor-v11.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/floor_v11.py
      - run: grep -q 'warm stone floor like the reference image' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use sandstone tile floor like reference'
          git push