name: Held Viewmodel V13
on:
  push:
    paths:
      - '.github/workflows/viewmodel-grip-v13.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/viewmodel_grip_v13.py
      - run: grep -q 'RAHL1K HELD VIEWMODEL V13' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate hands with held weapons like FPS references'
          git push