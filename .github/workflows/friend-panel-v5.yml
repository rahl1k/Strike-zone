name: Friend Panel V5
on:
  push:
    paths:
      - '.github/workflows/friend-panel-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/friend_panel_v5.py
      - run: |
          grep -q 'RAHL1K FRIEND PANEL V5' index.html
          grep -q 'rahlLobbyFriendsPanel' index.html
          grep -q 'ПРИГЛАСИТЬ В ЛОББИ' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add separate lobby friends invite panel'
          git push